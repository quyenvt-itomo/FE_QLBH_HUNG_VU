/* ---------- Kinh doanh > Tổng quan ---------- */
function renderAnSaleOverview() {
  const r = periodRange(AN.period), rp = prevRange(AN.period);
  const cur = aggregate(r), prv = aggregate(rp);
  const days = daysOf(r);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const byDay = f => days.map(d => invs.filter(iv => iv.time.startsWith(dmy(d))).reduce((s, iv) => s + f(invStats(iv)), 0));

  const series = [
    { name: 'Doanh thu', color: '#16A34A', data: byDay(m => m.revenue) },
    { name: 'Trả hàng', color: '#DC2626', data: days.map(d => RETURNS.filter(x => x.time.startsWith(dmy(d))).reduce((s, x) => s + x.value, 0)) },
    { name: 'Tổng giá vốn', color: '#D97706', data: byDay(m => m.cost) },
    { name: 'Lợi nhuận gộp', color: '#2563EB', data: byDay(m => m.profit) },
  ];
  const kpi = (label, val, avg, c, p) => {
    const d = pct(c, p), cls = d >= 0 ? 'up' : 'down';
    return `<div class="an-kpi">
      <div class="k-l">${label}</div><div class="k-v">${val}</div>
      <div class="k-f"><span>Trung bình/ngày<b>${avg}</b></span><span>So với kỳ trước<b class="${cls}">${p ? fmtPct(d) : '—'}</b></span></div>
    </div>`;
  };

  const gBranch = groupAgg(invs, iv => iv.branch, invStats);
  const branchRows = [...gBranch].map(([k, v]) => {
    const rs = RETURNS.filter(x => x.branch === k && inRange(x.time, r));
    const ret = rs.reduce((s, x) => s + x.value, 0);
    const retCost = rs.reduce((s, x) => s + x.items.reduce((a, it) => a + it.cost * it.qty, 0), 0);
    return { name: k, ...v, returnValue: ret, netAfterReturn: v.net - ret, costAfterReturn: v.cost - retCost, profitAfterReturn: (v.net - ret) - (v.cost - retCost) };
  });

  const body = `
  ${anHead('Tổng quan kinh doanh')}
  <div class="an-kpis">
    ${kpi('Số hóa đơn', fmt(cur.bills), (cur.bills / cur.days).toFixed(2), cur.bills, prv.bills)}
    ${kpi('Doanh thu', fmtTr(cur.revenue), fmt(Math.round(cur.revenue / cur.days)), cur.revenue, prv.revenue)}
    ${kpi('Giá trị trả', fmtTr(cur.returnValue), fmt(Math.round(cur.returnValue / cur.days)), cur.returnValue, prv.returnValue)}
    ${kpi('Doanh thu thuần', fmtTr(cur.netAfterReturn), fmt(Math.round(cur.netAfterReturn / cur.days)), cur.netAfterReturn, prv.netAfterReturn)}
    ${kpi('Tổng giá vốn', fmtTr(cur.costAfterReturn), fmt(Math.round(cur.costAfterReturn / cur.days)), cur.costAfterReturn, prv.costAfterReturn)}
    ${kpi('Lợi nhuận gộp', fmtTr(cur.profitAfterReturn), fmt(Math.round(cur.profitAfterReturn / cur.days)), cur.profitAfterReturn, prv.profitAfterReturn)}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Chỉ số kinh doanh</div></div>
    <div class="card-body">${lineChartSVG(days.map(dm), series)}</div>
    <div class="chart-legend">${series.map(s => `<span><i class="lg-dot" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Chi nhánh</div></div>
    ${simpleTable([
      { t: 'Chi nhánh', k: 'name' }, { t: 'Doanh thu', k: 'revenue', a: 'r' },
      { t: 'Trả hàng', k: 'returnValue', a: 'r' }, { t: 'Doanh thu thuần', k: 'netAfterReturn', a: 'r' },
      { t: 'Tổng giá vốn', k: 'costAfterReturn', a: 'r' }, { t: 'Lợi nhuận gộp', k: 'profitAfterReturn', a: 'r' },
    ], branchRows, cur)}
  </div>`;
  return anShell('an-sale-overview', body);
}

/* ---------- Kinh doanh > Chi phí - Lợi nhuận ---------- */
function renderAnSaleProfit() {
  const r = periodRange(AN.period), rp = prevRange(AN.period);
  const cur = aggregate(r), prv = aggregate(rp);
  const exp = expensesFor(r), expP = expensesFor(rp);
  const otherIncome = Math.round(cur.vat * 0.05);
  const netProfit = cur.profitAfterReturn - exp.total + otherIncome;

  const cats = exp.rows.map((e, i) => ({ n: e.name, v: e.amount, c: CAT_C[i % CAT_C.length] }));
  const dRow = (label, val, prev) => {
    const d = pct(val, prev), cls = d >= 0 ? 'up' : 'down';
    return `<div class="kpi-slim"><div class="l">${label}</div><div class="v">${typeof val === 'number' ? fmtTr(val) : val}</div>
      <div class="d">So với kỳ trước <b class="${cls}">${prev ? fmtPct(d) : '—'}</b></div></div>`;
  };

  const body = `
  ${anHead('Chi phí - Lợi nhuận')}
  <div class="kpi-strip" style="grid-template-columns:repeat(5,1fr)">
    ${slimKpi('Doanh thu thuần', fmtTr(cur.netAfterReturn))}
    ${slimKpi('Lợi nhuận gộp', fmtTr(cur.profitAfterReturn))}
    ${slimKpi('Tổng chi phí', fmtTr(exp.total))}
    ${slimKpi('Thu nhập khác', fmtTr(otherIncome))}
    ${slimKpi('Lợi nhuận thuần', fmtTr(netProfit))}
  </div>

  <div class="card-title" style="margin-bottom:10px">Chi phí hoạt động</div>
  <div class="split-2" style="grid-template-columns:240px minmax(320px,1fr); margin-bottom:16px">
    <div style="display:flex; flex-direction:column; gap:14px">
      ${dRow('Tổng chi phí', exp.total, expP.total)}
      ${dRow('Chi phí TB/ngày', Math.round(exp.total / exp.days), Math.round(expP.total / expP.days))}
      <div class="kpi-slim"><div class="l">Chi phí/doanh thu</div>
        <div class="v">${(cur.netAfterReturn ? exp.total / cur.netAfterReturn * 100 : 0).toFixed(2)}%</div>
        <div class="d">Trên doanh thu thuần trong kỳ</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">Cơ cấu chi phí</div></div>
      <div class="card-body pie-wrap">
        ${pieSVG(cats, 200)}
        <div class="pie-legend">
          ${cats.map(c => `<div class="row"><i style="background:${c.c}"></i><span class="nm">${c.n}</span>
            <span class="pc">${(c.v / exp.total * 100).toFixed(2)}%</span><b>${fmt(c.v)}</b></div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Danh mục chi phí</div></div>
    ${simpleTable([
      { t: 'Tên chi phí', k: 'name' },
      { t: 'Chi nhánh trung tâm', k: 'b1', a: 'r' }, { t: 'Chi nhánh 2', k: 'b2', a: 'r' },
      { t: 'Tổng', k: 'amount', a: 'r', f: (v, row) => row.diff === undefined ? fmt(v)
        : `${fmt(v)} <span style="color:${row.diff >= 0 ? 'var(--green-700)' : 'var(--red-600)'}">(${fmtPct(row.diff)})</span>` },
      { t: 'Tỷ trọng', k: 'amount', a: 'r', f: v => (exp.total ? v / exp.total * 100 : 0).toFixed(2) + '%' },
    ], exp.rows.map((e, i) => {
      const p = expP.rows[i] ? expP.rows[i].amount : 0;
      return { ...e, b1: Math.round(e.amount * 0.7), b2: e.amount - Math.round(e.amount * 0.7), diff: pct(e.amount, p) };
    }), { amount: exp.total, b1: Math.round(exp.total * 0.7), b2: exp.total - Math.round(exp.total * 0.7) })}
  </div>`;
  return anShell('an-sale-profit', body);
}

/* ---------- Hàng hóa > Tổng quan ---------- */
function renderAnProdOverview() {
  const r = periodRange(AN.period);
  const days = daysOf(r);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const lineStat = it => {
    const p = PRODUCTS.find(x => x.code === it.code) || { cost: 0 };
    const rev = (it.price - (it.disc || 0)) * it.qty;
    return { qty: it.qty, revenue: rev, profit: rev - p.cost * it.qty };
  };
  const lines = invs.flatMap(iv => iv.items);
  const totQty = lines.reduce((s, it) => s + it.qty, 0);
  const totRev = lines.reduce((s, it) => s + lineStat(it).revenue, 0);
  const totProfit = lines.reduce((s, it) => s + lineStat(it).profit, 0);
  const skus = new Set(lines.map(it => it.code)).size;
  const sparkOf = f => days.map(d => invs.filter(iv => iv.time.startsWith(dmy(d))).flatMap(iv => iv.items).reduce((s, it) => s + f(it), 0));

  /* Số lượng trả theo mã hàng */
  const retQty = code => RETURNS.filter(x => inRange(x.time, r)).flatMap(x => x.items).filter(i => i.code === code).reduce((s, i) => s + i.qty, 0);

  const mk = (keyFn, nameFn) => {
    const g = groupAgg(lines, keyFn, lineStat);
    return [...g].map(([k, v]) => ({ name: nameFn(k), key: k, ...v, ret: retQty(k) }));
  };
  const groupsRows = (() => {
    const g = groupAgg(lines, it => (PRODUCTS.find(p => p.code === it.code) || {}).group || '—', lineStat);
    return [...g].map(([k, v]) => ({ name: k, ...v, ret: 0 }));
  })();
  const prodRows = mk(it => it.code, k => (PRODUCTS.find(p => p.code === k) || {}).name);

  const sortRows = rows => [...rows].sort((a, b) => AN.topScope === 'fast'
    ? b[AN.topMetric] - a[AN.topMetric] : a[AN.topMetric] - b[AN.topMetric]).slice(0, 6);

  const pills = `<div class="pills" style="margin-left:auto">
    ${[['qty', 'Theo số lượng bán'], ['revenue', 'Theo doanh thu thuần'], ['profit', 'Theo lợi nhuận gộp']].map(([k, l]) =>
      `<button class="${AN.topMetric === k ? 'active' : ''}" onclick="anSet('topMetric','${k}')">${l}</button>`).join('')}
  </div>`;
  const scopeTabs = `<div class="an-tabs" style="padding:0 16px">
    ${[['fast', 'Bán chạy'], ['slow', 'Bán chậm']].map(([k, l]) =>
      `<button class="${AN.topScope === k ? 'active' : ''}" onclick="anSet('topScope','${k}')">${l}</button>`).join('')}
  </div>`;
  const topCols = nameLabel => [
    { t: nameLabel, k: 'name' }, { t: 'Số lượng bán', k: 'qty', a: 'r' },
    { t: 'Số lượng trả', k: 'ret', a: 'r' }, { t: 'Doanh thu thuần', k: 'revenue', a: 'r' },
    { t: 'Lợi nhuận gộp', k: 'profit', a: 'r' },
  ];

  const body = `
  ${anHead('Tổng quan hàng hóa')}
  <div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">
    ${slimKpi('Số mặt hàng đã bán', fmt(skus), '', sparkSVG(sparkOf(it => 1)))}
    ${slimKpi('Số lượng thực bán', fmt(totQty), '', sparkSVG(sparkOf(it => it.qty)))}
    ${slimKpi('Doanh thu thuần TB/SP', fmt(skus ? Math.round(totRev / skus) : 0), '', sparkSVG(sparkOf(it => lineStat(it).revenue)))}
    ${slimKpi('Lợi nhuận gộp TB/SP', fmt(skus ? Math.round(totProfit / skus) : 0), '', sparkSVG(sparkOf(it => lineStat(it).profit), '#2563EB'))}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Top nhóm hàng</div>${pills}</div>
    ${scopeTabs}
    ${simpleTable(topCols('Tên nhóm hàng'), sortRows(groupsRows))}
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Top hàng hóa</div></div>
    ${simpleTable(topCols('Tên hàng'), sortRows(prodRows))}
  </div>`;
  return anShell('an-prod-overview', body);
}

/* ---------- Hàng hóa > Tồn kho ---------- */
function renderAnProdStock() {
  const goods = PRODUCTS.filter(p => p.type !== 'Dịch vụ');
  const inStock = goods.filter(p => p.stock > 0);
  const totQty = goods.reduce((s, p) => s + p.stock, 0);
  const totVal = goods.reduce((s, p) => s + p.stock * p.cost, 0);
  const r = periodRange('all');
  const sold = groupAgg(INVOICES.filter(iv => iv.status !== 'cancel').flatMap(iv => iv.items), it => it.code, it => ({ qty: it.qty }));

  const outToday = goods.filter(p => p.stock <= 0);
  const daily = p => { const s = (sold.get(p.code) || {}).qty || 0; return s / 30; };
  const out7  = goods.filter(p => p.stock > 0 && daily(p) > 0 && p.stock / daily(p) <= 7);
  const out30 = goods.filter(p => p.stock > 0 && daily(p) > 0 && p.stock / daily(p) <= 30);
  const noSale = goods.filter(p => !sold.has(p.code));
  const overStock = goods.filter(p => p.stock > p.max);

  const gGroup = groupAgg(goods, p => p.group, p => ({ qty: p.stock, value: p.stock * p.cost }));
  const groupRows = [...gGroup].map(([k, v]) => ({ name: k, ...v }))
    .sort((a, b) => b[AN.stockMetric === 'qty' ? 'qty' : 'value'] - a[AN.stockMetric === 'qty' ? 'qty' : 'value']);

  const body = `
  ${anHead('Tồn kho', { noDate: true })}
  <div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">
    ${slimKpi('Số mặt hàng còn tồn', fmt(inStock.length))}
    ${slimKpi('Tồn kho', fmt(totQty))}
    ${slimKpi('Giá trị tồn kho', fmtTr(totVal))}
  </div>

  <div class="card-title" style="margin-bottom:10px">Cảnh báo hết hàng</div>
  <div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">
    <div class="warn-card"><div class="wt"><i style="background:var(--red-600)"></i>Hết hàng hôm nay</div>
      <div class="wv">${outToday.length} <span>hàng hóa</span></div>
      ${outToday.length ? `<div class="link-more" onclick="location.hash='#/products-list'">Chi tiết</div>` : ''}</div>
    <div class="warn-card"><div class="wt"><i style="background:var(--amber-600)"></i>Hết hàng trong 7 ngày tới</div>
      <div class="wv">${out7.length} <span>hàng hóa</span></div>
      ${out7.length ? `<div class="link-more" onclick="location.hash='#/products-list'">Chi tiết</div>` : ''}</div>
    <div class="warn-card"><div class="wt"><i style="background:#94A3B8"></i>Hết hàng trong 30 ngày tới</div>
      <div class="wv">${out30.length} <span>hàng hóa</span></div>
      ${out30.length ? `<div class="link-more" onclick="location.hash='#/products-list'">Chi tiết</div>` : ''}</div>
  </div>

  <div class="card-title" style="margin-bottom:10px">Cảnh báo tồn kho</div>
  <div class="kpi-strip" style="grid-template-columns:repeat(2,1fr)">
    <div class="warn-card"><div class="wt"><i style="background:var(--red-600)"></i>Không bán được</div>
      <div class="wv">${noSale.length} <span>hàng hóa</span></div>
      <div class="wd">Dự kiến giá trị hàng lưu kho ${fmtTr(noSale.reduce((s, p) => s + p.stock * p.cost, 0))}</div>
      <div class="link-more" onclick="location.hash='#/products-list'">Chi tiết</div></div>
    <div class="warn-card"><div class="wt"><i style="background:#8B5CF6"></i>Tồn kho cao vượt mức tiêu thụ</div>
      <div class="wv">${overStock.length} <span>hàng hóa</span></div>
      <div class="wd">Dự kiến giá trị hàng lưu kho ${fmtTr(overStock.reduce((s, p) => s + p.stock * p.cost, 0))}</div>
      <div class="link-more" onclick="location.hash='#/products-list'">Chi tiết</div></div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Top nhóm hàng</div>
      <div class="pills" style="margin-left:auto">
        ${[['qty', 'Theo tồn kho'], ['value', 'Theo giá trị tồn kho']].map(([k, l]) =>
          `<button class="${AN.stockMetric === k ? 'active' : ''}" onclick="anSet('stockMetric','${k}')">${l}</button>`).join('')}
      </div>
    </div>
    ${simpleTable([{ t: 'Tên nhóm hàng', k: 'name' }, { t: 'Tồn kho', k: 'qty', a: 'r' }, { t: 'Giá trị tồn kho', k: 'value', a: 'r' }],
      groupRows, { qty: totQty, value: totVal })}
  </div>`;
  return anShell('an-prod-stock', body);
}

/* ---------- Khách hàng > Tổng quan ---------- */
function renderAnCustOverview() {
  const r = periodRange(AN.period);
  const days = daysOf(r);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const KINDS = [['cu', 'Khách cũ', '#16A34A'], ['moi', 'Khách mới', '#2563EB'], ['le', 'Khách lẻ', '#94A3B8']];

  const custOf = iv => custKind(iv.custCode, r);
  const uniq = k => new Set(invs.filter(iv => custOf(iv) === k).map(iv => iv.custCode + (k === 'le' ? iv.code : ''))).size;
  const revOf = k => invs.filter(iv => custOf(iv) === k).reduce((s, iv) => s + iv.sub, 0);

  const custPie = KINDS.map(([k, n, c]) => ({ n, v: uniq(k), c }));
  const revPie = KINDS.map(([k, n, c]) => ({ n, v: revOf(k), c }));
  const totCust = custPie.reduce((s, x) => s + x.v, 0);
  const totRev = revPie.reduce((s, x) => s + x.v, 0);

  const custSeries = KINDS.map(([k, n, c]) => ({ name: n, color: c, data: days.map(d => new Set(invs.filter(iv => iv.time.startsWith(dmy(d)) && custOf(iv) === k).map(iv => iv.custCode + (k === 'le' ? iv.code : ''))).size) }));

    <div class="card"><div class="card-head"><div class="card-title">Tổng doanh thu</div></div>
      <div class="card-body">
        <div style="font-size:22px;font-weight:700;margin-bottom:10px">${fmtTr(totRev)}</div>
        <div style="text-align:center">${pieSVG(revPie, 190)}</div>
        ${legend(revPie, totRev, true)}
      </div></div>
  </div>

  <div class="grid-2">
    <div class="card"><div class="card-head"><div class="card-title">Lượng khách</div></div>
      <div class="card-body">${stackedBarSVG(days.map(dm), custSeries)}</div>
      <div class="chart-legend">${custSeries.map(s => `<span><i class="lg-dot" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div></div>

  return anShell('an-cust-overview', body);
}

/* ---------- Khách hàng > Phân loại khách hàng ---------- */
function renderAnCustClass() {
  const r = periodRange(AN.period);
  const codes = [...new Set(INVOICES.filter(iv => iv.status !== 'cancel').map(iv => iv.custCode))];
  const segOf = {};
  codes.forEach(c => segOf[c] = custSegment(c));
  const segList = CUST_SEGS.map(([n, d], i) => ({
    n, d, c: CAT_C[i],
    codes: codes.filter(c => segOf[c] === n),
  }));
  const tree = segList.map(s => ({ n: s.n, v: s.codes.length, c: s.c })).filter(x => x.v > 0);

  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const sumBy = (seg, f) => invs.filter(iv => segOf[iv.custCode] === seg).reduce((s, iv) => s + f(iv), 0);
  const bars = f => segList.map(s => ({ n: s.n, c: s.c, v: sumBy(s.n, f) }));
  const retBars = segList.map(s => ({
    n: s.n, c: s.c,
    v: RETURNS.filter(x => inRange(x.time, r)).filter(x => {
      const iv = INVOICES.find(i => i.code === x.invoice);
      return iv && segOf[iv.custCode] === s.n;
    }).reduce((sum, x) => sum + x.value, 0),
  }));

  const body = `
  ${anHead('Phân loại khách hàng', { noDate: true, sub: `Dữ liệu tổng hợp trên toàn bộ danh sách khách hàng và giao dịch đến ${dmy(TODAY)}` })}
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Nhóm khách hàng</div></div>
    <div class="card-body split-2">
      <div>${treemapSVG(tree)}</div>
      <div class="cls-legend">
        ${segList.map(s => `<div class="cls-row">
          <div class="nm"><i style="background:${s.c}"></i>${s.n}</div>
          <div class="ct">${s.codes.length}</div>
          <div>${sparkSVG(s.codes.map(c => INVOICES.filter(iv => iv.custCode === c).length).concat([0]), s.c, 70, 26)}</div>
          <div class="ds">${s.d}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><div class="card-title">Doanh thu</div></div>
      <div class="card-body">${hbarSVG(bars(iv => iv.sub))}</div></div>
    <div class="card"><div class="card-head"><div class="card-title">Trả hàng</div></div>
      <div class="card-body">${hbarSVG(retBars)}</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-head"><div class="card-title">Lợi nhuận gộp</div></div>
      <div class="card-body">${hbarSVG(bars(iv => invStats(iv).profit))}</div></div>
    <div class="card"><div class="card-head"><div class="card-title">Số hóa đơn</div></div>
      <div class="card-body">${hbarSVG(bars(() => 1), v => fmt(Math.round(v)))}</div></div>
  </div>`;
  return anShell('an-cust-class', body);
}

/* ---------- Hiệu quả > Công nợ khách hàng ---------- */
function renderAnEffDebt() {
  const all = INVOICES.filter(iv => iv.status !== 'cancel');
  const debts = all.map(iv => ({ iv, debt: iv.total - iv.paid })).filter(x => x.debt > 0);
  const byCust = groupAgg(debts, x => x.iv.custCode + '|' + x.iv.customer, x => ({ debt: x.debt, bills: 1 }));
  const custRows = [...byCust].map(([k, v]) => {
    const [code, name] = k.split('|');
    return { code, name, ...v };
  }).sort((a, b) => b.debt - a.debt);
  const totalDebt = debts.reduce((s, x) => s + x.debt, 0);
  const yearNet = aggregate(periodRange('all')).netAfterReturn;

  const hist = debtHistory();
  const series = [
    { name: 'Nợ cuối tháng', color: '#DC2626', data: hist.map(h => h.debt) },
    { name: 'Doanh thu thuần', color: '#16A34A', data: hist.map(h => h.net) },
  ];
  const avgDebt = Math.round(hist.reduce((s, h) => s + h.debt, 0) / hist.length);
  const avgRatio = hist.reduce((s, h) => s + (h.net ? h.debt / h.net * 100 : 0), 0) / hist.length;

  /* Phân bổ khách theo số ngày nợ */
  const buckets = [['0-30', 0, 30], ['31-60', 31, 60], ['61-90', 61, 90], ['91-120', 91, 120], ['>120', 121, 1e9]];
  const ageOf = iv => Math.round((TODAY - toDate(iv.time)) / DAY_MS);
  const bucketData = buckets.map(([lbl, lo, hi]) => ({
    lbl, v: new Set(debts.filter(x => { const a = ageOf(x.iv); return a >= lo && a <= hi; }).map(x => x.iv.custCode)).size,
  }));

  const body = `
  ${anHead('Công nợ khách hàng', { noDate: true })}
  <div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">
    ${slimKpi('Số lượng khách đang nợ', fmt(custRows.length))}
    ${slimKpi('Giá trị nợ hiện tại', fmtTr(totalDebt))}
    ${slimKpi('Giá trị nợ/Doanh thu thuần', (yearNet ? totalDebt / yearNet * 100 : 0).toFixed(2) + '%')}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Biến động công nợ phải thu trong 12 tháng qua</div></div>
    <div class="card-body">
      <div style="display:flex; gap:44px; margin-bottom:12px">
        <div><div class="td-muted" style="font-size:12px">Nợ phải thu TB/tháng</div><div style="font-size:19px;font-weight:700">${fmtTr(avgDebt)}</div></div>
        <div><div class="td-muted" style="font-size:12px">Giá trị nợ/Doanh thu thuần TB mỗi tháng</div><div style="font-size:19px;font-weight:700">${avgRatio.toFixed(2)}%</div></div>
      </div>
      ${lineChartSVG(hist.map(h => h.label), series)}
    </div>
    <div class="chart-legend">${series.map(s => `<span><i class="lg-dot" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Lượng khách theo số ngày nợ</div></div>
    <div class="card-body">${barSimpleSVG(bucketData.map(b => b.lbl), bucketData.map(b => b.v), v => fmt(Math.round(v)))}</div>
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Chi tiết công nợ theo khách hàng</div></div>
    ${simpleTable([
      { t: 'Mã KH', k: 'code', f: v => `<span class="td-code">${v}</span>` }, { t: 'Khách hàng', k: 'name' },
      { t: 'Số hóa đơn còn nợ', k: 'bills', a: 'r' },
      { t: 'Giá trị nợ', k: 'debt', a: 'r', f: v => `<b style="color:var(--red-600)">${fmt(v)}</b>` },
    ], custRows, { bills: debts.length, debt: totalDebt })}
  </div>`;
  return anShell('an-eff-debt', body);
}

/* ---------- (cũ) Phân tích: Kinh doanh ---------- */
function renderAnBusinessOld() {
  const r = periodRange(AN.period), rp = prevRange(AN.period);
  const cur = aggregate(r), prv = aggregate(rp);
  const days = daysOf(r);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));

  const byDay = f => days.map(d => {
    const key = dmy(d);
    return invs.filter(iv => iv.time.startsWith(key)).reduce((s, iv) => s + f(invStats(iv)), 0);
  });
  const series = [
    { name: 'Doanh thu', color: '#16A34A', data: byDay(m => m.revenue) },
    { name: 'Giá vốn', color: '#D97706', data: byDay(m => m.cost) },
    { name: 'Lợi nhuận gộp', color: '#2563EB', data: byDay(m => m.profit) },
    { name: 'Trả hàng', color: '#DC2626', data: days.map(d => RETURNS.filter(x => x.time.startsWith(dmy(d))).reduce((s, x) => s + x.value, 0)) },
  ];

  // Bảng theo chi nhánh — trừ cả trả hàng của chính chi nhánh đó để khớp KPI
  const gBranch = groupAgg(invs, iv => iv.branch, invStats);
  const branchRows = [...gBranch].map(([k, v]) => {
    const rs = RETURNS.filter(x => x.branch === k && inRange(x.time, r));
    const ret = rs.reduce((s, x) => s + x.value, 0);
    const retCost = rs.reduce((s, x) => s + x.items.reduce((a, it) => a + it.cost * it.qty, 0), 0);
    return {
      name: k, ...v, returnValue: ret,
      netAfterReturn: v.net - ret,
      costAfterReturn: v.cost - retCost,
      profitAfterReturn: (v.net - ret) - (v.cost - retCost),
    };
  });

  // Top nhóm hàng theo chỉ tiêu đang chọn
  const lines = invs.flatMap(iv => iv.items.map(it => ({ ...it, iv })));
  const gGroup = groupAgg(lines, it => (PRODUCTS.find(p => p.code === it.code) || {}).group || '—', it => {
    const p = PRODUCTS.find(x => x.code === it.code) || { cost: 0 };
    const rev = (it.price - it.disc) * it.qty;
    return { revenue: rev, cost: p.cost * it.qty, profit: rev - p.cost * it.qty, qty: it.qty, bills: 1 };
  });
  const metric = { revenue: 'Doanh thu', profit: 'Lợi nhuận gộp', cost: 'Giá vốn', qty: 'Số lượng bán' }[AN.tab];
  const topGroups = [...gGroup].map(([k, v]) => ({ name: k, ...v, avg: Math.round(v.revenue / v.bills) }))
    .sort((a, b) => b[AN.tab] - a[AN.tab]).slice(0, 10);

  return `
  <div class="breadcrumb">Trang chủ / Phân tích / <b>Kinh doanh</b></div>
  ${anBar('Tổng quan kinh doanh')}

  <div class="an-kpis">
    ${kpiCard('Số hóa đơn', fmt(cur.bills), { label: 'Trung bình/ngày', value: (cur.bills / cur.days).toFixed(1) }, cur.bills, prv.bills)}
    ${kpiCard('Doanh thu', fmt(cur.revenue), { label: 'Trung bình/ngày', value: fmt(Math.round(cur.revenue / cur.days)) }, cur.revenue, prv.revenue)}
    ${kpiCard('Giá trị trả hàng', fmt(cur.returnValue), { label: 'Số phiếu trả', value: cur.returnCount }, cur.returnValue, prv.returnValue)}
    ${kpiCard('Doanh thu thuần', fmt(cur.netAfterReturn), { label: 'Trung bình/ngày', value: fmt(Math.round(cur.netAfterReturn / cur.days)) }, cur.netAfterReturn, prv.netAfterReturn)}
    ${kpiCard('Tổng giá vốn', fmt(cur.costAfterReturn), { label: 'Trung bình/ngày', value: fmt(Math.round(cur.costAfterReturn / cur.days)) }, cur.costAfterReturn, prv.costAfterReturn)}
    ${kpiCard('Lợi nhuận gộp', fmt(cur.profitAfterReturn), { label: 'Biên lợi nhuận', value: (cur.netAfterReturn ? cur.profitAfterReturn / cur.netAfterReturn * 100 : 0).toFixed(1) + '%' }, cur.profitAfterReturn, prv.profitAfterReturn)}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Chỉ số kinh doanh theo ngày</div></div>
    <div class="card-body">${lineChartSVG(days.map(dm), series)}</div>
    <div class="chart-legend">${series.map(s => `<span><i class="lg-dot" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Theo chi nhánh</div></div>
    ${simpleTable([
      { t: 'Chi nhánh', k: 'name' }, { t: 'Số hóa đơn', k: 'bills', a: 'r' },
      { t: 'Doanh thu', k: 'revenue', a: 'r' }, { t: 'Giảm giá', k: 'discount', a: 'r' },
      { t: 'Trả hàng', k: 'returnValue', a: 'r' }, { t: 'Doanh thu thuần', k: 'netAfterReturn', a: 'r' },
      { t: 'Tổng giá vốn', k: 'costAfterReturn', a: 'r' }, { t: 'Lợi nhuận gộp', k: 'profitAfterReturn', a: 'r' },
    ], branchRows, cur)}
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Top 10 nhóm hàng</div></div>
    <div class="an-tabs">
      ${[['revenue', 'Doanh thu'], ['cost', 'Giá vốn'], ['profit', 'Lợi nhuận gộp'], ['qty', 'Số lượng bán']].map(([t, l]) =>
        `<button class="${AN.tab === t ? 'active' : ''}" onclick="anTab('${t}')">${l}</button>`).join('')}
    </div>
    ${simpleTable([
      { t: 'Nhóm hàng', k: 'name' }, { t: 'Số lượng bán', k: 'qty', a: 'r' },
      { t: metric, k: AN.tab, a: 'r' }, { t: 'Doanh thu TB/đơn', k: 'avg', a: 'r' },
      { t: 'Tỷ trọng', k: AN.tab, a: 'r', f: v => {
        const tot = topGroups.reduce((s, g) => s + g[AN.tab], 0);
        return (tot ? v / tot * 100 : 0).toFixed(1) + '%';
      } },
    ], topGroups)}
  </div>`;
}

/* ---------- Phân tích: Hàng hóa ---------- */
function renderAnProduct() {
  const r = periodRange(AN.period), rp = prevRange(AN.period);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const invsP = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, rp));
  const lineStat = it => {
    const p = PRODUCTS.find(x => x.code === it.code) || { cost: 0 };
    const rev = (it.price - it.disc) * it.qty;
    return { qty: it.qty, revenue: rev, cost: p.cost * it.qty, profit: rev - p.cost * it.qty };
  };
  const lines = invs.flatMap(iv => iv.items);
  const linesP = invsP.flatMap(iv => iv.items);
  const sum = (rows, f) => rows.reduce((s, it) => s + lineStat(it)[f], 0);

  const gProd = groupAgg(lines, it => it.code, lineStat);
  const prodRows = [...gProd].map(([code, v]) => {
    const p = PRODUCTS.find(x => x.code === code);
    return { code, name: p.name, group: p.group, ...v, margin: v.revenue ? v.profit / v.revenue * 100 : 0 };
  });
  const top = [...prodRows].sort((a, b) => b.revenue - a.revenue).slice(0, 10);
  const slow = PRODUCTS.filter(p => p.type !== 'Dịch vụ' && !gProd.has(p.code))
    .map(p => ({ code: p.code, name: p.name, group: p.group, stock: p.stock, value: p.stock * p.cost }));
  const stockValue = PRODUCTS.reduce((s, p) => s + p.stock * p.cost, 0);
  const lowStock = PRODUCTS.filter(p => stockState(p)[0] === 'low' || stockState(p)[0] === 'out').length;

  return `
  <div class="breadcrumb">Trang chủ / Phân tích / <b>Hàng hóa</b></div>
  ${anBar('Tổng quan hàng hóa')}

  <div class="an-kpis">
    ${kpiCard('Số lượng bán ra', fmt(sum(lines, 'qty')), { label: 'Số mặt hàng bán', value: gProd.size }, sum(lines, 'qty'), sum(linesP, 'qty'))}
    ${kpiCard('Doanh thu hàng bán', fmt(sum(lines, 'revenue')), { label: 'Số mặt hàng', value: PRODUCTS.length }, sum(lines, 'revenue'), sum(linesP, 'revenue'))}
    ${kpiCard('Lợi nhuận gộp', fmt(sum(lines, 'profit')), { label: 'Biên lợi nhuận', value: (sum(lines, 'revenue') ? sum(lines, 'profit') / sum(lines, 'revenue') * 100 : 0).toFixed(1) + '%' }, sum(lines, 'profit'), sum(linesP, 'profit'))}
    ${kpiCard('Giá trị tồn kho', fmt(stockValue), { label: 'Theo giá bán', value: fmt(PRODUCTS.reduce((s, p) => s + p.stock * p.price, 0)) }, stockValue, stockValue)}
    ${kpiCard('Hàng cần nhập', String(lowStock), { label: 'Hết hàng', value: PRODUCTS.filter(p => p.stock <= 0 && p.type !== 'Dịch vụ').length }, lowStock, lowStock)}
    ${kpiCard('Hàng không phát sinh', String(slow.length), { label: 'Giá trị tồn đọng', value: fmt(slow.reduce((s, p) => s + p.value, 0)) }, slow.length, slow.length)}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Top 10 hàng hóa theo doanh thu</div></div>
    <div class="card-body">${barSimpleSVG(top.map(p => p.name), top.map(p => p.revenue))}</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="card-title">Chi tiết hàng bán trong kỳ</div></div>
    ${simpleTable([
      { t: 'Mã hàng', k: 'code', f: v => `<span class="td-code">${v}</span>` }, { t: 'Tên hàng', k: 'name' },
      { t: 'Nhóm hàng', k: 'group' }, { t: 'SL bán', k: 'qty', a: 'r' },
      { t: 'Doanh thu', k: 'revenue', a: 'r' }, { t: 'Giá vốn', k: 'cost', a: 'r' },
      { t: 'Lợi nhuận', k: 'profit', a: 'r' }, { t: 'Biên LN', k: 'margin', a: 'r', f: v => v.toFixed(1) + '%' },
    ], prodRows.sort((a, b) => b.revenue - a.revenue), {
      qty: sum(lines, 'qty'), revenue: sum(lines, 'revenue'), cost: sum(lines, 'cost'), profit: sum(lines, 'profit'),
    })}
  </div>

  <div class="card">
    <div class="card-head"><div class="card-title">Hàng không phát sinh bán trong kỳ</div></div>
    ${simpleTable([
      { t: 'Mã hàng', k: 'code', f: v => `<span class="td-code">${v}</span>` }, { t: 'Tên hàng', k: 'name' },
      { t: 'Nhóm hàng', k: 'group' }, { t: 'Tồn kho', k: 'stock', a: 'r' },
      { t: 'Giá trị tồn', k: 'value', a: 'r' },
    ], slow)}
  </div>`;
}

/* ---------- Phân tích: Khách hàng ---------- */
function renderAnCustomer() {
  const r = periodRange(AN.period), rp = prevRange(AN.period);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const cur = aggregate(r), prv = aggregate(rp);
  const g = groupAgg(invs, iv => iv.custCode + '|' + iv.customer, invStats);
  const rows = [...g].map(([k, v]) => {
    const [code, name] = k.split('|');
    return { code, name, ...v, avg: Math.round(v.revenue / v.bills), debt: v.total - v.paid, margin: v.net ? v.profit / v.net * 100 : 0 };
  }).sort((a, b) => b.revenue - a.revenue);
  const days = daysOf(r);
  const series = [{ name: 'Số hóa đơn', color: '#16A34A', data: days.map(d => invs.filter(iv => iv.time.startsWith(dmy(d))).length) }];
  const debtTotal = rows.reduce((s, x) => s + x.debt, 0);

  return `
  <div class="breadcrumb">Trang chủ / Phân tích / <b>Khách hàng</b></div>
  ${anBar('Tổng quan khách hàng')}

/* ---------- Phân tích: Hiệu quả ---------- */
function renderAnEfficiency() {
  const r = periodRange(AN.period), rp = prevRange(AN.period);
  const cur = aggregate(r), prv = aggregate(rp);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const gStaff = groupAgg(invs, iv => iv.seller, invStats);
  const staffRows = [...gStaff].map(([k, v]) => ({
    name: k, ...v, avg: Math.round(v.revenue / v.bills), margin: v.net ? v.profit / v.net * 100 : 0,
  })).sort((a, b) => b.net - a.net);

  const stockValue = PRODUCTS.reduce((s, p) => s + p.stock * p.cost, 0);
  const turnover = stockValue ? cur.costAfterReturn / stockValue : 0;
  const exp = expensesFor(r);
  const expense = exp.total;
  const netProfit = cur.profitAfterReturn - expense;

  const days = daysOf(r);
  const series = [
    { name: 'Doanh thu thuần', color: '#16A34A', data: days.map(d => invs.filter(iv => iv.time.startsWith(dmy(d))).reduce((s, iv) => s + invStats(iv).net, 0)) },
    { name: 'Lợi nhuận gộp', color: '#2563EB', data: days.map(d => invs.filter(iv => iv.time.startsWith(dmy(d))).reduce((s, iv) => s + invStats(iv).profit, 0)) },

    ${kpiCard('Vòng quay tồn kho', turnover.toFixed(2), { label: 'Giá trị tồn', value: fmt(stockValue) }, turnover, turnover)}
    ${kpiCard('Tỷ lệ trả hàng', (cur.revenue ? cur.returnValue / cur.revenue * 100 : 0).toFixed(2) + '%', { label: 'Giá trị trả', value: fmt(cur.returnValue) }, cur.returnValue, prv.returnValue)}
    ${kpiCard('Chi phí trong kỳ', fmt(expense), { label: 'Số khoản mục', value: exp.rows.length }, expense, expense)}
    ${kpiCard('Lợi nhuận thuần', fmt(netProfit), { label: 'Trên doanh thu thuần', value: (cur.net ? netProfit / cur.net * 100 : 0).toFixed(1) + '%' }, netProfit, netProfit)}

/* Bảng báo cáo: dòng tổng nền kem + dòng bung chi tiết */
function rpTable(cols, rows, totals, drillFn) {
  const cell = (c, r) => c.f ? c.f(r[c.k], r) : (typeof r[c.k] === 'number' ? fmt(r[c.k]) : (r[c.k] ?? ''));
  return `<table class="rp-tbl">

    <tbody>
      ${totals ? `<tr class="rv-total">${cols.map((c, i) => `<td class="${c.a === 'r' ? 'num-r' : ''}">${i === 0 ? '' : (totals[c.k] !== undefined ? (c.f ? c.f(totals[c.k], totals) : fmt(totals[c.k])) : '')}</td>`).join('')}</tr>` : ''}
      ${rows.length ? rows.map(r => {
        const label = String(r[cols[0].k]);
        const open = RP.open === label;
        const drill = drillFn ? drillFn(r) : null;
        return `<tr class="rv-row">${cols.map((c, i) => {

            return `<td>${drill ? `<span class="rv-exp" onclick="rpToggle('${label.replace(/'/g, "\\'")}')">${open ? '−' : '+'}</span>` : ''}<span class="rp-link" ${drill ? `onclick="rpToggle('${label.replace(/'/g, "\\'")}')"` : ''}>${cell(c, r)}</span></td>`;
          }

        }).join('')}</tr>

/* Dữ liệu bung chi tiết của một dòng báo cáo */
function reportDrill(page, concern, label) {
  const r = periodRange(RP.period);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const invCols = [{ t: 'Mã hóa đơn', k: 'code', a: 'l' }, { t: 'Thời gian', k: 'time', a: 'l' }, { t: 'Khách hàng', k: 'customer', a: 'l' }, { t: 'Doanh thu', k: 'revenue', a: 'r' }];
  const mapInv = list => list.map(iv => ({ code: iv.code, time: iv.time, customer: iv.customer, revenue: iv.sub }));
  const wrap = rows => rows.length ? { cols: invCols, rows } : null;

  if (page === 'rp-sales') {
    if (concern === 'time' || concern === 'profit') return wrap(mapInv(invs.filter(iv => iv.time.startsWith(label))));
    if (concern === 'staff')  return wrap(mapInv(invs.filter(iv => iv.seller === label)));
    if (concern === 'branch') return wrap(mapInv(invs.filter(iv => iv.branch === label)));
    if (concern === 'vat')    return wrap(mapInv(invs.filter(iv => iv.vatPct + '%' === label)));
    return null;
  }
  if (page === 'rp-orders') {
    const ords = ORDERS.filter(o => inRange(o.time, r));
    const stLbl = { processing: 'Đang xử lý', done: 'Đã xuất hóa đơn', cancel: 'Đã hủy' };
    const pick = concern === 'time' ? ords.filter(o => o.time.startsWith(label))
      : concern === 'staff' ? ords.filter(o => o.seller === label)
      : concern === 'status' ? ords.filter(o => stLbl[o.status] === label)
      : ords.filter(o => o.customer === label);
    return pick.length ? {
      cols: [{ t: 'Mã đặt hàng', k: 'code', a: 'l' }, { t: 'Thời gian', k: 'time', a: 'l' }, { t: 'Khách hàng', k: 'customer', a: 'l' }, { t: 'Giá trị đơn', k: 'total', a: 'r' }],
      rows: pick.map(o => ({ code: o.code, time: o.time, customer: o.customer, total: o.total })),
    } : null;
  }
  if (page === 'rp-products' && ['sales', 'profit'].includes(concern)) {
    const rows = invs.filter(iv => iv.items.some(it => it.code === label)).map(iv => {
      const it = iv.items.find(x => x.code === label);
      return { code: iv.code, time: iv.time, customer: iv.customer, qty: it.qty, revenue: (it.price - it.disc) * it.qty };
    });
    return rows.length ? { cols: [{ t: 'Mã hóa đơn', k: 'code', a: 'l' }, { t: 'Thời gian', k: 'time', a: 'l' }, { t: 'Khách hàng', k: 'customer', a: 'l' }, { t: 'SL', k: 'qty', a: 'r' }, { t: 'Doanh thu', k: 'revenue', a: 'r' }], rows } : null;
  }
  if (page === 'rp-customers' && ['sales', 'profit', 'debt'].includes(concern)) {
    return wrap(mapInv(invs.filter(iv => iv.custCode === label)));
  }
  if (page === 'rp-staff' && ['sales', 'profit'].includes(concern)) {
    return wrap(mapInv(invs.filter(iv => iv.seller === label)));
  }
  if (page === 'rp-suppliers' && ['purchase', 'debt'].includes(concern)) {
    const purs = PURCHASES.filter(p => inRange(p.time, r) && p.supplier === label);
    return purs.length ? {
      cols: [{ t: 'Mã phiếu nhập', k: 'code', a: 'l' }, { t: 'Thời gian', k: 'time', a: 'l' }, { t: 'Giá trị nhập', k: 'total', a: 'r' }, { t: 'Đã trả', k: 'paidAmt', a: 'r' }],
      rows: purs.map(p => ({ code: p.code, time: p.time, total: p.total, paidAmt: p.paidAmt })),
    } : null;
  }
  return null;
}

};

/* Sinh dữ liệu bảng theo báo cáo + mối quan tâm */
function reportTable(page, concern) {
  const r = periodRange(RP.period);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, r));
  const lineStat = it => {
    const p = PRODUCTS.find(x => x.code === it.code) || { cost: 0 };
    const rev = (it.price - (it.disc || 0)) * it.qty;
    return { qty: it.qty, revenue: rev, cost: p.cost * it.qty, profit: rev - p.cost * it.qty };
  };
  const M = (k, t, a = 'r') => ({ t, k, a });
  const totalOf = (rows, keys) => keys.reduce((o, k) => (o[k] = rows.reduce((s, x) => s + (x[k] || 0), 0), o), {});

  /* ----- Bán hàng ----- */
  if (page === 'rp-sales') {
    if (concern === 'time' || concern === 'profit') {
      const rows = daysOf(r).map(d => {
        const key = dmy(d);
        const list = invs.filter(iv => iv.time.startsWith(key));
        const s = list.reduce((a, iv) => { const m = invStats(iv); Object.keys(m).forEach(k => a[k] = (a[k] || 0) + m[k]); return a; },
          { bills: 0, revenue: 0, discount: 0, vat: 0, net: 0, cost: 0, profit: 0 });
        return { label: key, ...s, margin: s.net ? s.profit / s.net * 100 : 0 };
      });
      const keys = ['bills', 'revenue', 'discount', 'net', 'cost', 'profit'];
      const cols = concern === 'time'
        ? [M('label', 'Thời gian', 'l'), M('bills', 'Số hóa đơn'), M('revenue', 'Tổng tiền hàng'), M('discount', 'Giảm giá'), M('vat', 'Thuế VAT'), M('net', 'Doanh thu thuần')]
        : [M('label', 'Thời gian', 'l'), M('net', 'Doanh thu thuần'), M('cost', 'Tổng giá vốn'), M('profit', 'Lợi nhuận gộp'), { t: 'Biên LN', k: 'margin', a: 'r', f: v => v.toFixed(1) + '%' }];
      return { cols, rows, totals: totalOf(rows, [...keys, 'vat']), chartK: concern === 'time' ? 'net' : 'profit', keepOrder: true };
    }
    if (concern === 'discount') {
      const rows = invs.map(iv => ({ label: iv.code, time: iv.time, customer: iv.customer, revenue: iv.sub, discount: iv.discount, rate: iv.sub ? iv.discount / iv.sub * 100 : 0 }));
      return { cols: [M('label', 'Mã hóa đơn', 'l'), M('time', 'Thời gian', 'l'), M('customer', 'Khách hàng', 'l'), M('revenue', 'Tổng tiền hàng'), M('discount', 'Giảm giá HĐ'), { t: 'Tỷ lệ giảm', k: 'rate', a: 'r', f: v => v.toFixed(2) + '%' }],
        rows, totals: totalOf(rows, ['revenue', 'discount']), chartK: 'discount' };
    }
    if (concern === 'vat') {
      const g = groupAgg(invs, iv => iv.vatPct, iv => ({ bills: 1, net: iv.sub - iv.discount, vat: iv.vatAmt, total: iv.total }));
      const rows = [...g].map(([k, v]) => ({ label: k + '%', ...v })).sort((a, b) => parseFloat(a.label) - parseFloat(b.label));
      return { cols: [M('label', 'Thuế suất', 'l'), M('bills', 'Số hóa đơn'), M('net', 'Doanh thu chưa thuế'), M('vat', 'Tiền thuế'), M('total', 'Tổng cộng')],
        rows, totals: totalOf(rows, ['bills', 'net', 'vat', 'total']), chartK: 'vat' };
    }
    if (concern === 'return') {
      const rows = RETURNS.filter(x => inRange(x.time, r)).map(x => ({
        label: x.code, time: x.time, invoice: x.invoice, customer: x.customer,
        qty: x.items.reduce((s, i) => s + i.qty, 0), value: x.value, fee: x.fee, refund: x.refund,
      }));
      return { cols: [M('label', 'Mã trả hàng', 'l'), M('time', 'Thời gian', 'l'), M('invoice', 'Hóa đơn gốc', 'l'), M('customer', 'Khách hàng', 'l'), M('qty', 'SL trả'), M('value', 'Giá trị trả'), M('fee', 'Phí trả hàng'), M('refund', 'Cần trả khách')],
        rows, totals: totalOf(rows, ['qty', 'value', 'fee', 'refund']), chartK: 'value' };
    }
    if (concern === 'staff' || concern === 'branch') {
      const g = groupAgg(invs, iv => concern === 'staff' ? iv.seller : iv.branch, invStats);
      const rows = [...g].map(([k, v]) => ({ label: k, ...v, margin: v.net ? v.profit / v.net * 100 : 0 })).sort((a, b) => b.net - a.net);
      return { cols: [M('label', concern === 'staff' ? 'Nhân viên' : 'Chi nhánh', 'l'), M('bills', 'Số hóa đơn'), M('revenue', 'Tổng tiền hàng'), M('discount', 'Giảm giá'), M('net', 'Doanh thu thuần'), M('cost', 'Giá vốn'), M('profit', 'Lợi nhuận gộp'), { t: 'Biên LN', k: 'margin', a: 'r', f: v => v.toFixed(1) + '%' }],
        rows, totals: totalOf(rows, ['bills', 'revenue', 'discount', 'net', 'cost', 'profit']), chartK: 'net' };
    }
  }

  /* ----- Đặt hàng ----- */
  if (page === 'rp-orders') {
    const ords = ORDERS.filter(o => inRange(o.time, r));
    const oStat = o => ({ orders: 1, qty: o.items.reduce((s, i) => s + i.qty, 0), total: o.total });
    if (concern === 'time') {
      const rows = daysOf(r).map(d => {
        const key = dmy(d);
        const list = ords.filter(o => o.time.startsWith(key));
        return { label: key, orders: list.length, qty: list.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0), total: list.reduce((s, o) => s + o.total, 0) };
      });
      return { cols: [M('label', 'Thời gian', 'l'), M('orders', 'Số đơn đặt'), M('qty', 'Số lượng'), M('total', 'Giá trị đơn')], rows, totals: totalOf(rows, ['orders', 'qty', 'total']), chartK: 'total', keepOrder: true };
    }
    if (concern === 'status') {
      const lbl = { processing: 'Đang xử lý', done: 'Đã xuất hóa đơn', cancel: 'Đã hủy' };
      const g = groupAgg(ords, o => lbl[o.status], oStat);
      const rows = [...g].map(([k, v]) => ({ label: k, ...v }));
      return { cols: [M('label', 'Trạng thái', 'l'), M('orders', 'Số đơn đặt'), M('qty', 'Số lượng'), M('total', 'Giá trị đơn')], rows, totals: totalOf(rows, ['orders', 'qty', 'total']), chartK: 'total' };
    }
    const g = groupAgg(ords, o => concern === 'staff' ? o.seller : o.customer, oStat);
    const rows = [...g].map(([k, v]) => ({ label: k, ...v })).sort((a, b) => b.total - a.total);
    return { cols: [M('label', concern === 'staff' ? 'Nhân viên' : 'Khách hàng', 'l'), M('orders', 'Số đơn đặt'), M('qty', 'Số lượng'), M('total', 'Giá trị đơn')], rows, totals: totalOf(rows, ['orders', 'qty', 'total']), chartK: 'total' };
  }

  /* ----- Hàng hóa ----- */
  if (page === 'rp-products') {
    const lines = invs.flatMap(iv => iv.items.map(it => ({ ...it, iv })));
    if (concern === 'sales' || concern === 'profit') {
      const g = groupAgg(lines, it => it.code, lineStat);
      const rows = [...g].map(([code, v]) => {
        const p = PRODUCTS.find(x => x.code === code);
        return { label: code, name: p.name, group: p.group, ...v, margin: v.revenue ? v.profit / v.revenue * 100 : 0 };
      }).sort((a, b) => b.revenue - a.revenue);
      const cols = concern === 'sales'
        ? [M('label', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('group', 'Nhóm hàng', 'l'), M('qty', 'SL bán'), M('revenue', 'Doanh thu')]
        : [M('label', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('qty', 'SL bán'), M('revenue', 'Doanh thu'), M('cost', 'Giá vốn'), M('profit', 'Lợi nhuận'), { t: 'Biên LN', k: 'margin', a: 'r', f: v => v.toFixed(1) + '%' }];
      return { cols, rows, totals: totalOf(rows, ['qty', 'revenue', 'cost', 'profit']), chartK: concern === 'sales' ? 'revenue' : 'profit', chartL: 'name' };
    }
    if (concern === 'stock') {
      const rows = PRODUCTS.filter(p => p.type !== 'Dịch vụ').map(p => ({
        label: p.code, name: p.name, group: p.group, stock: p.stock, cost: p.cost,
        stockValue: p.stock * p.cost, price: p.price, sellValue: p.stock * p.price,
      }));
      return { cols: [M('label', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('group', 'Nhóm hàng', 'l'), M('stock', 'Tồn kho'), M('cost', 'Giá vốn'), M('stockValue', 'Giá trị tồn'), M('price', 'Giá bán'), M('sellValue', 'Giá trị theo giá bán')],
        rows, totals: totalOf(rows, ['stock', 'stockValue', 'sellValue']), chartK: 'stockValue', chartL: 'name' };
    }
    if (concern === 'inout') {
      const g = groupAgg(lines, it => it.code, it => ({ out: it.qty }));
      const gIn = groupAgg(PURCHASES.filter(p => inRange(p.time, r)).flatMap(p => p.items), it => it.code, it => ({ in: it.qty }));
      const rows = PRODUCTS.filter(p => p.type !== 'Dịch vụ').map(p => {
        const out = (g.get(p.code) || {}).out || 0;
        const inQ = (gIn.get(p.code) || {}).in || 0;
        return { label: p.code, name: p.name, begin: p.stock + out - inQ, in: inQ, out, end: p.stock };
      });
      return { cols: [M('label', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('begin', 'Tồn đầu kỳ'), M('in', 'Nhập trong kỳ'), M('out', 'Xuất trong kỳ'), M('end', 'Tồn cuối kỳ')],
        rows, totals: totalOf(rows, ['begin', 'in', 'out', 'end']), chartK: 'out', chartL: 'name' };
    }
    // Nhân viên / Khách theo hàng bán
    const keyFn = concern === 'staffprod' ? (it => it.iv.seller + '|' + it.code) : (it => it.iv.customer + '|' + it.code);
    const g = groupAgg(lines, keyFn, lineStat);
    const rows = [...g].map(([k, v]) => {
      const [who, code] = k.split('|');
      return { label: who, code, name: (PRODUCTS.find(p => p.code === code) || {}).name, ...v };
    }).sort((a, b) => b.revenue - a.revenue);
    return { cols: [M('label', concern === 'staffprod' ? 'Nhân viên' : 'Khách hàng', 'l'), M('code', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('qty', 'SL bán'), M('revenue', 'Doanh thu'), M('profit', 'Lợi nhuận')],
      rows, totals: totalOf(rows, ['qty', 'revenue', 'profit']), chartK: 'revenue' };
  }

  /* ----- Khách hàng ----- */
  if (page === 'rp-customers') {
    if (concern === 'prod') {
      const lines = invs.flatMap(iv => iv.items.map(it => ({ ...it, iv })));
      const g = groupAgg(lines, it => it.iv.customer + '|' + it.code, lineStat);
      const rows = [...g].map(([k, v]) => {
        const [who, code] = k.split('|');
        return { label: who, code, name: (PRODUCTS.find(p => p.code === code) || {}).name, ...v };
      }).sort((a, b) => b.revenue - a.revenue);
      return { cols: [M('label', 'Khách hàng', 'l'), M('code', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('qty', 'SL'), M('revenue', 'Doanh thu')], rows, totals: totalOf(rows, ['qty', 'revenue']), chartK: 'revenue' };
    }
    const g = groupAgg(invs, iv => iv.custCode + '|' + iv.customer, invStats);
    const rows = [...g].map(([k, v]) => {
      const [code, name] = k.split('|');
      return { label: code, name, ...v, debt: v.total - v.paid, margin: v.net ? v.profit / v.net * 100 : 0 };
    }).sort((a, b) => b.revenue - a.revenue);
    const cols = concern === 'sales'
      ? [M('label', 'Mã KH', 'l'), M('name', 'Khách hàng', 'l'), M('bills', 'Số hóa đơn'), M('revenue', 'Tổng tiền hàng'), M('discount', 'Giảm giá'), M('net', 'Doanh thu thuần')]
      : concern === 'profit'
      ? [M('label', 'Mã KH', 'l'), M('name', 'Khách hàng', 'l'), M('net', 'Doanh thu thuần'), M('cost', 'Giá vốn'), M('profit', 'Lợi nhuận gộp'), { t: 'Biên LN', k: 'margin', a: 'r', f: v => v.toFixed(1) + '%' }]
      : [M('label', 'Mã KH', 'l'), M('name', 'Khách hàng', 'l'), M('total', 'Tổng phải thu'), M('paid', 'Đã thu'), { t: 'Còn nợ', k: 'debt', a: 'r', f: v => v > 0 ? `<b style="color:var(--red-600)">${fmt(v)}</b>` : '—' }];
    return { cols, rows, totals: totalOf(rows, ['bills', 'revenue', 'discount', 'net', 'cost', 'profit', 'total', 'paid', 'debt']), chartK: concern === 'debt' ? 'debt' : 'net', chartL: 'name' };
  }

  /* ----- Nhà cung cấp ----- */
  if (page === 'rp-suppliers') {
    const purs = PURCHASES.filter(p => inRange(p.time, r));
    if (concern === 'prod') {
      const lines = purs.flatMap(p => p.items.map(it => ({ ...it, sup: p.supplier })));
      const g = groupAgg(lines, it => it.sup + '|' + it.code, it => ({ qty: it.qty, value: it.cost * it.qty }));
      const rows = [...g].map(([k, v]) => {
        const [sup, code] = k.split('|');
        return { label: (SUPPLIERS.find(s => s.code === sup) || {}).name, code, name: (PRODUCTS.find(p => p.code === code) || {}).name, ...v };
      }).sort((a, b) => b.value - a.value);
      return { cols: [M('label', 'Nhà cung cấp', 'l'), M('code', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('qty', 'SL nhập'), M('value', 'Giá trị nhập')], rows, totals: totalOf(rows, ['qty', 'value']), chartK: 'value' };
    }
    const g = groupAgg(purs, p => p.supplier, p => ({ docs: 1, qty: p.items.reduce((s, i) => s + i.qty, 0), total: p.total, paid: p.paidAmt }));
    const rows = [...g].map(([k, v]) => {
      const s = SUPPLIERS.find(x => x.code === k) || {};
      return { label: k, name: s.name, phone: s.phone, ...v, debt: v.total - v.paid };
    }).sort((a, b) => b.total - a.total);
    const cols = concern === 'purchase'
      ? [M('label', 'Mã NCC', 'l'), M('name', 'Nhà cung cấp', 'l'), M('docs', 'Số phiếu nhập'), M('qty', 'Số lượng'), M('total', 'Giá trị nhập')]
      : [M('label', 'Mã NCC', 'l'), M('name', 'Nhà cung cấp', 'l'), M('total', 'Tổng phải trả'), M('paid', 'Đã trả'), { t: 'Còn nợ', k: 'debt', a: 'r', f: v => v > 0 ? `<b style="color:var(--red-600)">${fmt(v)}</b>` : '—' }];
    return { cols, rows, totals: totalOf(rows, ['docs', 'qty', 'total', 'paid', 'debt']), chartK: concern === 'debt' ? 'debt' : 'total', chartL: 'name' };
  }

  /* ----- Nhân viên ----- */
  if (page === 'rp-staff') {
    if (concern === 'prod') {
      const lines = invs.flatMap(iv => iv.items.map(it => ({ ...it, iv })));
      const g = groupAgg(lines, it => it.iv.seller + '|' + it.code, lineStat);
      const rows = [...g].map(([k, v]) => {
        const [who, code] = k.split('|');
        return { label: who, code, name: (PRODUCTS.find(p => p.code === code) || {}).name, ...v };
      }).sort((a, b) => b.revenue - a.revenue);
      return { cols: [M('label', 'Nhân viên', 'l'), M('code', 'Mã hàng', 'l'), M('name', 'Tên hàng', 'l'), M('qty', 'SL bán'), M('revenue', 'Doanh thu')], rows, totals: totalOf(rows, ['qty', 'revenue']), chartK: 'revenue' };
    }
    const g = groupAgg(invs, iv => iv.seller, invStats);
    const rows = [...g].map(([k, v]) => ({ label: k, ...v, avg: Math.round(v.revenue / v.bills), margin: v.net ? v.profit / v.net * 100 : 0 })).sort((a, b) => b.net - a.net);
    const cols = concern === 'sales'
      ? [M('label', 'Nhân viên', 'l'), M('bills', 'Số hóa đơn'), M('revenue', 'Tổng tiền hàng'), M('discount', 'Giảm giá'), M('net', 'Doanh thu thuần'), M('avg', 'TB/hóa đơn')]
      : [M('label', 'Nhân viên', 'l'), M('net', 'Doanh thu thuần'), M('cost', 'Giá vốn'), M('profit', 'Lợi nhuận gộp'), { t: 'Biên LN', k: 'margin', a: 'r', f: v => v.toFixed(1) + '%' }];
    return { cols, rows, totals: totalOf(rows, ['bills', 'revenue', 'discount', 'net', 'cost', 'profit']), chartK: 'net' };
  }
  return { cols: [], rows: [], totals: null };
}

      Tùy chọn báo cáo
    </div>
    <div class="f-sec">
      <button class="btn" style="width:100%" onclick="alert('Demo: xuất toàn bộ báo cáo')">⭱ Xuất tất cả</button>
    </div>
    <div class="f-sec">
      <div class="f-title">Kiểu hiển thị</div>
      <div class="seg seg-full" style="margin-bottom:8px">
        <button class="${RP.view === 'chart' ? 'active' : ''}" onclick="rpView('chart')">Biểu đồ</button>
        <button class="${RP.view === 'table' ? 'active' : ''}" onclick="rpView('table')">Báo cáo</button>

        <option value="h" ${RP.layout === 'h' ? 'selected' : ''}>Hiển thị ngang</option>
      </select>` : ''}
    </div>
    ${def.concerns ? `<div class="f-sec">
      <div class="f-title">Mối quan tâm</div>
      <select class="f-input" onchange="rpConcern(this.value)">
        ${def.concerns.map(([k, l]) => `<option value="${k}" ${RP.concern === k ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="f-sec">
      <div class="f-title">Chi nhánh</div>
      <select class="f-input"><option>Tất cả chi nhánh</option><option>Chi nhánh trung tâm</option><option>Chi nhánh 2</option></select>
    </div>
    <div class="f-sec">
      <div class="f-title">Thời gian</div>
      ${Object.entries(PERIODS).map(([k, l]) =>
        `<label class="f-opt"><input type="radio" name="rpt" ${RP.period === k ? 'checked' : ''} onchange="rpPeriod('${k}')"> ${l}</label>`).join('')}
    </div>
    <div class="f-sec">
      <div class="f-title">Hiển thị số liệu</div>
      <label class="f-opt"><input type="radio" name="rptax" ${RP.tax === 'excl' ? 'checked' : ''} onchange="rpTax('excl')"> Chưa bao gồm thuế</label>
      <label class="f-opt"><input type="radio" name="rptax" ${RP.tax === 'incl' ? 'checked' : ''} onchange="rpTax('incl')"> Đã bao gồm thuế</label>
    </div>
    ${extra}
    <div class="f-sec">
      <button class="btn" style="width:100%" onclick="alert('Demo: xuất báo cáo ra Excel')">⭱ Xuất báo cáo</button>
    </div>
  </div>`;
}

/* Trang báo cáo dạng bảng/biểu đồ dùng chung */
function renderReport(page) {
  const def = REPORTS[page];
  const concerns = def.concerns.map(c => c[0]);
  if (!concerns.includes(RP.concern)) RP.concern = concerns[0];
  const data = reportTable(page, RP.concern);
  const r = periodRange(RP.period);
  const concernLabel = (def.concerns.find(c => c[0] === RP.concern) || [])[1];

  // Dữ liệu theo thời gian giữ nguyên thứ tự ngày; các chiều khác sắp xếp giảm dần
  const chartRows = (data.keepOrder ? [...data.rows] : [...data.rows].sort((a, b) => (b[data.chartK] || 0) - (a[data.chartK] || 0))).slice(0, 15);
  const chartLabels = chartRows.map(x => String(x[data.chartL || 'label'] ?? x.label));

  const paper = paperHead(
    `${def.title} theo ${concernLabel.toLowerCase()}`,
    [`Từ ngày ${dmy(r.from)} đến ngày ${dmy(r.to)}`, 'Chi nhánh: Tất cả chi nhánh',
     `Số liệu: ${RP.tax === 'excl' ? 'Chưa bao gồm thuế' : 'Đã bao gồm thuế'}`]
  ) + rpTable(data.cols, data.rows, data.totals, row => reportDrill(page, RP.concern, String(row[data.cols[0].k])));

  return `
  <div class="breadcrumb">Trang chủ / Báo cáo / <b>${def.crumb}</b></div>
  <div class="rp-page">
    ${rpFilters(def)}
    <div>
      <div class="toolbar">
        <div class="page-h1">${def.title}</div>
        <div class="spacer"></div>
        <span class="td-muted">${concernLabel} · ${dmy(r.from)} – ${dmy(r.to)}</span>
      </div>
      ${RP.view === 'chart'
        ? `<div class="card">
             <div class="card-head"><div class="card-title">${concernLabel} — top ${chartRows.length}</div></div>
             <div class="card-body">${chartRows.length ? barSimpleSVG(chartLabels, chartRows.map(x => x[data.chartK] || 0)) : '<div style="text-align:center;padding:40px;color:var(--muted)">Không có dữ liệu trong kỳ</div>'}</div>
           </div>`
        : reportViewer(paper)}
    </div>
  </div>`;
}

/* ---------- Báo cáo cuối ngày (dạng chứng từ in) ---------- */
function renderReportEod() {
  const day = dmy(TODAY);
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && iv.time.startsWith(day));
  const rets = RETURNS.filter(x => x.time.startsWith(day));
  const s = invs.reduce((a, iv) => {
    const m = invStats(iv);
    return { qty: a.qty + iv.items.reduce((x, i) => x + i.qty, 0), revenue: a.revenue + m.revenue, discount: a.discount + m.discount, vat: a.vat + m.vat, other: a.other + iv.other, total: a.total + m.total, cost: a.cost + m.cost, profit: a.profit + m.profit };
  }, { qty: 0, revenue: 0, discount: 0, vat: 0, other: 0, total: 0, cost: 0, profit: 0 });
  const retValue = rets.reduce((a, x) => a + x.value, 0);
  const byPay = groupAgg(invs, iv => iv.payMethod, iv => ({ bills: 1, amount: iv.paid }));

  const paper = paperHead('Báo cáo cuối ngày về bán hàng',
    [`Ngày bán: ${day}`, 'Chi nhánh: Chi nhánh trung tâm',
     `Số liệu: ${RP.tax === 'excl' ? 'Chưa bao gồm thuế' : 'Đã bao gồm thuế'}`]) + `
    <table class="rp-tbl">
      <thead><tr>
        <th>Nội dung</th><th class="num-r">Số lượng</th><th class="num-r">Tiền hàng</th>
        <th class="num-r">Giảm giá</th><th class="num-r">VAT</th><th class="num-r">Thu khác</th><th class="num-r">Thực thu</th>
      </tr></thead>
      <tbody>
        <tr class="grp"><td>Hóa đơn bán hàng: ${invs.length}</td><td class="num-r">${s.qty}</td><td class="num-r">${fmt(s.revenue)}</td><td class="num-r">${fmt(s.discount)}</td><td class="num-r">${fmt(s.vat)}</td><td class="num-r">${fmt(s.other)}</td><td class="num-r">${fmt(s.total)}</td></tr>
        ${invs.map(iv => `<tr><td style="padding-left:30px"><span class="rp-link">${iv.code}</span> · ${iv.time.split(' ')[1]} · ${iv.customer}</td><td class="num-r">${iv.items.reduce((a, i) => a + i.qty, 0)}</td><td class="num-r">${fmt(iv.sub)}</td><td class="num-r">${fmt(iv.discount)}</td><td class="num-r">${fmt(iv.vatAmt)}</td><td class="num-r">${fmt(iv.other)}</td><td class="num-r">${fmt(iv.total)}</td></tr>`).join('')}
        <tr class="grp"><td>Trả hàng: ${rets.length}</td><td class="num-r">${rets.reduce((a, x) => a + x.items.reduce((b, i) => b + i.qty, 0), 0)}</td><td class="num-r">-${fmt(retValue)}</td><td class="num-r">0</td><td class="num-r">0</td><td class="num-r">0</td><td class="num-r">-${fmt(rets.reduce((a, x) => a + x.refund, 0))}</td></tr>
        <tr class="tot"><td>THỰC THU TRONG NGÀY</td><td class="num-r"></td><td class="num-r">${fmt(s.revenue - retValue)}</td><td class="num-r">${fmt(s.discount)}</td><td class="num-r">${fmt(s.vat)}</td><td class="num-r">${fmt(s.other)}</td><td class="num-r">${fmt(s.total - rets.reduce((a, x) => a + x.refund, 0))}</td></tr>
      </tbody>
    </table>

    <table class="rp-tbl">
      <thead><tr><th>Phương thức thanh toán</th><th class="num-r">Số hóa đơn</th><th class="num-r">Số tiền đã thu</th></tr></thead>
      <tbody>
        ${[...byPay].map(([k, v]) => `<tr><td>${k}</td><td class="num-r">${v.bills}</td><td class="num-r">${fmt(v.amount)}</td></tr>`).join('')}
        <tr class="tot"><td>Tổng cộng</td><td class="num-r">${invs.length}</td><td class="num-r">${fmt(invs.reduce((a, iv) => a + iv.paid, 0))}</td></tr>
      </tbody>
    </table>

    <table class="rp-tbl">
      <thead><tr><th>Kết quả trong ngày</th><th class="num-r">Số tiền</th></tr></thead>
      <tbody>
        <tr><td>Doanh thu thuần</td><td class="num-r">${fmt(s.revenue - s.discount - retValue)}</td></tr>
        <tr><td>Tổng giá vốn</td><td class="num-r">${fmt(s.cost)}</td></tr>
        <tr class="tot"><td>Lợi nhuận gộp</td><td class="num-r">${fmt(s.revenue - s.discount - retValue - s.cost)}</td></tr>
      </tbody>
    </table>`;

  return `
  <div class="breadcrumb">Trang chủ / Báo cáo / <b>Cuối ngày</b></div>
  <div class="rp-page">
    ${rpFilters({ concerns: [['sales', 'Bán hàng'], ['pay', 'Thanh toán']] })}
    <div>
      <div class="toolbar">
        <div class="page-h1">Báo cáo cuối ngày</div>
        <div class="spacer"></div>
        <span class="td-muted">Ngày bán ${day}</span>
      </div>
      ${reportViewer(paper)}
    </div>
  </div>`;
}

/* ---------- Báo cáo tài chính (kết quả hoạt động kinh doanh) ---------- */
function renderReportFinance() {
  const r = periodRange(RP.period);
  const a = aggregate(r);
  const exp = expensesFor(r);
  const expense = exp.total;
  const netProfit = a.profitAfterReturn - expense;
  const row = (label, value, cls = '', lv = 0) =>
    `<tr class="${cls}"><td class="${lv ? 'lv1' : ''}">${label}</td><td class="num-r">${fmt(value)}</td></tr>`;

  const paper = paperHead('Báo cáo kết quả hoạt động kinh doanh',
    [`Từ ngày ${dmy(r.from)} đến ngày ${dmy(r.to)}`, 'Chi nhánh: Tất cả chi nhánh']) + `
    <table class="rp-tbl">
      <thead><tr><th>Chỉ tiêu</th><th class="num-r">Số tiền</th></tr></thead>
      <tbody>
        ${row('Doanh thu bán hàng (1)', a.revenue, 'fin-strong')}
        ${row('Giảm trừ doanh thu (2 = 2.1 + 2.2)', a.discount + a.returnValue, 'fin-strong')}
        ${row('Chiết khấu, giảm giá hóa đơn (2.1)', a.discount, '', 1)}
        ${row('Giá trị hàng bán bị trả lại (2.2)', a.returnValue, '', 1)}
        ${row('Doanh thu thuần (3 = 1 − 2)', a.netAfterReturn, 'fin-strong')}
        ${row('Giá vốn hàng bán (4)', a.costAfterReturn, 'fin-strong')}
        ${row('Lợi nhuận gộp về bán hàng (5 = 3 − 4)', a.profitAfterReturn, 'fin-strong')}
        ${row('Chi phí hoạt động (6)', expense, 'fin-strong')}
        ${exp.rows.map(e => row(e.name, e.amount, '', 1)).join('')}
        <tr class="tot"><td>Lợi nhuận thuần (7 = 5 − 6)</td><td class="num-r">${fmt(netProfit)}</td></tr>
      </tbody>
    </table>
    <div class="rv-sub" style="margin-top:16px; text-align:left">
      Biên lợi nhuận gộp: <b style="color:var(--text)">${(a.netAfterReturn ? a.profitAfterReturn / a.netAfterReturn * 100 : 0).toFixed(2)}%</b> ·
      Biên lợi nhuận thuần: <b style="color:var(--text)">${(a.netAfterReturn ? netProfit / a.netAfterReturn * 100 : 0).toFixed(2)}%</b> ·
      Thuế VAT đầu ra đã thu: <b style="color:var(--text)">${fmt(a.vat)}</b>
    </div>`;

  return `
  <div class="breadcrumb">Trang chủ / Báo cáo / <b>Tài chính</b></div>
  <div class="rp-page">
    ${rpFilters({ concerns: [['pl', 'Hoạt động kinh doanh']] })}
    <div>
      <div class="toolbar">
        <div class="page-h1">Báo cáo tài chính</div>
        <div class="spacer"></div>
        <span class="td-muted">${dmy(r.from)} – ${dmy(r.to)}</span>
      </div>
      ${reportViewer(paper)}
    </div>
  </div>`;
}

/* ============================================================
   TRANG PLACEHOLDER (các module sẽ thiết kế sau)
   ============================================================ */
function renderPlaceholder(page) {
  const meta = PAGE_META[page] || { label: page, parent: null };
  const crumb = meta.parent
    ? `${meta.parent} / <b>${meta.label}</b>`
    : `<b>${meta.label}</b>`;
  return `
    <div class="breadcrumb">Trang chủ / ${crumb}</div>
    <div class="card placeholder">
      <div class="ph-ic">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <h2>${meta.label}</h2>
      <p>Màn hình <b>${meta.label}</b> sẽ được thiết kế ở bước tiếp theo.<br>Layout, menu điều hướng và Dashboard đã sẵn sàng làm nền.</p>
    </div>`;
}

/* ============================================================
   ROUTER (hash) — điều hướng như app thật
   ============================================================ */
function route() {
  const page = (location.hash.replace(/^#\//, '') || 'dashboard').split('?')[0];
  const content = document.getElementById('content');
  const meta = PAGE_META[page];

  // POS và các form lập phiếu chạy toàn màn hình: ẩn sidebar + topbar của khung quản lý
  const fullScreen = page === 'pos' || page === 'return-new' || !!DF_ROUTES[page];
  document.body.classList.toggle('pos-mode', fullScreen);
  // Vào form phiếu kho thì khởi tạo đúng loại phiếu
  if (DF_ROUTES[page] && DF.type !== DF_ROUTES[page]) dfReset(DF_ROUTES[page]);

  content.innerHTML =
    page === 'dashboard'     ? renderDashboard() :
    page === 'pos'           ? renderPOS() :
    page === 'products-list' ? renderProductsList() :
    DOC_RENDER[page]         ? DOC_RENDER[page]() :
    page === 'invoices'      ? renderInvoices() :
    page === 'returns'       ? renderReturns() :
    page === 'return-new'    ? renderReturnForm() :
    DF_ROUTES[page]          ? renderDocForm() :
    page === 'an-sale-overview' ? renderAnSaleOverview() :
    page === 'an-sale-profit'   ? renderAnSaleProfit() :
    page === 'an-prod-overview' ? renderAnProdOverview() :
    page === 'an-prod-stock'    ? renderAnProdStock() :
    page === 'an-prod-class'    ? renderAnProdClass() :
    page === 'an-cust-overview' ? renderAnCustOverview() :
    page === 'an-cust-class'    ? renderAnCustClass() :
    page === 'an-eff-debt'      ? renderAnEffDebt() :
    page === 'rp-eod'        ? renderReportEod() :
    page === 'rp-finance'    ? renderReportFinance() :
    REPORTS[page]            ? renderReport(page) :
    renderPlaceholder(page);
  document.getElementById('topTitle').textContent = meta ? meta.label : 'Tổng quan';
  document.title = `GreenPOS — ${meta ? meta.label : 'Tổng quan'}`;
  highlightNav(page);
  content.scrollTop = 0;
  if (page === 'pos') document.getElementById('posSearch').focus();
  if (page === 'return-new') { const el = document.getElementById('rfPickSearch'); if (el) el.focus(); }
  fitDetail();

  // Mobile: chọn trang xong tự đóng sidebar
  document.getElementById('sidebar').classList.remove('mobile-open');
}

/* Phím tắt POS: F3 tìm hàng, F4 tìm khách, Enter đóng modal thành công */
document.addEventListener('keydown', ev => {
  if (!document.body.classList.contains('pos-mode')) return;
  if (ev.key === 'F3') { ev.preventDefault(); const el = document.getElementById('posSearch'); if (el) el.focus(); }
  if (ev.key === 'F4') { ev.preventDefault(); const el = document.getElementById('custSearch'); if (el) el.focus(); }
  if (ev.key === 'Enter' && POS.receipt) posDone();
});
/* Enter trong các ô số = xác nhận luôn (mặc định phải rời ô mới tính lại) */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  if (ev.target.matches('input.df-qty, input.cell-input, input.pb-input, input.sum-input, input.pf-in.num, input.qty-of input')) {
    ev.preventDefault();
    ev.target.blur();
  }
});

/* Esc đóng modal chi tiết hàng hóa / hóa đơn */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (PF.open) { pfClose(); }
  else if (LIST.popen) { plClose(); }
  else if (LIST.iopen) { invClose(); }
  else if (LIST.ropen) { retClose(); }
  else { const k = Object.keys(DOC).find(x => DOC[x].open); if (k) docClose(k); }
});
/* Click ra ngoài thì đóng dropdown gợi ý tìm kiếm (chỉ loại có id, không đụng menu do state điều khiển) */
document.addEventListener('click', ev => {
  document.querySelectorAll('.pos-drop.show[id]').forEach(d => {
    if (!d.parentElement.contains(ev.target)) d.classList.remove('show');
  });
  // Menu "Tạo mới" đóng khi bấm ra ngoài
  if (LIST.newMenu && !ev.target.closest('.new-menu-wrap')) { LIST.newMenu = false; listRefresh(); }
});

/* ============================================================
   KHỞI TẠO
   ============================================================ */
renderNav();
window.addEventListener('hashchange', route);
route();

document.getElementById('toggleSidebar').addEventListener('click', () => {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 820) {
    // Mobile: sidebar dạng trượt, luôn hiển thị đầy đủ
    sb.classList.remove('mini');
    sb.classList.toggle('mobile-open');
  } else {
    sb.classList.toggle('mini');
    // Thu nhỏ thì đóng các nhóm đang bung để tránh lệch layout khi mở lại
    if (sb.classList.contains('mini')) {
      document.querySelectorAll('.nav-group.open').forEach(g => {
        if (!g.classList.contains('child-active')) g.classList.remove('open');
      });
    }
  }
});
</script>
</body>
</html>
