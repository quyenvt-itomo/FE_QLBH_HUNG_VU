<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPOS — Quản lý bán hàng</title>
<style>
  /* ============================================================
     DESIGN TOKENS — màu phẳng, chủ đạo xanh lục
     ============================================================ */
  :root {
    --green-950: #0B2B1C;   /* nền sidebar */
    --green-900: #0F3A26;   /* hover sidebar */
    --green-800: #14532D;
    --green-700: #15803D;
    --green-600: #16A34A;   /* primary */
    --green-500: #22C55E;
    --green-100: #DCFCE7;
    --green-50:  #F0FDF4;

    --bg:        #F3F6F4;   /* nền content */
    --card:      #FFFFFF;
    --border:    #E3EAE5;
    --text:      #1B2A21;
    --muted:     #6B7A70;

    --red-600:   #DC2626;
    --red-50:    #FEF2F2;
    --amber-600: #D97706;
    --amber-50:  #FFFBEB;
    --blue-600:  #2563EB;
    --blue-50:   #EFF6FF;

    --sidebar-w: 248px;
    --topbar-h:  56px;
    --radius:    10px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  a { text-decoration: none; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #C7D2CB; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============================================================
     KHUNG APP: sidebar dọc + topbar + content
     ============================================================ */
  .app { display: flex; height: 100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--green-950);
    color: #CFE3D6;
    display: flex;
    flex-direction: column;
    transition: width .22s ease, min-width .22s ease;
    z-index: 30;
  }

  /* ---------- CHẾ ĐỘ THU NHỎ (chỉ còn icon) ---------- */
  .sidebar.mini { width: 68px; min-width: 68px; }
  .sidebar.mini .brand { justify-content: center; padding: 0; }
  .sidebar.mini .brand-name,
  .sidebar.mini .nav-section,
  .sidebar.mini .nav-item .label,
  .sidebar.mini .nav-item .chevron,
  .sidebar.mini .pos-btn .pos-label,
  .sidebar.mini .sidebar-foot { display: none; }
  .sidebar.mini .pos-btn { width: 40px; padding: 0; margin: 14px auto 6px; }
  .sidebar.mini .nav { overflow: visible; }
  .sidebar.mini .nav-item { justify-content: center; padding: 0; }
  .sidebar.mini .nav-group { position: relative; }
  /* Submenu bung ra bên phải khi hover icon */
  .sidebar.mini .nav-sub {
    position: absolute;
    left: 100%;
    top: 0;
    max-height: none;
    display: none;
    background: var(--green-950);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 6px;
    min-width: 200px;
    z-index: 60;
  }
  .sidebar.mini .nav-group:hover > .nav-sub { display: block; }
  .sidebar.mini .nav-sub a { padding-left: 12px; }
  .sidebar.mini .nav-sub a::before { display: none; }
  .nav-sub-title { display: none; }
  .sidebar.mini .nav-sub-title {
    display: block;
    padding: 8px 12px 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: #5E7A6B;
  }
  /* Icon cha sáng lên khi trang con đang mở */
  .nav-group.child-active > .nav-item { color: #fff; background: var(--green-900); }

  .brand {
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 18px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .brand-logo {
    width: 32px; height: 32px;
    background: var(--green-600);
    border-radius: 8px;
    display: grid; place-items: center;
    color: #fff;
  }
  .brand-name { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: .2px; }
  .brand-name span { color: var(--green-500); }

  /* Nút Bán hàng (POS) nổi bật đầu menu */
  .pos-btn {
    margin: 14px 14px 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--green-600);
    color: #fff;
    border: none;
    border-radius: 8px;
    height: 40px;
    font-size: 14px; font-weight: 600;
    flex-shrink: 0;
  }
  .pos-btn:hover { background: var(--green-500); }

  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px 16px;
  }
  .nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); }

  .nav-group { margin-bottom: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    padding: 0 12px;
    height: 40px;
    border: none;
    background: transparent;
    color: #CFE3D6;
    border-radius: 8px;
    font-size: 13.5px;
    text-align: left;
    white-space: nowrap;
  }
  .nav-item:hover { background: var(--green-900); color: #fff; }
  .nav-item.active {
    background: var(--green-600);
    color: #fff;
    font-weight: 600;
  }
  .nav-item .icon { width: 19px; height: 19px; flex-shrink: 0; }
  .nav-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-item .chevron { width: 14px; height: 14px; transition: transform .18s ease; opacity: .6; }
  .nav-group.open > .nav-item .chevron { transform: rotate(90deg); }

  .nav-sub {
    max-height: 0;
    overflow: hidden;
    transition: max-height .22s ease;
  }
  .nav-group.open > .nav-sub { max-height: 320px; }
  .nav-sub a {
    display: flex; align-items: center;
    height: 34px;
    padding-left: 42px;
    border-radius: 8px;
    font-size: 13px;
    color: #9DB8A8;
    position: relative;
  }
  .nav-sub a::before {
    content: "";
    position: absolute; left: 22px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: .5;
  }
  .nav-sub a:hover { color: #fff; background: var(--green-900); }
  .nav-sub a.active { color: var(--green-500); font-weight: 600; }

  .nav-section {
    padding: 16px 12px 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: #5E7A6B;
  }

  .sidebar-foot {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 12px;
    color: #7E9B8C;
    flex-shrink: 0;
  }

  /* ---------- KHU BÊN PHẢI ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    height: var(--topbar-h);
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: none; background: transparent;
    border-radius: 8px;
    color: var(--muted);
    position: relative;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn .badge {
    position: absolute; top: 4px; right: 4px;
    min-width: 15px; height: 15px;
    padding: 0 4px;
    background: var(--red-600);
    color: #fff;
    font-size: 9.5px; font-weight: 700;
    border-radius: 8px;
    display: grid; place-items: center;
  }

  .page-title-top { font-size: 16px; font-weight: 700; }

  .search-box {
    flex: 1;
    max-width: 420px;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 36px;
    padding: 0 12px;
    color: var(--muted);
  }
  .search-box input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 13.5px; color: var(--text);
  }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .branch-pill {
    display: flex; align-items: center; gap: 7px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-size: 13px; font-weight: 600;
    color: var(--text);
  }
  .branch-pill:hover { border-color: var(--green-600); color: var(--green-700); }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--green-100);
    color: var(--green-700);
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
    border: none;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  /* ============================================================
     THÀNH PHẦN CHUNG
     ============================================================ */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .card-title { font-size: 14.5px; font-weight: 700; }
  .card-body { padding: 16px; }

  .select {
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    font-size: 12.5px;
    color: var(--text);
    padding: 0 8px;
    outline: none;
    font-family: inherit;
  }
  .select:hover { border-color: var(--green-600); }

  .seg {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: none; background: transparent;
    height: 26px; padding: 0 12px;
    border-radius: 6px;
    font-size: 12.5px; font-weight: 600;
    color: var(--muted);
  }
  .seg button.active { background: var(--green-600); color: #fff; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11.5px; font-weight: 700;
  }
  .chip.up   { background: var(--green-50); color: var(--green-700); }
  .chip.down { background: var(--red-50); color: var(--red-600); }

  /* ============================================================
     DASHBOARD
     ============================================================ */
  .dash-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 16px;
    align-items: start;
  }
  .dash-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* KPI cards */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .kpi-top { display: flex; align-items: center; gap: 10px; }
  .kpi-ic {
    width: 38px; height: 38px;
    border-radius: 9px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .kpi-ic.green { background: var(--green-100); color: var(--green-700); }
  .kpi-ic.red   { background: var(--red-50);   color: var(--red-600); }
  .kpi-ic.amber { background: var(--amber-50); color: var(--amber-600); }
  .kpi-ic.blue  { background: var(--blue-50);  color: var(--blue-600); }
  .kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .kpi-value { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
  .kpi-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  /* Biểu đồ cột */
  .chart-wrap { width: 100%; overflow-x: auto; }
  .chart-svg { display: block; width: 100%; height: 260px; }
  .bar { fill: var(--green-600); }
  .bar:hover { fill: var(--green-800); }
  .bar-b2 { fill: #86EFAC; }
  .bar-b2:hover { fill: var(--green-500); }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .axis-text { fill: var(--muted); font-size: 10.5px; }
  .chart-legend { display: flex; gap: 18px; padding: 4px 16px 14px; font-size: 12px; color: var(--muted); }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

  .big-number { font-size: 20px; font-weight: 700; color: var(--green-700); }

  /* Top 10 — thanh ngang */
  .row-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .hbar-list { display: flex; flex-direction: column; gap: 11px; padding: 14px 16px; }
  .hbar { display: grid; grid-template-columns: 1fr 72px; gap: 10px; align-items: center; }
  .hbar-info { min-width: 0; }
  .hbar-name {
    font-size: 12.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .hbar-track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .hbar-fill { height: 100%; background: var(--green-600); border-radius: 4px; }
  .hbar:nth-child(-n+3) .hbar-fill { background: var(--green-700); }
  .hbar-val { font-size: 12.5px; font-weight: 700; text-align: right; color: var(--text); }

  /* Feed hoạt động */
  .feed { display: flex; flex-direction: column; }
  .feed-item {
    display: flex; gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-dot {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .feed-dot.sale   { background: var(--green-100); color: var(--green-700); }
  .feed-dot.import { background: var(--blue-50); color: var(--blue-600); }
  .feed-dot.move   { background: var(--amber-50); color: var(--amber-600); }
  .feed-dot.return { background: var(--red-50); color: var(--red-600); }
  .feed-text { font-size: 12.5px; line-height: 1.45; }
  .feed-text b { font-weight: 700; }
  .feed-text .act { color: var(--green-700); font-weight: 600; }
  .feed-text .val { font-weight: 700; }
  .feed-time { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ============================================================
     TRANG PLACEHOLDER
     ============================================================ */
  .placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh;
    gap: 14px;
    text-align: center;
  }
  .placeholder .ph-ic {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: var(--green-100);
    color: var(--green-700);
    display: grid; place-items: center;
  }
  .placeholder h2 { font-size: 20px; }
  .placeholder p { color: var(--muted); max-width: 380px; line-height: 1.6; }

  .breadcrumb { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .breadcrumb b { color: var(--text); }

  /* ============================================================
     TRANG DANH SÁCH (hàng hóa, hóa đơn) — filter trái + bảng phải
     ============================================================ */
  .list-page {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .f-sec { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .f-sec:last-child { border-bottom: none; }
  .f-title {
    font-size: 10.5px; font-weight: 800;
    letter-spacing: .7px; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .f-opt {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .f-opt input { accent-color: var(--green-600); }
  .f-opt .cnt { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .f-input {
    width: 100%; height: 34px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0 10px;
    font-size: 13px; font-family: inherit; outline: none;
    background: var(--bg); color: var(--text);
  }
  .f-input:focus { border-color: var(--green-600); background: #fff; }
  select.f-input { cursor: pointer; }
  .f-range { display: flex; align-items: center; gap: 6px; }
  .f-range .f-input { text-align: right; }
  .f-range span { color: var(--muted); font-size: 12px; }
  .f-head { display: flex; align-items: center; }
  .f-head .f-clear {
    margin-left: auto; border: none; background: none;
    font-size: 11px; font-weight: 600; color: var(--green-700);
    padding: 0; margin-bottom: 8px;
  }
  .f-head .f-clear:hover { text-decoration: underline; }
  .filter-card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px; font-weight: 700;
  }
  .filter-card-head .reset {
    margin-left: auto;
    border: none; background: none;
    font-size: 11.5px; font-weight: 600; color: var(--green-700);
  }
  .filter-card-head .reset:hover { text-decoration: underline; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .page-h1 { font-size: 18px; font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 14px;
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .btn:hover { border-color: var(--green-600); color: var(--green-700); }
  .btn-primary { background: var(--green-600); border-color: var(--green-600); color: #fff; }
  .btn-primary:hover { background: var(--green-500); border-color: var(--green-500); color: #fff; }

  /* Bảng cuộn ngang khi nhiều cột */
  .tbl-scroll { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .4px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: #FAFCFB;
    white-space: nowrap;
    position: sticky; top: 0; z-index: 2;
  }
  .tbl th.sortable { cursor: pointer; user-select: none; }
  .tbl th.sortable:hover { color: var(--green-700); }
  .tbl th .sort-ar { opacity: .35; margin-left: 3px; }
  .tbl th.sorted { color: var(--green-700); }
  .tbl th.sorted .sort-ar { opacity: 1; }
  .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr.rowm { cursor: pointer; }
  .tbl tr.rowm:hover td { background: var(--green-50); }
  .tbl tr.rowm.open td { background: var(--green-50); }
  /* Vạch xanh đánh dấu dòng đang mở — chỉ vẽ ở ô đầu, tránh mọc vạch dọc ở từng ô */
  .tbl tr.rowm.open td:first-child { box-shadow: inset 3px 0 0 var(--green-600); }
  .tbl tr.sum-line td {
    background: #F7FAF8;
    font-weight: 700;
    border-bottom: 2px solid var(--border);
    font-size: 12.5px;
  }
  .num-r { text-align: right; white-space: nowrap; }
  .td-code { color: var(--green-700); font-weight: 600; white-space: nowrap; }
  .td-muted { color: var(--muted); font-size: 12.5px; }
  .td-nowrap { white-space: nowrap; }
  .tbl .chk { width: 34px; }
  .tbl .chk input { accent-color: var(--green-600); cursor: pointer; }

  /* Thumbnail hàng hóa trong bảng */
  .thumb {
    width: 34px; height: 34px; flex-shrink: 0;
    border-radius: 7px;
    background: var(--green-50);
    color: var(--green-700);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
  }
  .cell-name { display: flex; align-items: center; gap: 10px; min-width: 220px; }

  /* Thanh hành động hàng loạt khi tick chọn */
  .bulk-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    background: var(--green-50);
    border-bottom: 1px solid var(--green-100);
    font-size: 13px;
  }
  .bulk-bar b { color: var(--green-700); }
  .bulk-bar .btn { height: 30px; font-size: 12.5px; }
  .bulk-bar .clear-sel { margin-left: auto; border: none; background: none; color: var(--muted); font-size: 12.5px; }
  .bulk-bar .clear-sel:hover { color: var(--red-600); }

  /* Badge trạng thái */
  .st {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11.5px; font-weight: 700;
    white-space: nowrap;
  }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-green { background: var(--green-50); color: var(--green-700); }
  .st-red   { background: var(--red-50); color: var(--red-600); }
  .st-amber { background: var(--amber-50); color: var(--amber-600); }
  .st-blue  { background: var(--blue-50); color: var(--blue-600); }
  .st-gray  { background: var(--bg); color: var(--muted); }
  /* Ô nhập giá trong bảng thiết lập giá */
  .pb-input {
    width: 130px; height: 30px;
    border: 1px solid var(--border); border-radius: 7px;
    text-align: right; padding: 0 10px;
    font-size: 13px; font-family: inherit; outline: none;
    background: #fff; font-weight: 600;
  }
  .pb-input:focus { border-color: var(--green-600); }
  .pb-input.changed { border-color: var(--green-600); background: var(--green-50); color: var(--green-800); }
  /* Hàng tìm kiếm nội dòng dưới header bảng */
  .tbl tr.filter-row td { padding: 6px 12px; background: #fff; }
  .tbl tr.filter-row input {
    width: 100%; height: 30px;
    border: 1px solid var(--border); border-radius: 7px;
    padding: 0 9px; font-size: 12.5px; font-family: inherit; outline: none;
  }
  .tbl tr.filter-row input:focus { border-color: var(--green-600); }
  /* Trạng thái rỗng có hình minh họa */
  .empty-state { text-align: center; padding: 54px 20px; }
  .empty-state .ic {
    width: 84px; height: 84px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--green-50); color: var(--green-600);
    display: grid; place-items: center;
  }
  .empty-state h3 { font-size: 15.5px; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* Vùng chi tiết khi bung dòng — đặt trong 1 card trắng nổi trên nền xám */
  .detail-cell { background: var(--bg) !important; padding: 14px !important; box-shadow: inset 3px 0 0 var(--green-600); }
  /* Ghim theo mép trái vùng cuộn để chi tiết luôn nằm trong khung nhìn dù bảng rộng */
  .detail-cell > * { position: sticky; left: 14px; box-sizing: border-box; }
  .detail-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .detail-inner { padding: 16px; }
  /* Tab trong vùng chi tiết */
  .dtabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); background: #FAFCFB; }
  .dtabs button {
    border: none; background: none;
    padding: 11px 14px;
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .dtabs button:hover { color: var(--text); }
  .dtabs button.active { color: var(--green-700); border-bottom-color: var(--green-600); }
  /* Header chi tiết */
  .d-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .d-head .thumb-lg {
    width: 62px; height: 62px; border-radius: 10px;
    background: var(--green-50); color: var(--green-700);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .d-head h3 { font-size: 15.5px; margin-bottom: 3px; }
  .d-head .d-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .d-head .d-right { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--muted); }
  .tag {
    display: inline-block;
    padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
    background: var(--bg); color: var(--muted);
    border: 1px solid var(--border);
    margin-right: 4px;
  }
  .tag.g { background: var(--green-50); color: var(--green-700); border-color: var(--green-100); }
  /* Khối tổng kết bên phải trong chi tiết hóa đơn */
  .inv-foot { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-bottom: 12px; }
  .inv-note {
    width: 100%; min-height: 92px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 12.5px; font-family: inherit;
    background: #fff; outline: none; resize: vertical;
  }
  .inv-note:focus { border-color: var(--green-600); }
  .inv-sum { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .inv-sum .sum-row { padding: 5px 0; font-size: 13px; }
  .inv-sum .sum-row.big { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 8px; }
  .inv-sum .sum-row.big b { font-size: 16px; color: var(--green-700); }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 20px;
    margin-bottom: 12px;
  }
  .dg-item .dg-l { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .dg-item .dg-v { font-size: 13.5px; font-weight: 600; }
  .detail-actions { display: flex; gap: 8px; }
  .detail-actions .btn { height: 32px; font-size: 12.5px; }
  .mini-tbl { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .mini-tbl .tbl th { position: static; background: #FAFCFB; }
  .mini-tbl .tbl td, .mini-tbl .tbl th { padding: 8px 12px; }

  /* ---------- Modal chi tiết (hàng hóa / hóa đơn) ---------- */
  .modal-ov {
    position: fixed; inset: 0;
    background: rgba(11, 43, 28, .48);
    display: flex; align-items: center; justify-content: center;   /* căn giữa màn hình */
    padding: 24px 20px;
    z-index: 300;
    overflow: hidden;
  }
  .modal-box {
    background: #fff;
    width: 100%; max-width: 920px;
    /* Chiều cao cố định để không nhảy kích thước khi đổi tab */
    height: min(660px, calc(100vh - 48px));
    display: flex; flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: modalIn .16s ease-out;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .modal-head {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-head .thumb-lg { width: 54px; height: 54px; }
  .modal-head h3 { font-size: 17px; margin-bottom: 4px; }
  .modal-head .m-sub { font-size: 12.5px; color: var(--muted); }
  .modal-head .m-right { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); }
  .modal-x {
    width: 32px; height: 32px; flex-shrink: 0;
    border: none; background: var(--bg); color: var(--muted);
    border-radius: 8px; font-size: 17px; line-height: 1;
    display: grid; place-items: center;
  }
  .modal-x:hover { background: var(--red-50); color: var(--red-600); }
  /* Thân modal chiếm hết phần còn lại và tự cuộn khi nội dung tràn */
  .modal-body { padding: 18px 22px; flex: 1; overflow-y: auto; min-height: 0; }
  .modal-foot {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    background: #FAFCFB;
    flex-shrink: 0;
  }
  .modal-box .dtabs { padding: 0 22px; flex-shrink: 0; }

  /* Phân trang */
  .pagi {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 16px;
    font-size: 12.5px; color: var(--muted);
  }
  .pagi .pg-info { margin-right: auto; }
  .pagi button {
    min-width: 30px; height: 30px;
    border: 1px solid var(--border); border-radius: 7px;
    background: #fff;
    font-size: 12.5px; font-weight: 600; color: var(--text);
  }
  .pagi button:hover { border-color: var(--green-600); color: var(--green-700); }
  .pagi button.cur { background: var(--green-600); border-color: var(--green-600); color: #fff; }
  .pagi button:disabled { opacity: .4; pointer-events: none; }

  @media (max-width: 1100px) { .list-page { grid-template-columns: 1fr; } .detail-grid { grid-template-columns: repeat(2, 1fr); } }

  /* ============================================================
     PHÂN TÍCH & BÁO CÁO
     ============================================================ */
  /* Thanh điều kiện trên đầu trang phân tích */
  .an-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .an-bar .spacer { flex: 1; }

  /* Lưới KPI 6 ô của trang phân tích */
  .an-kpis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 16px;
  }
  .an-kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .an-kpi .k-l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .an-kpi .k-v { font-size: 23px; font-weight: 700; letter-spacing: -.4px; margin: 6px 0 8px; }
  .an-kpi .k-f { display: flex; gap: 18px; font-size: 11.5px; color: var(--muted); }
  .an-kpi .k-f b { display: block; color: var(--text); font-size: 12.5px; margin-top: 1px; }
  .an-kpi .k-f .up { color: var(--green-700); }
  .an-kpi .k-f .down { color: var(--red-600); }

  /* Biểu đồ đường nhiều chuỗi */
  .line-svg { display: block; width: 100%; height: 280px; }
  .lg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }

  /* Tab "Phân tích theo" */
  .an-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 16px; flex-wrap: wrap; }
  .an-tabs button {
    border: none; background: none;
    padding: 11px 13px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .an-tabs button:hover { color: var(--text); }
  .an-tabs button.active { color: var(--green-700); border-bottom-color: var(--green-600); }

  /* ---------- Trang báo cáo: panel trái + nội dung phải ---------- */
  .rp-page {
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .seg-full { display: flex; width: 100%; }
  .seg-full button { flex: 1; }

  /* ---------- Khu Phân tích: sub-nav trái + nội dung phải ---------- */
  .an-page { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 16px; align-items: start; }
  .an-page.navclosed { grid-template-columns: 0 minmax(0, 1fr); }
  .an-page.navclosed .an-nav { display: none; }
  .an-nav { position: sticky; top: 0; }
  .an-nav-head {
    display: flex; align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 700;
  }
  .an-nav-head button {
    margin-left: auto;
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: 50%;
    background: #fff; color: var(--muted); font-size: 11px;
  }
  .an-nav-head button:hover { border-color: var(--green-600); color: var(--green-700); }
  .an-grp { border-bottom: 1px solid var(--border); }
  .an-grp:last-child { border-bottom: none; }
  .an-grp-title {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px 7px;
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .an-grp-title .ic { color: var(--muted); display: grid; }
  .an-grp.on > .an-grp-title, .an-grp.on > .an-grp-title .ic { color: var(--green-700); }
  .an-grp-items { padding-bottom: 6px; }
  .an-grp-items a {
    display: block; padding: 8px 14px 8px 37px;
    font-size: 13px; color: var(--muted);
  }
  .an-grp-items a:hover { color: var(--text); background: var(--bg); }
  .an-grp-items a.active { color: var(--green-700); font-weight: 600; background: var(--green-50); }

  /* Thẻ KPI gọn (dải trên cùng) */
  .kpi-strip { display: grid; gap: 14px; margin-bottom: 16px; }
  .kpi-slim {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .kpi-slim .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .kpi-slim .v { font-size: 21px; font-weight: 700; margin-top: 5px; letter-spacing: -.3px; }
  .kpi-slim .d { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .kpi-slim .d b.up { color: var(--green-700); }
  .kpi-slim .d b.down { color: var(--red-600); }
  .kpi-slim .spark { margin-top: 8px; }

  /* Thẻ cảnh báo có chấm màu */
  .warn-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .warn-card .wt { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .warn-card .wt i { width: 8px; height: 8px; border-radius: 50%; }
  .warn-card .wv { font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
  .warn-card .wv span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .warn-card .wd { font-size: 11.5px; color: var(--muted); }
  .link-more { font-size: 12px; font-weight: 600; color: var(--green-700); cursor: pointer; }
  .link-more:hover { text-decoration: underline; }

  /* Chú giải biểu đồ tròn */
  .pie-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .pie-legend { flex: 1; min-width: 190px; display: flex; flex-direction: column; gap: 9px; }
  .pie-legend .row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
  .pie-legend .row i { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .pie-legend .row .nm { flex: 1; }
  .pie-legend .row .pc { color: var(--muted); }
  .pie-legend .row b { min-width: 74px; text-align: right; }

  /* Bố cục 2 cột: biểu đồ trái + chú giải phải */
  .split-2 { display: grid; grid-template-columns: minmax(300px, 440px) minmax(320px, 1fr); gap: 20px; align-items: start; }
  .split-2 > * { min-width: 0; }
  @media (max-width: 1100px) { .split-2 { grid-template-columns: 1fr; } }

  /* Chú giải phân loại (có mô tả + sparkline) */
  .cls-legend { display: flex; flex-direction: column; gap: 2px; }
  .cls-row { display: grid; grid-template-columns: 128px 40px 62px minmax(150px, 1fr); gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .cls-row > * { min-width: 0; }
  .cls-row:last-child { border-bottom: none; }
  .cls-row .nm { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .cls-row .nm i { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .cls-row .ct { font-size: 14px; font-weight: 700; }
  .cls-row .ds { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  /* Nút lọc dạng viên */
  .pills { display: flex; gap: 7px; flex-wrap: wrap; }
  .pills button {
    height: 28px; padding: 0 13px;
    border: 1px solid var(--border); border-radius: 20px;
    background: #fff; font-size: 12.5px; font-weight: 600; color: var(--muted);
  }
  .pills button:hover { border-color: var(--green-600); color: var(--green-700); }
  .pills button.active { background: var(--green-600); border-color: var(--green-600); color: #fff; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1150px) { .grid-2 { grid-template-columns: 1fr; } .an-page { grid-template-columns: 1fr; } }

  /* ---------- Trình xem báo cáo: khung xám + trang giấy trắng ---------- */
  .rv {
    background: #58675E;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .rv-toolbar {
    display: flex; align-items: center; gap: 1px;
    padding: 6px 10px;
    background: #47544C;
    flex-wrap: wrap;
  }
  .rv-toolbar button {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border: none; background: transparent;
    color: #CFE0D5; border-radius: 6px;
    font-size: 13px;
  }
  .rv-toolbar button:hover { background: rgba(255,255,255,.14); color: #fff; }
  .rv-toolbar button:disabled { opacity: .35; pointer-events: none; }
  .rv-sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); margin: 0 6px; }
  .rv-pg { display: flex; align-items: center; gap: 5px; color: #CFE0D5; font-size: 12px; }
  .rv-pg input {
    width: 34px; height: 24px; text-align: center;
    border: none; border-radius: 5px; font-size: 12px;
    font-family: inherit; outline: none;
  }
  .rv-scroll { padding: 22px 16px 28px; overflow-x: auto; }
  .rv-paper {
    background: #fff;
    width: 880px; max-width: 100%;
    margin: 0 auto;
    padding: 24px 28px 30px;
    box-shadow: 0 6px 22px rgba(0,0,0,.28);
  }
  .rv-meta { font-size: 11px; color: var(--muted); }
  .rv-paper h2 { text-align: center; font-size: 16.5px; margin: 12px 0 7px; letter-spacing: .2px; }
  .rv-sub { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.75; }

  /* Bảng trong trang báo cáo */
  .rp-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 18px; }
  .rp-tbl th {
    background: var(--green-100); color: var(--green-800);
    padding: 9px 10px; text-align: left;
    font-size: 11.5px; font-weight: 700;
    white-space: nowrap;
  }
  .rp-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .rp-tbl tr.rv-total td { background: #FBF6E3; font-weight: 700; border-bottom: 1px solid #EDE4C4; }
  .rp-tbl tr.rv-total td.num-r { color: var(--green-700); }
  .rp-tbl tr.rv-row:hover td { background: var(--green-50); }
  .rp-tbl .num-r { text-align: right; white-space: nowrap; }
  .rp-link { color: var(--green-700); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .rp-link:hover { color: var(--green-500); }
  .rv-exp {
    display: inline-grid; place-items: center;
    width: 14px; height: 14px;
    border: 1px solid #9FB3A6; border-radius: 3px;
    font-size: 11px; line-height: 1; color: var(--muted);
    margin-right: 8px; cursor: pointer;
    vertical-align: middle;
  }
  .rv-exp:hover { border-color: var(--green-600); color: var(--green-700); }
  /* Bảng con khi bung dòng */
  .rv-drill > td { padding: 0 !important; background: #F6FAF7; }
  .rv-drill .drill-in { padding: 8px 0 12px 30px; }
  .rv-drill .rp-tbl { margin-top: 0; }
  .rv-drill .rp-tbl th { background: #DCEFE3; }
  .rv-drill .rp-tbl td { border-bottom: 1px solid #E7EFE9; }
  /* Nhóm dòng & tổng trong báo cáo dạng chứng từ */
  .rp-tbl tr.grp td { background: #F2F7F4; font-weight: 700; }
  .rp-tbl tr.tot td { background: var(--green-100); color: var(--green-800); font-weight: 700; }
  .lv1 { padding-left: 30px !important; color: var(--muted); }
  .fin-strong td { font-weight: 700; }
  .fin-strong td:first-child { color: var(--text); }

  @media (max-width: 1200px) { .an-kpis { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 1100px) { .rp-page { grid-template-columns: 1fr; } }
  @media (max-width: 700px)  { .an-kpis { grid-template-columns: 1fr; } }

  /* ============================================================
     MÀN BÁN HÀNG (POS) — toàn màn hình, ẩn khung quản lý
     ============================================================ */
  body.pos-mode .sidebar, body.pos-mode .topbar { display: none; }
  body.pos-mode .content { padding: 0; overflow: hidden; }

  .pos { display: flex; flex-direction: column; height: 100%; background: var(--bg); }

  /* Header POS */
  .pos-head {
    height: 54px;
    background: var(--green-950);
    display: flex; align-items: center; gap: 12px;
    padding: 0 12px;
    flex-shrink: 0;
  }
  .pos-back {
    display: flex; align-items: center; gap: 6px;
    color: #CFE3D6; font-size: 13px; font-weight: 600;
    padding: 0 10px; height: 36px; border-radius: 8px;
  }
  .pos-back:hover { background: var(--green-900); color: #fff; }

  .pos-search-wrap { position: relative; width: 360px; }
  .pos-search {
    width: 100%; height: 38px;
    border: none; border-radius: 8px;
    padding: 0 12px 0 36px;
    font-size: 13.5px; outline: none;
    background: #fff; color: var(--text);
    font-family: inherit;
  }
  .pos-search-wrap .s-ic {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .pos-drop {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: 480px; max-height: 380px; overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    z-index: 100;
    display: none;
  }
  .pos-drop.show { display: block; }
  .pos-drop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .pos-drop-item:last-child { border-bottom: none; }
  .pos-drop-item:hover, .pos-drop-item.hl { background: var(--green-50); }
  .pos-drop-item .p-name { font-size: 13px; font-weight: 600; }
  .pos-drop-item .p-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .pos-drop-item .p-price { margin-left: auto; font-weight: 700; font-size: 13px; color: var(--green-700); }
  .pos-drop-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Tab hóa đơn */
  .pos-tabs { display: flex; align-items: center; gap: 6px; overflow-x: auto; }
  .pos-tab {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px;
    background: rgba(255,255,255,.1);
    color: #CFE3D6;
    border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  .pos-tab.active { background: var(--bg); color: var(--green-800); }
  .pos-tab .x {
    display: grid; place-items: center;
    width: 16px; height: 16px; border-radius: 50%;
    font-size: 12px; line-height: 1;
  }
  .pos-tab .x:hover { background: rgba(0,0,0,.15); }
  .pos-tab-add {
    width: 32px; height: 32px;
    border: none; border-radius: 8px;
    background: rgba(255,255,255,.1);
    color: #CFE3D6; font-size: 17px;
  }
  .pos-tab-add:hover { background: var(--green-900); color: #fff; }
  .pos-head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #9DB8A8; font-size: 12.5px; }

  /* Thân POS */
  .pos-body { flex: 1; display: flex; min-height: 0; }
  .pos-cart { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .cart-grid { display: grid; grid-template-columns: 30px 84px 1fr 112px 100px 108px 118px 36px; gap: 8px; align-items: center; }
  /* Ô tiền sửa trực tiếp trong bảng (đơn giá, giảm giá dòng) */
  .cell-input {
    width: 100%; height: 28px;
    border: 1px solid transparent; border-radius: 6px;
    text-align: right;
    font-size: 13px; font-family: inherit;
    outline: none; background: transparent; color: var(--text);
  }
  .cell-input:hover { border-color: var(--border); background: #fff; }
  .cell-input:focus { border-color: var(--green-600); background: #fff; }
  .cell-input.has-disc { color: var(--amber-600); font-weight: 600; }
  .cart-headrow {
    padding: 9px 14px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  .cart-list { flex: 1; overflow-y: auto; }
  .cart-row { padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--border); }
  .cart-row .c-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cart-row .c-unit { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .cart-row .c-code { font-size: 12.5px; color: var(--muted); }
  .cart-row .c-num { text-align: right; font-size: 13px; }
  .cart-row .c-total { text-align: right; font-size: 13px; font-weight: 700; }
  .qty-box { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .qty-box button {
    width: 24px; height: 24px;
    border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text);
    font-size: 14px; line-height: 1;
  }
  .qty-box button:hover { border-color: var(--green-600); color: var(--green-700); }
  .qty-box input {
    width: 44px; height: 26px;
    text-align: center;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; outline: none; font-family: inherit;
  }
  .qty-box input:focus { border-color: var(--green-600); }
  .row-del {
    width: 26px; height: 26px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--muted);
    display: grid; place-items: center;
  }
  .row-del:hover { background: var(--red-50); color: var(--red-600); }

  /* Trạng thái giỏ trống + chọn nhanh */
  .pos-empty { flex: 1; overflow-y: auto; padding: 26px; text-align: center; }
  .pos-empty h3 { font-size: 15px; margin-bottom: 4px; }
  .pos-empty > p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .quick-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
    text-align: left;
  }
  .quick-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
  }
  .quick-item:hover { border-color: var(--green-600); }
  .quick-item .q-name { font-size: 12.5px; font-weight: 600; min-height: 34px; }
  .quick-item .q-price { font-size: 13px; font-weight: 700; color: var(--green-700); margin-top: 6px; }
  .quick-item .q-stock { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Thanh dưới khu giỏ hàng */
  .cart-foot {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: #fff;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .cart-note {
    flex: 1; height: 34px;
    border: 1px dashed var(--border); border-radius: 8px;
    padding: 0 10px;
    font-size: 12.5px; outline: none; font-family: inherit;
  }
  .cart-note:focus { border-color: var(--green-600); border-style: solid; }
  .cart-count { font-size: 12.5px; color: var(--muted); }

  /* Panel phải: khách hàng + thanh toán */
  .pos-right {
    width: 384px; flex-shrink: 0;
    background: #fff;
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .pr-sec { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .pr-sec-title {
    font-size: 10.5px; font-weight: 800;
    letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .badge-count {
    display: inline-grid; place-items: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--green-100); color: var(--green-700);
    border-radius: 9px;
    font-size: 11px; font-weight: 700;
  }
  .sum-divider { border-top: 1px dashed var(--border); margin: 8px 0; }
  .pr-cust-wrap { position: relative; }
  .pr-cust-wrap .pos-drop { width: 100%; }
  .pr-input {
    width: 100%; height: 36px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0 12px 0 34px;
    font-size: 13px; outline: none; font-family: inherit;
    background: var(--bg);
  }
  .pr-input:focus { border-color: var(--green-600); background: #fff; }
  .pr-cust-wrap .s-ic { position: absolute; left: 10px; top: 18px; transform: translateY(-50%); color: var(--muted); }
  .cust-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--green-50);
    border: 1px solid var(--green-100);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .cust-chip .avatar { width: 30px; height: 30px; font-size: 12px; }
  .cust-chip .cc-name { font-size: 13px; font-weight: 700; }
  .cust-chip .cc-phone { font-size: 11.5px; color: var(--muted); }
  .cust-chip .x { margin-left: auto; }

  .sum-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0;
    font-size: 13.5px;
  }
  .sum-row .lbl { color: var(--muted); }
  .sum-row .lbl b { color: var(--text); }
  .sum-row.total .lbl { color: var(--text); font-weight: 700; }
  .sum-row.total .val { font-size: 22px; font-weight: 700; color: var(--green-700); letter-spacing: -.3px; }
  .sum-input {
    width: 140px; height: 32px;
    border: 1px solid var(--border); border-radius: 7px;
    text-align: right; padding: 0 10px;
    font-size: 13.5px; font-weight: 600; outline: none; font-family: inherit;
    background: var(--bg);
  }
  .sum-input:focus { border-color: var(--green-600); background: #fff; }
  .sum-input.paid { height: 38px; font-size: 15px; font-weight: 700; }
  .vat-select { margin-left: 6px; }
  .change-val { font-weight: 700; }
  .change-val.neg { color: var(--red-600); }

  .quick-cash { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .quick-cash button {
    border: 1px solid var(--border); border-radius: 20px;
    background: #fff; height: 30px; padding: 0 14px;
    font-size: 12.5px; font-weight: 600; color: var(--text);
  }
  .quick-cash button:hover { border-color: var(--green-600); color: var(--green-700); background: var(--green-50); }

  /* Nội dung riêng từng tab phương thức thanh toán */
  .info-box {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
  }
  .info-box .qr { flex-shrink: 0; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 5px; display: grid; }
  .info-box .card-ic { flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; background: var(--green-100); color: var(--green-700); display: grid; place-items: center; }
  .ib-rows { font-size: 12.5px; line-height: 1.7; min-width: 0; }
  .ib-rows b { font-weight: 700; }
  .ib-note { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .ref-input {
    width: 100%; height: 30px; margin-top: 6px;
    border: 1px solid var(--border); border-radius: 7px;
    padding: 0 10px;
    font-size: 12.5px; font-family: inherit; outline: none;
    background: #fff;
  }
  .ref-input:focus { border-color: var(--green-600); }

  .pay-foot { margin-top: auto; padding: 14px 16px; display: flex; gap: 10px; }
  .btn-print {
    width: 54px; height: 52px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--muted);
    display: grid; place-items: center;
  }
  .btn-print:hover { border-color: var(--green-600); color: var(--green-700); }
  .btn-pay {
    flex: 1; height: 52px;
    border: none; border-radius: 10px;
    background: var(--green-600); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: .3px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
  }
  .btn-pay:hover { background: var(--green-500); }
  .btn-pay .amt { font-size: 16px; }
  .btn-pay.center { justify-content: center; }

  /* ---------- Form tạo hàng hóa ---------- */
  /* Không dùng overflow:hidden vì sẽ cắt mất dropdown gợi ý bên trong */
  .pf-sec { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; }
  .pf-sec > .h {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; background: #FAFCFB;
    border-radius: 9px 9px 0 0;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .pf-sec:not(.open) > .h { border-radius: 9px; }
  .pf-sec > .h .cv { margin-left: auto; transition: transform .18s; opacity: .5; }
  .pf-sec.open > .h .cv { transform: rotate(180deg); }
  .pf-sec > .b { display: none; padding: 14px; }
  .pf-sec.open > .b { display: block; }
  .pf-sec .desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  /* Lưới trường nhập */
  .pf-grid { display: grid; gap: 12px 16px; }
  .pf-grid.c2 { grid-template-columns: 1fr 1fr; }
  .pf-grid.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .pf-f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .pf-f > .lb { display: flex; align-items: center; font-size: 12.5px; color: var(--muted); }
  .pf-f > .lb .req { color: var(--red-600); margin-left: 3px; }
  .pf-f > .lb .mk { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--green-700); cursor: pointer; }
  .pf-f > .lb .mk:hover { text-decoration: underline; }
  .pf-in {
    height: 36px; width: 100%;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0 10px; font-size: 13.5px; font-family: inherit; outline: none;
    background: #fff; color: var(--text);
  }
  .pf-in:focus { border-color: var(--green-600); }
  .pf-in.num { text-align: right; }
  .pf-in:disabled { background: var(--bg); color: var(--muted); }
  .pf-in.err { border-color: var(--red-600); background: var(--red-50); }
  .pf-hint { font-size: 11.5px; color: var(--red-600); }
  /* Khu ảnh */
  .pf-photos { display: flex; gap: 10px; }
  .pf-photo-main {
    flex: 1; min-height: 150px;
    border: 1px dashed var(--border); border-radius: 10px;
    background: var(--bg);
    display: grid; place-items: center; gap: 6px;
    cursor: pointer; text-align: center;
  }
  .pf-photo-main:hover { border-color: var(--green-600); background: var(--green-50); }
  .pf-photo-main .t { font-size: 13px; font-weight: 600; color: var(--green-700); }
  .pf-photo-main .s { font-size: 11px; color: var(--muted); }
  .pf-thumbs { display: flex; flex-direction: column; gap: 8px; }
  .pf-thumbs div {
    width: 42px; height: 42px;
    border: 1px dashed var(--border); border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
    cursor: pointer;
  }
  .pf-thumbs div:hover { border-color: var(--green-600); color: var(--green-700); }
  /* Thanh công cụ giả lập của ô mô tả */
  .pf-rte { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .pf-rte .tb { display: flex; gap: 2px; padding: 6px 8px; background: #FAFCFB; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .pf-rte .tb button {
    width: 28px; height: 26px; border: none; background: transparent;
    border-radius: 5px; color: var(--muted); font-size: 12.5px;
  }
  .pf-rte .tb button:hover { background: var(--bg); color: var(--text); }
  .pf-rte textarea { width: 100%; min-height: 130px; border: none; padding: 10px; font-size: 13.5px; font-family: inherit; outline: none; resize: vertical; }
  /* Dòng đơn vị quy đổi / thuộc tính / thành phần combo */
  .pf-row { display: grid; gap: 8px; align-items: end; margin-bottom: 8px; }
  .pf-add {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; background: none; padding: 4px 0;
    font-size: 13px; font-weight: 600; color: var(--green-700);
  }
  .pf-add:hover { text-decoration: underline; }
  .pf-empty-line { font-size: 12.5px; color: var(--muted); }

  /* ---------- Form phiếu kho (chuyển hàng / kiểm kho / xuất nội bộ / xuất hủy) ---------- */
  .df-left { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .df-tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--border); background: #FAFCFB; flex-shrink: 0; }
  .df-tabs button {
    border: none; background: none; padding: 10px 14px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .df-tabs button:hover { color: var(--text); }
  .df-tabs button.active { color: var(--green-700); border-bottom-color: var(--green-600); }
  .df-body { flex: 1; overflow: auto; }
  /* Bảng trong form phiếu: cột do colgroup quy định nên header và dòng luôn khớp */
  .df-tbl { table-layout: fixed; }
  .df-tbl td { vertical-align: middle; }
  .df-tbl td:nth-child(3) { white-space: normal; }
  .df-tbl .df-qty, .df-tbl .cell-input { width: 100%; }
  .df-right { width: 390px; flex-shrink: 0; background: #fff; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .df-field { display: flex; align-items: center; gap: 12px; padding: 9px 18px; }
  .df-field .lb { width: 150px; flex-shrink: 0; font-size: 13px; color: var(--muted); }
  .df-field .vl { flex: 1; font-size: 13.5px; font-weight: 600; text-align: right; }
  .df-field input.txt, .df-field select.sel {
    flex: 1; height: 34px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0 10px; font-size: 13px; font-family: inherit; outline: none;
    background: var(--bg);
  }
  .df-field input.txt:focus, .df-field select.sel:focus { border-color: var(--green-600); background: #fff; }
  .df-field .vl.big { font-size: 18px; font-weight: 700; color: var(--green-700); }
  .df-note { padding: 6px 18px 14px; }
  .df-note textarea {
    width: 100%; min-height: 84px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 13px; font-family: inherit; outline: none; resize: vertical;
  }
  .df-note textarea:focus { border-color: var(--green-600); }
  .df-recent { margin: 0 18px 14px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .df-recent .h { padding: 9px 12px; background: var(--green-50); font-size: 12.5px; font-weight: 700; color: var(--green-800); }
  .df-recent .r { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12.5px; display: flex; gap: 8px; }
  .df-recent .r .c { color: var(--green-700); font-weight: 600; }
  .df-recent .r .t { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .df-foot { margin-top: auto; padding: 14px 18px; display: flex; gap: 10px; }
  .df-foot button { flex: 1; height: 46px; border-radius: 10px; font-size: 14.5px; font-weight: 700; }
  .df-draft { border: 1px solid var(--border); background: #fff; color: var(--text); }
  .df-draft:hover { border-color: var(--green-600); color: var(--green-700); }
  .df-done { border: none; background: var(--green-600); color: #fff; }
  .df-done:hover { background: var(--green-500); }
  /* Ô nhập số lượng trong bảng của form */
  .df-qty {
    width: 76px; height: 30px; text-align: right;
    border: 1px solid var(--border); border-radius: 7px;
    padding: 0 8px; font-size: 13px; font-family: inherit; outline: none;
  }
  .df-qty:focus { border-color: var(--green-600); }
  .df-empty { padding: 60px 20px; text-align: center; }
  .df-empty h3 { font-size: 15px; margin-bottom: 6px; }
  .df-empty p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  /* ---------- Form trả hàng (dạng POS 2 khu: hàng trả + hàng đổi) ---------- */
  .rf-head { background: var(--green-950); }
  .rf-title { color: #fff; font-size: 14px; font-weight: 700; }
  .rf-left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* Khu hàng trả ở trên, khu hàng đổi ở dưới, chia bởi thanh tìm hàng đổi */
  .rf-sec { flex: 1; overflow-y: auto; background: #fff; min-height: 120px; }
  .rf-sec.ex { background: var(--bg); }
  .rf-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--green-800);
    flex-shrink: 0;
  }
  .rf-bar .lb { color: #CFE3D6; font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; white-space: nowrap; }
  .rf-bar input {
    flex: 1; max-width: 420px; height: 34px;
    border: none; border-radius: 8px; padding: 0 12px;
    font-size: 13.5px; font-family: inherit; outline: none;
  }
  .rf-secttl {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: #FAFCFB;
  }
  /* Dòng hàng trả: SL trả kèm mẫu số là SL đã mua */
  .rf-grid { display: grid; grid-template-columns: 30px 88px 1fr 74px 116px 118px 118px 34px; gap: 8px; align-items: center; }
  .qty-of { display: flex; flex-direction: column; align-items: flex-end; }
  .qty-of input {
    width: 62px; height: 28px; text-align: center;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  .qty-of input:focus { border-color: var(--green-600); }
  .qty-of .of { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .unit-badge {
    display: inline-block; padding: 2px 8px;
    background: var(--green-50); color: var(--green-700);
    border-radius: 5px; font-size: 11.5px; font-weight: 600;
  }
  .rf-empty { padding: 26px; text-align: center; color: var(--muted); font-size: 13px; }
  /* Panel phải của form trả hàng */
  .rf-right { width: 380px; flex-shrink: 0; background: #fff; border-left: 1px solid var(--border); display: flex; flex-direction: column; }

}

  document.querySelectorAll('.nav-group.child-active').forEach(g => g.classList.remove('child-active'));
  const activeSub = document.querySelector(`.nav-sub [data-page="${page}"].active`);
  if (activeSub) {
    const group = activeSub.closest('.nav-group');
    group.classList.add('open', 'child-active');
  }
}

function barChartSVG(data, labels) {
  const W = 960, H = 260, padL = 44, padR = 12, padT = 14, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = Math.max(...data.map(d => d[0] + d[1]));
  const step = Math.ceil(max / 4 / 10) * 10; // làm tròn mốc trục Y
  const yMax = step * 4;
  const n = data.length;
  const gap = Math.max(2, innerW / n * 0.35);
  const bw = (innerW - gap * n) / n;

  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Biểu đồ doanh thu">`;
  // Lưới + nhãn trục Y
  for (let i = 0; i <= 4; i++) {
    const y = padT + innerH - (innerH * i / 4);
    s += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    s += `<text class="axis-text" x="${padL - 6}" y="${y + 4}" text-anchor="end">${step * i} tr</text>`;
  }
  // Cột chồng 2 chi nhánh
  data.forEach((d, i) => {
    const x = padL + i * (bw + gap) + gap / 2;
    const h1 = innerH * d[0] / yMax;
    const h2 = innerH * d[1] / yMax;
    const y1 = padT + innerH - h1;
    const y2 = y1 - h2;
    const total = d[0] + d[1];
    s += `<g><title>${labels[i]}: ${total} tr (CN trung tâm ${d[0]} tr · CN 2 ${d[1]} tr)</title>`;
    s += `<rect class="bar" x="${x}" y="${y1}" width="${bw}" height="${h1}" rx="1.5"/>`;
    s += `<rect class="bar-b2" x="${x}" y="${y2}" width="${bw}" height="${h2}" rx="1.5"/></g>`;
    // Nhãn trục X (thưa bớt nếu quá nhiều cột)
    const every = n > 24 ? 2 : 1;
    if (i % every === 0) {
      s += `<text class="axis-text" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`;
    }
  });
  s += '</svg>';
  return s;
}

/* Bỏ dấu tiếng Việt để tìm kiếm không phân biệt dấu */
const unaccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const parseMoney = s => parseInt(String(s).replace(/\D/g, '') || '0', 10);

const POS = {
  orders: [],
  active: 0,
  tabSeq: 0,       // đánh số tab "Hóa đơn N"

function newOrder() {
  POS.tabSeq++;
  return { no: POS.tabSeq, items: [], customer: null, discount: 0, vat: 0, paid: 0, method: 'cash', refCode: '', note: '' };
}
function curOrder() {
  if (!POS.orders.length) { POS.orders = [newOrder()]; POS.active = 0; }
  return POS.orders[POS.active];
}
/* Giá dòng = (đơn giá − giảm giá dòng) × SL; VAT tính trên (tổng − giảm giá đơn) */
function lineTotal(it) { return (it.price - Math.min(it.disc || 0, it.price)) * it.qty; }
function orderTotal(o) {
  const sub = o.items.reduce((s, it) => s + lineTotal(it), 0);
  const afterDisc = Math.max(0, sub - o.discount);
  const vatAmt = Math.round(afterDisc * (o.vat || 0) / 100);
  const due = afterDisc + vatAmt;
  return { sub, vatAmt, due, change: o.paid - due };
}

  document.getElementById('content').innerHTML = renderPOS();

function posAdd(code) {
  const o = curOrder();
  const p = PRODUCTS.find(x => x.code === code);
  const it = o.items.find(x => x.code === code);
  if (it) it.qty++;
  else o.items.push({ code: p.code, name: p.name, unit: p.unit, price: p.price, disc: 0, qty: 1 });
  refreshPOS();
  document.getElementById('posSearch').focus();
}
function posPrice(code, val) {
  const it = curOrder().items.find(x => x.code === code);
  if (!it) return;
  it.price = parseMoney(val);
  refreshPOS();
}
function posLineDisc(code, val) {
  const it = curOrder().items.find(x => x.code === code);
  if (!it) return;
  it.disc = Math.min(parseMoney(val), it.price); // giảm giá dòng không vượt quá đơn giá
  refreshPOS();
}
function posQty(code, delta) {
  const o = curOrder();
  const it = o.items.find(x => x.code === code);
  if (!it) return;
  it.qty += delta;
  if (it.qty <= 0) o.items = o.items.filter(x => x.code !== code);
  refreshPOS();
}
function posQtyInput(code, val) {
  const o = curOrder();
  const it = o.items.find(x => x.code === code);
  if (!it) return;
  const q = parseMoney(val);
  if (q <= 0) o.items = o.items.filter(x => x.code !== code);
  else it.qty = q;
  refreshPOS();
}
function posRemove(code) {
  const o = curOrder();
  o.items = o.items.filter(x => x.code !== code);
  refreshPOS();
}

function posUpdateTotals() {

/* Gợi ý mệnh giá: đúng số tiền + làm tròn lên 100k/500k/1tr */
function cashSuggests(due) {
  const set = new Set([due]);
  [100000, 500000, 1000000].forEach(u => { const r = Math.ceil(due / u) * u; if (r > due) set.add(r); });
  return [...set].filter(v => v > 0).slice(0, 4);
}
function posMethod(m) {

/* Mã QR minh họa (không phải QR thật) — pattern ổn định theo seed */
function qrSVG(seed) {
  let h = 2166136261;
  String(seed).split('').forEach(c => { h = Math.imul(h ^ c.charCodeAt(0), 16777619); });
  const rand = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const n = 21, cell = 4;
  let rects = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inFinder = (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
    if (!inFinder && rand() > .5) rects += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`;
  }
  const f = (ox, oy) => `<path fill-rule="evenodd" d="M${ox} ${oy}h28v28h-28zM${ox + 4} ${oy + 4}h20v20h-20zM${ox + 8} ${oy + 8}h12v12h-12z"/>`;
  return `<svg width="86" height="86" viewBox="0 0 ${n * cell} ${n * cell}" fill="#0B2B1C">${rects}${f(0, 0)}${f((n - 7) * cell, 0)}${f(0, (n - 7) * cell)}</svg>`;
}

/* ---------- Thanh toán ---------- */
function posCheckout() {
  const o = curOrder();
  if (!o.items.length) { alert('Chưa có hàng hóa trong hóa đơn'); return; }
  const { vatAmt, due, change } = orderTotal(o);
  if (o.paid < due) { alert('Khách thanh toán chưa đủ số tiền cần trả'); return; }
  POS.invoiceSeq++;
  POS.receipt = {
    code: 'HD0' + POS.invoiceSeq,
    customer: o.customer ? o.customer.name : 'Khách lẻ',
    vatAmt, vat: o.vat, due, paid: o.paid, change,
    method: { cash: 'Tiền mặt', bank: 'Chuyển khoản', card: 'Thẻ' }[o.method],
  };
  refreshPOS();
}

  // Đơn đã thanh toán xong: thay tab hiện tại bằng hóa đơn trắng

/* Hóa đơn mẫu: lines = [mã hàng, SL, giảm giá/đv] */
function mkInv(code, time, custCode, customer, phone, seller, channel, lines, discount, vatPct, other, status, payMethod) {
  const items = lines.map(([c, qty, disc = 0]) => {
    const p = PRODUCTS.find(x => x.code === c);
    return { code: p.code, name: p.name, unit: p.unit, qty, price: p.price, disc };
  });
  const sub = items.reduce((s, it) => s + (it.price - it.disc) * it.qty, 0);
  const afterDisc = Math.max(0, sub - discount);
  const vatAmt = Math.round(afterDisc * vatPct / 100);
  const total = afterDisc + vatAmt + other;
  // Mốc thời gian dạng số (yyyymmddhhmm) để sắp xếp đúng — chuỗi dd/mm/yyyy so sánh sẽ sai
  const [dPart, tPart] = time.split(' ');
  const [dd, mm, yyyy] = dPart.split('/');
  const ts = +(yyyy + mm + dd + tPart.replace(':', ''));
  return {
    code, time, ts, custCode, customer, phone, seller, creator: seller, channel,
    branch: 'Chi nhánh trung tâm', priceList: 'Bảng giá chung', note: '',
    items, discount, vatPct, vatAmt, other, sub, total,
    paid: status === 'cancel' ? 0 : total, status, payMethod,
  };
}

/* Header cột có sắp xếp */
function thSort(label, field, cur, dir, fn, cls = '') {
  const on = cur === field;
  return `<th class="sortable ${on ? 'sorted' : ''} ${cls}" onclick="${fn}('${field}')">${label}<span class="sort-ar">${on ? (dir > 0 ? '▲' : '▼') : '⇅'}</span></th>`;
}

function pagiHTML(total, page, size, fnPage, fnSize) {
  const pages = Math.max(1, Math.ceil(total / size));
  const from = total ? (page - 1) * size + 1 : 0;
  const to = Math.min(page * size, total);
  // Rút gọn dải số trang khi nhiều trang
  let nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return `<div class="pagi">
    <span class="pg-info">Hiển thị <b>${from}–${to}</b> / ${fmt(total)} bản ghi</span>
    <select class="select" style="margin-right:8px" onchange="${fnSize}(this.value)">
      ${[10, 20, 50].map(n => `<option value="${n}" ${n === size ? 'selected' : ''}>${n} dòng</option>`).join('')}
    </select>
    <button ${page <= 1 ? 'disabled' : ''} onclick="${fnPage}(${page - 1})">‹</button>
    ${nums.map(n => n === '…' ? `<span style="padding:0 4px">…</span>`
      : `<button class="${n === page ? 'cur' : ''}" onclick="${fnPage}(${n})">${n}</button>`).join('')}
    <button ${page >= pages ? 'disabled' : ''} onclick="${fnPage}(${page + 1})">›</button>
  </div>`;
}

/* Tình trạng tồn kho của 1 sản phẩm */
function stockState(p) {
  if (p.type === 'Dịch vụ') return ['service', 'Dịch vụ', 'st-green'];
  if (p.stock <= 0) return ['out', 'Hết hàng', 'st-red'];
  if (p.stock < p.min) return ['low', 'Dưới định mức', 'st-amber'];
  if (p.stock > p.max) return ['over', 'Vượt định mức', 'st-amber'];
  return ['in', 'Còn hàng', 'st-green'];
}
/* So sánh chung cho sắp xếp */
function cmpBy(field, dir) {
  return (a, b) => {
    const x = a[field], y = b[field];
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y), 'vi') * dir;
  };
}

/* ============================================================
   FORM TẠO HÀNG HÓA (3 loại: hàng hóa · dịch vụ · combo)
   ============================================================ */
const PF_KINDS = { goods: 'Hàng hóa', service: 'Dịch vụ', combo: 'Combo - đóng gói' };
const PF = {
  open: false, kind: 'goods', tab: 'info', secs: new Set(['price', 'stock']),
  code: '', barcode: '', name: '', group: '', brand: '',
  cost: 0, vatIn: 8, price: 0, vatOut: 8,
  stock: 0, min: 0, max: 999999999,
  loc: '', weight: 0, weightUnit: 'g',
  unit: '', extraUnits: [], attrs: [], comboItems: [],
  commission: '', desc: '', noteTpl: '',
  scope: 'all', branches: new Set(['Chi nhánh trung tâm', 'Chi nhánh 2']),
  direct: true, errors: {},
};
function pfOpen(kind) {
  Object.assign(PF, {
    open: true, kind, tab: 'info', secs: new Set(['price', 'stock']),
    code: '', barcode: '', name: '', group: '', brand: '',
    cost: 0, vatIn: 8, price: 0, vatOut: kind === 'service' ? 0 : 8,
    stock: 0, min: 0, max: 999999999, loc: '', weight: 0, weightUnit: 'g',
    unit: '', extraUnits: [], attrs: [], comboItems: [],
    commission: '', desc: '', noteTpl: '',
    scope: 'all', branches: new Set(['Chi nhánh trung tâm', 'Chi nhánh 2']),
    direct: true, errors: {},
  });
  listRefresh();
}
function pfClose() { PF.open = false; listRefresh(); }
function pfSet(f, v) { PF[f] = v; delete PF.errors[f]; listRefresh(); }
function pfNum(f, v) { PF[f] = parseMoney(v); listRefresh(); }
function pfTab(t) { PF.tab = t; listRefresh(); }
function pfSec(k) { PF.secs.has(k) ? PF.secs.delete(k) : PF.secs.add(k); listRefresh(); }
function pfBranch(b) { PF.branches.has(b) ? PF.branches.delete(b) : PF.branches.add(b); listRefresh(); }
/* Đơn vị quy đổi */
function pfAddUnit() { PF.extraUnits.push({ name: '', ratio: 1, price: 0 }); listRefresh(); }
function pfUnit(i, f, v) { PF.extraUnits[i][f] = f === 'name' ? v : parseMoney(v); listRefresh(); }
function pfDelUnit(i) { PF.extraUnits.splice(i, 1); listRefresh(); }
/* Thuộc tính */
function pfAddAttr() { PF.attrs.push({ name: '', value: '' }); listRefresh(); }
function pfAttr(i, f, v) { PF.attrs[i][f] = v; listRefresh(); }
function pfDelAttr(i) { PF.attrs.splice(i, 1); listRefresh(); }
/* Thành phần combo */
function pfAddCombo(code) {
  const ex = PF.comboItems.find(c => c.code === code);
  if (ex) ex.qty++; else PF.comboItems.push({ code, qty: 1 });
  listRefresh();
}
function pfComboQty(code, v) {
  const c = PF.comboItems.find(x => x.code === code);
  if (!c) return;
  const q = parseMoney(v);
  if (q <= 0) PF.comboItems = PF.comboItems.filter(x => x.code !== code); else c.qty = q;
  listRefresh();
}
function pfComboSearch(val) {
  const drop = document.getElementById('pfComboDrop');
  const q = unaccent(val.trim());
  if (!q) { drop.classList.remove('show'); return; }
  const hits = PRODUCTS.filter(p => p.type !== 'Dịch vụ' && (unaccent(p.name).includes(q) || unaccent(p.code).includes(q))).slice(0, 8);
  drop.innerHTML = hits.length
    ? hits.map(p => `<div class="pos-drop-item" onmousedown="pfAddCombo('${p.code}')">
        <div><div class="p-name">${p.name}</div><div class="p-meta">${p.code} · Tồn: ${p.stock} ${p.unit}</div></div>
        <div class="p-price">${fmt(p.price)}</div></div>`).join('')
    : '<div class="pos-drop-empty">Không tìm thấy hàng hóa</div>';
  drop.classList.add('show');
}
/* Giá bán sau thuế suy ra từ giá trước thuế + VAT */
const pfAfterTax = () => Math.round(PF.price * (1 + PF.vatOut / 100));
/* Giá vốn combo = tổng giá vốn thành phần */
const pfComboCost = () => PF.comboItems.reduce((s, c) => {
  const p = PRODUCTS.find(x => x.code === c.code);
  return s + (p ? p.cost : 0) * c.qty;
}, 0);

function pfSave(again) {
  const err = {};
  if (!PF.name.trim()) err.name = 'Tên hàng là bắt buộc';
  if (!PF.group) err.group = 'Nhóm hàng là bắt buộc';
  if (PF.kind === 'combo' && !PF.comboItems.length) err.combo = 'Combo phải có ít nhất 1 hàng thành phần';
  if (PRODUCTS.some(p => p.code === PF.code.trim())) err.code = 'Mã hàng đã tồn tại';
  if (Object.keys(err).length) { PF.errors = err; PF.tab = 'info'; listRefresh(); return; }

  // Mã hàng tự sinh nếu để trống
  const nums = PRODUCTS.map(p => +p.code.replace(/\D/g, '')).filter(n => !isNaN(n));
  const code = PF.code.trim() || 'SP' + String(Math.max(0, ...nums) + 1).padStart(4, '0');
  const isService = PF.kind === 'service';
  const cost = PF.kind === 'combo' ? pfComboCost() : PF.cost;

  const rec = {
    code, barcode: PF.barcode.trim() || '—', name: PF.name.trim(),
    unit: PF.unit.trim() || 'Cái', group: PF.group,
    type: PF_KINDS[PF.kind] === 'Combo - đóng gói' ? 'Combo' : PF_KINDS[PF.kind],
    brand: PF.brand || '—', loc: PF.loc || '—',
    price: PF.price, vat: PF.vatOut, cost,
    stock: isService ? 0 : PF.stock, min: isService ? 0 : PF.min, max: isService ? 0 : PF.max,
    created: dmy(TODAY), status: 'active',
  };
  PRODUCTS.unshift(rec);
  // Bảng giá nào cũng cần có giá cho hàng mới
  PRICEBOOKS.forEach((b, i) => {
    PB_PRICES[b][code] = i === 0 ? rec.price : Math.round(rec.price * (i === 1 ? 0.93 : 0.88) / 1000) * 1000;
  });

  if (again) {
    const keepGroup = PF.group, keepBrand = PF.brand, kind = PF.kind;
    pfOpen(kind);
    PF.group = keepGroup; PF.brand = keepBrand;
    listRefresh();
    alert(`Đã lưu "${rec.name}" (${code}). Form đã sẵn sàng cho hàng tiếp theo.`);
  } else {
    PF.open = false;
    LIST.pq = ''; LIST.ppage = 1; LIST.pstatus = 'active';
    listRefresh();
    alert(`Đã tạo ${PF_KINDS[PF.kind].toLowerCase()} "${rec.name}" với mã ${code}`);
  }
}
