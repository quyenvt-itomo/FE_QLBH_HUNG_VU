/* ---------- Modal chi tiết hàng hóa ---------- */
function productModal(code) {
  const p = PRODUCTS.find(x => x.code === code);
  if (!p) return '';
  const [, stLbl, stCls] = stockState(p);

  const tabInfo = `
    <div class="detail-grid">
      <div class="dg-item"><div class="dg-l">Mã hàng</div><div class="dg-v">${p.code}</div></div>
      <div class="dg-item"><div class="dg-l">Mã vạch</div><div class="dg-v">${p.barcode}</div></div>
      <div class="dg-item"><div class="dg-l">Nhóm hàng</div><div class="dg-v">${p.group}</div></div>
      <div class="dg-item"><div class="dg-l">Loại hàng</div><div class="dg-v">${p.type}</div></div>
      <div class="dg-item"><div class="dg-l">Tồn kho</div><div class="dg-v">${p.type === 'Dịch vụ' ? '—' : p.stock + ' ' + p.unit}</div></div>
      <div class="dg-item"><div class="dg-l">Định mức tồn</div><div class="dg-v">${fmt(p.min)} - ${fmt(p.max)}</div></div>
      <div class="dg-item"><div class="dg-l">Giá vốn</div><div class="dg-v">${fmt(p.cost)}</div></div>
      <div class="dg-item"><div class="dg-l">Giá bán trước thuế</div><div class="dg-v">${fmt(p.price)}</div></div>
      <div class="dg-item"><div class="dg-l">VAT hàng bán</div><div class="dg-v">${p.vat}%</div></div>
      <div class="dg-item"><div class="dg-l">Giá bán sau thuế</div><div class="dg-v">${fmt(priceAfterTax(p))}</div></div>
      <div class="dg-item"><div class="dg-l">Thương hiệu</div><div class="dg-v">${p.brand}</div></div>
      <div class="dg-item"><div class="dg-l">Vị trí</div><div class="dg-v">${p.loc}</div></div>
      <div class="dg-item"><div class="dg-l">Thời gian tạo</div><div class="dg-v">${p.created}</div></div>
      <div class="dg-item"><div class="dg-l">Lợi nhuận gộp/đv</div><div class="dg-v" style="color:var(--green-700)">${fmt(p.price - p.cost)}</div></div>
      <div class="dg-item"><div class="dg-l">Giá trị tồn (vốn)</div><div class="dg-v">${fmt(p.cost * p.stock)}</div></div>
      <div class="dg-item"><div class="dg-l">Trạng thái</div><div class="dg-v"><span class="st ${stCls}">${stLbl}</span></div></div>
    </div>`;

  const tabStock = `<div class="mini-tbl"><table class="tbl">
      <thead><tr><th>Chứng từ</th><th>Thời gian</th><th>Loại</th><th class="num-r">Số lượng</th><th class="num-r">Tồn cuối</th></tr></thead>
      <tbody>${(() => {
        // Thẻ kho suy ra từ các hóa đơn có chứa mặt hàng này
        const moves = INVOICES.filter(iv => iv.status !== 'cancel' && iv.items.some(it => it.code === p.code))
          .sort((a, b) => b.ts - a.ts)
          .map(iv => ({ code: iv.code, time: iv.time, qty: -iv.items.find(it => it.code === p.code).qty }));
        let run = p.stock;
        const rows = moves.map(m => { const after = run; run = run - m.qty; return { ...m, after }; });
        return rows.length ? rows.map(m => `<tr>
          <td class="td-code">${m.code}</td><td class="td-muted">${m.time}</td>
          <td>Bán hàng</td><td class="num-r" style="color:var(--red-600)">${m.qty}</td>
          <td class="num-r"><b>${m.after}</b></td></tr>`).join('')
          : `<tr><td colspan="5" style="text-align:center;padding:22px;color:var(--muted)">Chưa có giao dịch kho</td></tr>`;
      })()}</tbody>
    </table></div>`;

  const b2 = Math.floor(p.stock / 3);
  const tabBranch = `<div class="mini-tbl"><table class="tbl">
      <thead><tr><th>Chi nhánh</th><th class="num-r">Tồn kho</th><th class="num-r">Định mức</th><th>Trạng thái</th></tr></thead>
      <tbody>
        <tr><td>Chi nhánh trung tâm</td><td class="num-r"><b>${p.stock}</b></td><td class="num-r td-muted">${p.min} - ${p.max}</td><td><span class="st ${stCls}">${stLbl}</span></td></tr>
        <tr><td>Chi nhánh 2</td><td class="num-r"><b>${b2}</b></td><td class="num-r td-muted">${p.min} - ${p.max}</td><td><span class="st ${b2 < p.min ? 'st-amber' : 'st-green'}">${b2 < p.min ? 'Dưới định mức' : 'Còn hàng'}</span></td></tr>
      </tbody>
    </table></div>`;

  return `<div class="modal-ov" onclick="if(event.target===this) plClose()">
    <div class="modal-box">
      <div class="modal-head">
        <div class="thumb-lg">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        </div>
        <div>
          <h3>${p.name}</h3>
          <div class="m-sub" style="margin-bottom:6px">${p.code} · ${p.barcode} · ĐVT: ${p.unit}</div>
          <span class="tag g">${p.type}</span><span class="tag">Bán trực tiếp</span><span class="tag">${p.status === 'active' ? 'Đang kinh doanh' : 'Ngừng kinh doanh'}</span>
        </div>
        <div class="m-right">Giá trị tồn (vốn)<div style="font-size:17px;font-weight:700;color:var(--text)">${fmt(p.cost * p.stock)}</div></div>
        <button class="modal-x" onclick="plClose()" title="Đóng (Esc)">×</button>
      </div>
      <div class="dtabs">
        ${[['info', 'Thông tin'], ['stock', 'Thẻ kho'], ['branch', 'Tồn theo chi nhánh']].map(([t, lbl]) =>
          `<button class="${LIST.ptab === t ? 'active' : ''}" onclick="plTab('${t}', event)">${lbl}</button>`).join('')}
      </div>
      <div class="modal-body">
        ${LIST.ptab === 'info' ? tabInfo : LIST.ptab === 'stock' ? tabStock : tabBranch}
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" onclick="alert('Form cập nhật hàng hóa sẽ thiết kế sau')">✎ Chỉnh sửa</button>
        <button class="btn" onclick="alert('Demo: sao chép hàng hóa')">Sao chép</button>
        <button class="btn" onclick="alert('Chức năng in tem mã sẽ nối máy in sau')">In tem mã</button>
        <button class="btn" onclick="alert('Demo: ngừng kinh doanh')">Ngừng kinh doanh</button>
        <button class="btn" style="color:var(--red-600)" onclick="alert('Demo: xóa hàng hóa')">Xóa</button>
        <button class="btn" style="margin-left:auto" onclick="plClose()">Đóng</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Trang: Danh sách hàng hóa ---------- */
function renderProductsList() {
  const groups = [...new Set(PRODUCTS.map(p => p.group))];
  const brands = [...new Set(PRODUCTS.map(p => p.brand))].filter(b => b !== '—');
  const locs   = [...new Set(PRODUCTS.map(p => p.loc))].filter(l => l !== '—');
  const types  = [...new Set(PRODUCTS.map(p => p.type))];
  const vats   = [...new Set(PRODUCTS.map(p => p.vat))].sort((a, b) => a - b);
  const q = unaccent(LIST.pq.trim());

  const all = PRODUCTS.filter(p => {
    if (q && !unaccent(p.name).includes(q) && !unaccent(p.code).includes(q) && !p.barcode.includes(q)) return false;
    if (LIST.pgroup !== 'all' && p.group !== LIST.pgroup) return false;
    if (LIST.ptype !== 'all' && p.type !== LIST.ptype) return false;
    if (LIST.pbrand !== 'all' && p.brand !== LIST.pbrand) return false;
    if (LIST.ploc !== 'all' && p.loc !== LIST.ploc) return false;
    if (LIST.pstock !== 'all' && stockState(p)[0] !== LIST.pstock) return false;
    if (LIST.pvat !== 'all' && p.vat !== +LIST.pvat) return false;
    if (LIST.pstatus !== 'all' && p.status !== LIST.pstatus) return false;
    const lo = parseMoney(LIST.pmin), hi = parseMoney(LIST.pmax);
    if (LIST.pmin && p.price < lo) return false;
    if (LIST.pmax && p.price > hi) return false;
    return true;
  }).sort(cmpBy(LIST.psort, LIST.pdir));

  const pageRows = all.slice((LIST.ppage - 1) * LIST.psize, LIST.ppage * LIST.psize);
  const pageCodes = pageRows.map(p => p.code);
  const allChecked = pageCodes.length && pageCodes.every(c => LIST.psel.has(c));
  const stockValue = all.reduce((s, p) => s + p.cost * p.stock, 0);
  const sellValue  = all.reduce((s, p) => s + p.price * p.stock, 0);

  const bodyRows = pageRows.map(p => {
    const [, stLbl, stCls] = stockState(p);
    const open = LIST.popen === p.code;
    const checked = LIST.psel.has(p.code);
    const initials = p.name.replace(/[^A-Za-zÀ-ỹ0-9 ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    return `
    <tr class="rowm ${open ? 'open' : ''}" onclick="plOpen('${p.code}')">
      <td class="chk"><input type="checkbox" ${checked ? 'checked' : ''} onclick="plSel('${p.code}', event)"></td>
      <td class="td-code">${p.code}</td>
      <td><div class="cell-name">
        <div class="thumb">${initials}</div>
        <div><div>${p.name}</div><div class="td-muted">${p.barcode} · ĐVT: ${p.unit}</div></div>
      </div></td>
      <td class="td-muted td-nowrap">${p.group}</td>
      <td class="num-r">${fmt(p.price)}</td>
      <td class="num-r td-muted">${p.vat}%</td>
      <td class="num-r"><b>${fmt(priceAfterTax(p))}</b></td>
      <td class="num-r td-muted">${fmt(p.cost)}</td>
      <td class="num-r">${p.type === 'Dịch vụ' ? '—' : p.stock}</td>
      <td class="num-r td-muted">${p.type === 'Dịch vụ' ? '—' : p.min + ' - ' + p.max}</td>
      <td class="td-muted td-nowrap">${p.brand}</td>
      <td class="td-muted td-nowrap">${p.loc}</td>
      <td><span class="st ${stCls}">${stLbl}</span></td>
    </tr>
    `;
  }).join('');

  const selCount = LIST.psel.size;

  return `
  <div class="breadcrumb">Trang chủ / Hàng hóa / <b>Danh sách hàng hóa</b></div>
  <div class="list-page">
    <!-- ===== Bộ lọc ===== -->
    <div class="card">
      <div class="filter-card-head">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Bộ lọc
        <button class="reset" onclick="plReset()">Đặt lại</button>
      </div>
      <div class="f-sec">
        <div class="f-title">Tìm kiếm</div>
        <input class="f-input" id="plSearch" placeholder="Mã, tên hàng, mã vạch…"
               value="${LIST.pq}" oninput="plSet('pq', this.value, 'plSearch')">
      </div>
      <div class="f-sec">
        <div class="f-title">Nhóm hàng</div>
        <select class="f-input" onchange="plSet('pgroup', this.value)">
          <option value="all">Tất cả nhóm hàng (${PRODUCTS.length})</option>
          ${groups.map(g => `<option value="${g}" ${LIST.pgroup === g ? 'selected' : ''}>${g} (${PRODUCTS.filter(p => p.group === g).length})</option>`).join('')}
        </select>
      </div>
      <div class="f-sec">
        <div class="f-title">Loại hàng</div>
        <select class="f-input" onchange="plSet('ptype', this.value)">
          <option value="all">Tất cả</option>
          ${types.map(t => `<option value="${t}" ${LIST.ptype === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="f-sec">
        <div class="f-title">Tồn kho</div>
        ${[['all', 'Tất cả'], ['in', 'Còn hàng'], ['low', 'Dưới định mức'], ['over', 'Vượt định mức'], ['out', 'Hết hàng']].map(([v, lbl]) => {
          const n = v === 'all' ? PRODUCTS.length : PRODUCTS.filter(p => stockState(p)[0] === v).length;
          return `<label class="f-opt"><input type="radio" name="fs" ${LIST.pstock === v ? 'checked' : ''} onchange="plSet('pstock', '${v}')"> ${lbl} <span class="cnt">${n}</span></label>`;
        }).join('')}
      </div>
      <div class="f-sec">
        <div class="f-title">Khoảng giá bán (trước thuế)</div>
        <div class="f-range">
          <input class="f-input" placeholder="Từ" value="${LIST.pmin}" onchange="plSet('pmin', this.value)">
          <span>—</span>
          <input class="f-input" placeholder="Đến" value="${LIST.pmax}" onchange="plSet('pmax', this.value)">
        </div>
      </div>
      <div class="f-sec">
        <div class="f-title">VAT hàng bán</div>
        <select class="f-input" onchange="plSet('pvat', this.value)">
          <option value="all">Tất cả thuế suất</option>
          ${vats.map(v => `<option value="${v}" ${LIST.pvat === String(v) ? 'selected' : ''}>${v}%</option>`).join('')}
        </select>
      </div>
      <div class="f-sec">
        <div class="f-title">Thương hiệu</div>
        <select class="f-input" onchange="plSet('pbrand', this.value)">
          <option value="all">Tất cả thương hiệu</option>
          ${brands.map(b => `<option value="${b}" ${LIST.pbrand === b ? 'selected' : ''}>${b}</option>`).join('')}
        </select>
      </div>
      <div class="f-sec">
        <div class="f-title">Vị trí</div>
        <select class="f-input" onchange="plSet('ploc', this.value)">
          <option value="all">Tất cả vị trí</option>
          ${locs.map(l => `<option value="${l}" ${LIST.ploc === l ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="f-sec">
        <div class="f-title">Trạng thái</div>
        ${[['active', 'Đang kinh doanh'], ['inactive', 'Ngừng kinh doanh'], ['all', 'Tất cả']].map(([v, lbl]) =>
          `<label class="f-opt"><input type="radio" name="fst" ${LIST.pstatus === v ? 'checked' : ''} onchange="plSet('pstatus', '${v}')"> ${lbl}</label>`).join('')}
      </div>
    </div>

    <!-- ===== Bảng ===== -->
    <div>
      <div class="toolbar">
        <div class="page-h1">Hàng hóa <span class="badge-count">${all.length}</span></div>
        <div class="spacer"></div>
        <button class="btn" onclick="alert('Demo: nhập file Excel')">⭳ Nhập file</button>
        <button class="btn" onclick="alert('Demo: xuất file Excel')">⭱ Xuất file</button>
        <div class="new-menu-wrap" style="position:relative">
          <button class="btn btn-primary" onclick="event.stopPropagation(); LIST.newMenu = !LIST.newMenu; listRefresh()">+ Tạo mới ▾</button>
          ${LIST.newMenu ? `<div class="pos-drop show" style="right:0; left:auto; width:210px">
            ${Object.entries(PF_KINDS).map(([k, lbl]) =>
              `<div class="pos-drop-item" onclick="event.stopPropagation(); LIST.newMenu=false; pfOpen('${k}')"><div class="p-name">${lbl}</div></div>`).join('')}
          </div>` : ''}
        </div>
      </div>
      <div class="card">
        ${selCount ? `<div class="bulk-bar">
          Đã chọn <b>${selCount}</b> hàng hóa
          <button class="btn" onclick="alert('Demo: cập nhật giá hàng loạt')">Cập nhật giá</button>
          <button class="btn" onclick="alert('Demo: in tem mã hàng loạt')">In tem mã</button>
          <button class="btn" style="color:var(--red-600)" onclick="alert('Demo: xóa hàng loạt')">Xóa</button>
          <button class="clear-sel" onclick="plClearSel()">Bỏ chọn</button>
        </div>` : ''}
        <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr>
            <th class="chk"><input type="checkbox" ${allChecked ? 'checked' : ''} onclick="plSelAll(${JSON.stringify(pageCodes).replace(/"/g, '&quot;')}, this.checked)"></th>
            ${thSort('Mã hàng', 'code', LIST.psort, LIST.pdir, 'plSort')}
            ${thSort('Tên hàng', 'name', LIST.psort, LIST.pdir, 'plSort')}
            ${thSort('Nhóm hàng', 'group', LIST.psort, LIST.pdir, 'plSort')}
            ${thSort('Giá bán trước thuế', 'price', LIST.psort, LIST.pdir, 'plSort', 'num-r')}
            <th class="num-r">VAT (%)</th>
            <th class="num-r">Giá bán sau thuế</th>
            ${thSort('Giá vốn', 'cost', LIST.psort, LIST.pdir, 'plSort', 'num-r')}
            ${thSort('Tồn kho', 'stock', LIST.psort, LIST.pdir, 'plSort', 'num-r')}
            <th class="num-r">Định mức tồn</th>
            <th>Thương hiệu</th><th>Vị trí</th><th>Trạng thái</th>
          </tr></thead>
          <tbody>
            ${all.length ? `<tr class="sum-line">
              <td colspan="4">Tổng cộng theo bộ lọc</td>
              <td class="num-r">${fmt(sellValue)}</td><td></td><td></td>
              <td class="num-r">${fmt(stockValue)}</td>
              <td class="num-r">${fmt(all.reduce((s, p) => s + p.stock, 0))}</td>
              <td colspan="4"></td>
            </tr>` : ''}
            ${bodyRows || `<tr><td colspan="13" style="text-align:center; padding:34px; color:var(--muted)">Không có hàng hóa phù hợp bộ lọc</td></tr>`}
          </tbody>
        </table>
        </div>
        ${pagiHTML(all.length, LIST.ppage, LIST.psize, 'plPage', 'plSize')}
      </div>
      <div class="td-muted" style="margin-top:10px">
        Giá trị tồn theo giá vốn: <b style="color:var(--text)">${fmt(stockValue)}</b> ·
        theo giá bán: <b style="color:var(--text)">${fmt(sellValue)}</b>
      </div>
    </div>
  </div>
  ${LIST.popen ? productModal(LIST.popen) : ''}
  ${PF.open ? productFormModal() : ''}`;
}

/* ---------- Modal chi tiết hóa đơn ---------- */
function invoiceModal(code) {
  const iv = INVOICES.find(x => x.code === code);
  if (!iv) return '';
  const [stLbl, stCls] = iv.status === 'cancel' ? ['Đã hủy', 'st-red'] : ['Hoàn thành', 'st-green'];
  const debt = iv.total - iv.paid;

  const tabInfo = `
    <div class="detail-grid" style="grid-template-columns:repeat(5,1fr)">
      <div class="dg-item"><div class="dg-l">Người tạo</div><div class="dg-v">${iv.creator}</div></div>
      <div class="dg-item"><div class="dg-l">Người bán</div><div class="dg-v">${iv.seller}</div></div>
      <div class="dg-item"><div class="dg-l">Kênh bán</div><div class="dg-v">${iv.channel}</div></div>
      <div class="dg-item"><div class="dg-l">Bảng giá</div><div class="dg-v">${iv.priceList}</div></div>
      <div class="dg-item"><div class="dg-l">Phương thức</div><div class="dg-v">${iv.payMethod}</div></div>
    </div>
    <div class="mini-tbl"><table class="tbl">
      <thead><tr>
        <th>Mã hàng</th><th>Tên hàng</th><th class="num-r">Số lượng</th>
        <th class="num-r">Đơn giá</th><th class="num-r">Giảm giá</th>
        <th class="num-r">Giá bán</th><th class="num-r">Thành tiền</th>
      </tr></thead>
      <tbody>${iv.items.map(it => `<tr>
        <td class="td-code">${it.code}</td>
        <td>${it.name}<div class="td-muted">ĐVT: ${it.unit}</div></td>
        <td class="num-r">${it.qty}</td>
        <td class="num-r">${fmt(it.price)}</td>
        <td class="num-r ${it.disc ? '' : 'td-muted'}">${it.disc ? fmt(it.disc) : '—'}</td>
        <td class="num-r">${fmt(it.price - it.disc)}</td>
        <td class="num-r"><b>${fmt((it.price - it.disc) * it.qty)}</b></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="inv-foot">
      <textarea class="inv-note" placeholder="Ghi chú hóa đơn…">${iv.note}</textarea>
      <div class="inv-sum">
        <div class="sum-row"><span class="lbl">Tổng tiền hàng (${iv.items.length})</span><b>${fmt(iv.sub)}</b></div>
        <div class="sum-row"><span class="lbl">Giảm giá hóa đơn</span><b>${fmt(iv.discount)}</b></div>
        <div class="sum-row"><span class="lbl">VAT (${iv.vatPct}%)</span><b>${fmt(iv.vatAmt)}</b></div>
        ${iv.other ? `<div class="sum-row"><span class="lbl">Thu khác</span><b>${fmt(iv.other)}</b></div>` : ''}
        <div class="sum-row big"><span class="lbl">Khách cần trả</span><b>${fmt(iv.total)}</b></div>
        <div class="sum-row"><span class="lbl">Khách đã trả</span><b>${fmt(iv.paid)}</b></div>
        ${debt > 0 ? `<div class="sum-row"><span class="lbl">Còn nợ</span><b style="color:var(--red-600)">${fmt(debt)}</b></div>` : ''}
      </div>
    </div>`;

  const tabPay = `<div class="mini-tbl"><table class="tbl">
      <thead><tr><th>Mã phiếu</th><th>Thời gian</th><th>Phương thức</th><th class="num-r">Số tiền</th><th>Trạng thái</th></tr></thead>
      <tbody>${iv.status === 'cancel'

/* ---------- Trang: Danh sách hóa đơn ---------- */
function renderInvoices() {
  const sellers = [...new Set(INVOICES.map(iv => iv.seller))];
  const pays    = [...new Set(INVOICES.map(iv => iv.payMethod))];
  const vats    = [...new Set(INVOICES.map(iv => iv.vatPct))].sort((a, b) => a - b);
  const q = unaccent(LIST.iq.trim());
  /* Lọc theo mốc thời gian dựa trên ngày trong chuỗi dd/mm/yyyy */
  const dayOf = s => +s.slice(0, 2);
  const TODAY = 4; // dữ liệu mẫu: hôm nay 04/08/2026

  const all = INVOICES.filter(iv => {
    if (q && !unaccent(iv.code).includes(q) && !unaccent(iv.customer).includes(q)
        && !unaccent(iv.custCode).includes(q) && !iv.phone.replace(/\s/g, '').includes(q)) return false;
    if (LIST.istatus !== 'all' && iv.status !== LIST.istatus) return false;
    if (LIST.iseller !== 'all' && iv.seller !== LIST.iseller) return false;
    if (LIST.ipay !== 'all' && iv.payMethod !== LIST.ipay) return false;
    if (LIST.ivat !== 'all' && iv.vatPct !== +LIST.ivat) return false;
    if (LIST.itime === 'today' && !(iv.time.includes('/08/') && dayOf(iv.time) === TODAY)) return false;
    if (LIST.itime === 'month' && !iv.time.includes('/08/')) return false;
    const lo = parseMoney(LIST.imin), hi = parseMoney(LIST.imax);
    if (LIST.imin && iv.total < lo) return false;
    if (LIST.imax && iv.total > hi) return false;
    return true;
  }).sort(cmpBy(LIST.isort === 'time' ? 'ts' : LIST.isort, LIST.idir));

  const pageRows = all.slice((LIST.ipage - 1) * LIST.isize, LIST.ipage * LIST.isize);
  const pageCodes = pageRows.map(iv => iv.code);
  const allChecked = pageCodes.length && pageCodes.every(c => LIST.isel.has(c));
  const valid = all.filter(iv => iv.status !== 'cancel');
  const sumSub = valid.reduce((s, iv) => s + iv.sub, 0);
  const sumDisc = valid.reduce((s, iv) => s + iv.discount, 0);
  const sumVat = valid.reduce((s, iv) => s + iv.vatAmt, 0);
  const sumTotal = valid.reduce((s, iv) => s + iv.total, 0);
  const sumPaid = valid.reduce((s, iv) => s + iv.paid, 0);

  const stMap = { done: ['Hoàn thành', 'st-green'], cancel: ['Đã hủy', 'st-red'] };

  const bodyRows = pageRows.map(iv => {
    const [stLbl, stCls] = stMap[iv.status];
    const open = LIST.iopen === iv.code;
    const checked = LIST.isel.has(iv.code);
    return `
    <tr class="rowm ${open ? 'open' : ''}" onclick="invOpen('${iv.code}')">
      <td class="chk"><input type="checkbox" ${checked ? 'checked' : ''} onclick="invSel('${iv.code}', event)"></td>
      <td class="td-code">${iv.code}</td>
      <td class="td-muted td-nowrap">${iv.time}</td>
      <td class="td-muted">${iv.custCode}</td>
      <td>${iv.customer}</td>
      <td class="td-muted td-nowrap">${iv.phone}</td>
      <td class="td-muted">${iv.seller}</td>
      <td class="num-r">${fmt(iv.sub)}</td>
      <td class="num-r ${iv.discount ? '' : 'td-muted'}">${iv.discount ? fmt(iv.discount) : '—'}</td>
      <td class="num-r td-muted">${iv.vatAmt ? fmt(iv.vatAmt) : '—'}</td>
      <td class="num-r"><b>${fmt(iv.total)}</b></td>
      <td class="num-r td-muted">${fmt(iv.paid)}</td>
      <td class="td-muted td-nowrap">${iv.payMethod}</td>
      <td><span class="st ${stCls}">${stLbl}</span></td>
    </tr>
    `;
  }).join('');

  const selCount = LIST.isel.size;

  return `
  <div class="breadcrumb">Trang chủ / Đơn hàng / <b>Hóa đơn</b></div>
  <div class="list-page">
    <!-- ===== Bộ lọc ===== -->
    <div class="card">
      <div class="filter-card-head">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Bộ lọc
        <button class="reset" onclick="invReset()">Đặt lại</button>
      </div>
      <div class="f-sec">
        <div class="f-title">Tìm kiếm</div>
        <input class="f-input" id="invSearch" placeholder="Mã HĐ, khách hàng, SĐT…"
               value="${LIST.iq}" oninput="invSet('iq', this.value, 'invSearch')">
      </div>
      <div class="f-sec">
        <div class="f-title">Chi nhánh</div>
        <select class="f-input"><option>Chi nhánh trung tâm</option><option>Chi nhánh 2</option><option>Tất cả chi nhánh</option></select>
      </div>
      <div class="f-sec">
        <div class="f-title">Thời gian</div>
        ${[['all', 'Toàn thời gian'], ['month', 'Tháng này'], ['today', 'Hôm nay']].map(([v, lbl]) =>
          `<label class="f-opt"><input type="radio" name="ft" ${LIST.itime === v ? 'checked' : ''} onchange="invSet('itime', '${v}')"> ${lbl}</label>`).join('')}
      </div>
      <div class="f-sec">
        <div class="f-title">Trạng thái</div>
        ${[['all', 'Tất cả'], ['done', 'Hoàn thành'], ['cancel', 'Đã hủy']].map(([v, lbl]) => {
          const n = v === 'all' ? INVOICES.length : INVOICES.filter(x => x.status === v).length;
          return `<label class="f-opt"><input type="radio" name="fi" ${LIST.istatus === v ? 'checked' : ''} onchange="invSet('istatus', '${v}')"> ${lbl} <span class="cnt">${n}</span></label>`;
        }).join('')}
      </div>
      <div class="f-sec">
        <div class="f-title">Người bán</div>
        <select class="f-input" onchange="invSet('iseller', this.value)">
          <option value="all">Tất cả nhân viên</option>
          ${sellers.map(s => `<option value="${s}" ${LIST.iseller === s ? 'selected' : ''}>${s} (${INVOICES.filter(iv => iv.seller === s).length})</option>`).join('')}
        </select>
      </div>
      <div class="f-sec">
        <div class="f-title">Phương thức thanh toán</div>
        ${[['all', 'Tất cả'], ...pays.map(p => [p, p])].map(([v, lbl]) =>
          `<label class="f-opt"><input type="radio" name="fp" ${LIST.ipay === v ? 'checked' : ''} onchange="invSet('ipay', '${v}')"> ${lbl}</label>`).join('')}
      </div>
      <div class="f-sec">
        <div class="f-title">Giá trị hóa đơn</div>
        <div class="f-range">
          <input class="f-input" placeholder="Từ" value="${LIST.imin}" onchange="invSet('imin', this.value)">
          <span>—</span>
          <input class="f-input" placeholder="Đến" value="${LIST.imax}" onchange="invSet('imax', this.value)">
        </div>
      </div>
      <div class="f-sec">
        <div class="f-title">VAT</div>
        <select class="f-input" onchange="invSet('ivat', this.value)">
          <option value="all">Tất cả thuế suất</option>
          ${vats.map(v => `<option value="${v}" ${LIST.ivat === String(v) ? 'selected' : ''}>${v}%</option>`).join('')}
        </select>
      </div>
    </div>

    <!-- ===== Bảng ===== -->
    <div>
      <div class="toolbar">
        <div class="page-h1">Hóa đơn <span class="badge-count">${all.length}</span></div>
        <div class="spacer"></div>
        <button class="btn" onclick="alert('Demo: xuất file Excel')">⭱ Xuất file</button>
        <a class="btn btn-primary" href="#/pos">+ Bán hàng</a>
      </div>
      <div class="card">
        ${selCount ? `<div class="bulk-bar">
          Đã chọn <b>${selCount}</b> hóa đơn
          <button class="btn" onclick="alert('Demo: in hàng loạt')">In hóa đơn</button>
          <button class="btn" onclick="alert('Demo: xuất file')">Xuất file</button>
          <button class="btn" style="color:var(--red-600)" onclick="alert('Demo: hủy hàng loạt')">Hủy</button>
          <button class="clear-sel" onclick="invClearSel()">Bỏ chọn</button>
        </div>` : ''}
        <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr>
            <th class="chk"><input type="checkbox" ${allChecked ? 'checked' : ''} onclick="invSelAll(${JSON.stringify(pageCodes).replace(/"/g, '&quot;')}, this.checked)"></th>
            ${thSort('Mã hóa đơn', 'code', LIST.isort, LIST.idir, 'invSort')}
            ${thSort('Thời gian', 'time', LIST.isort, LIST.idir, 'invSort')}
            <th>Mã KH</th>
            ${thSort('Khách hàng', 'customer', LIST.isort, LIST.idir, 'invSort')}
            <th>Điện thoại</th>
            ${thSort('Người bán', 'seller', LIST.isort, LIST.idir, 'invSort')}
            ${thSort('Tổng tiền hàng', 'sub', LIST.isort, LIST.idir, 'invSort', 'num-r')}
            <th class="num-r">Giảm giá</th>
            <th class="num-r">VAT</th>
            ${thSort('Khách cần trả', 'total', LIST.isort, LIST.idir, 'invSort', 'num-r')}
            <th class="num-r">Khách đã trả</th>
            <th>Phương thức</th><th>Trạng thái</th>
          </tr></thead>
          <tbody>
            ${all.length ? `<tr class="sum-line">
              <td colspan="7">Tổng cộng (không tính đơn hủy)</td>
              <td class="num-r">${fmt(sumSub)}</td>
              <td class="num-r">${fmt(sumDisc)}</td>
              <td class="num-r">${fmt(sumVat)}</td>
              <td class="num-r">${fmt(sumTotal)}</td>
              <td class="num-r">${fmt(sumPaid)}</td>
              <td colspan="2"></td>
            </tr>` : ''}
            ${bodyRows || `<tr><td colspan="14" style="text-align:center; padding:34px; color:var(--muted)">Không có hóa đơn phù hợp bộ lọc</td></tr>`}
          </tbody>
        </table>
        </div>
        ${pagiHTML(all.length, LIST.ipage, LIST.isize, 'invPage', 'invSize')}
      </div>
      <div class="td-muted" style="margin-top:10px">
        Doanh thu theo bộ lọc: <b style="color:var(--text)">${fmt(sumTotal)}</b> ·
        Số hóa đơn hợp lệ: <b style="color:var(--text)">${valid.length}</b> ·
        Giá trị TB/hóa đơn: <b style="color:var(--text)">${fmt(valid.length ? Math.round(sumTotal / valid.length) : 0)}</b>
      </div>
    </div>
  </div>
  ${LIST.iopen ? invoiceModal(LIST.iopen) : ''}`;
}

/* ============================================================
   CÁC MÀN KHO TRONG NHÓM HÀNG HÓA
   (Thiết lập giá · Chuyển hàng · Kiểm kho · Xuất dùng nội bộ · Xuất hủy)
   ============================================================ */
/* Giá theo từng bảng giá — bảng giá chung lấy từ danh mục, các bảng khác chiết khấu dần */
const PB_PRICES = {};
PRICEBOOKS.forEach((b, i) => {
  PB_PRICES[b] = {};
  PRODUCTS.forEach(p => PB_PRICES[b][p.code] = i === 0 ? p.price : Math.round(p.price * (i === 1 ? 0.93 : 0.88) / 1000) * 1000);
});

/* Trạng thái dùng chung cho các loại phiếu kho */
const ST_TRANSFER = { draft: ['Phiếu tạm', 'st-gray'], moving: ['Đang chuyển', 'st-blue'], received: ['Đã nhận', 'st-green'] };
const ST_STOCK = { draft: ['Phiếu tạm', 'st-gray'], balanced: ['Đã cân bằng kho', 'st-green'], cancel: ['Đã hủy', 'st-red'] };
const ST_ISSUE = { draft: ['Phiếu tạm', 'st-gray'], done: ['Hoàn thành', 'st-green'], cancel: ['Đã hủy', 'st-red'] };

/* Trạng thái lọc/phân trang riêng cho từng màn */
const DOC = {
  pb: { q: '', qCode: '', book: PRICEBOOKS[0], group: 'all', stock: 'all', page: 1, size: 10, edited: {} },
  transfers: { q: '', status: new Set(['draft', 'moving', 'received']), from: 'all', to: 'all', match: 'all', time: 'all',
    sort: 'timeKey', dir: -1, page: 1, size: 10, open: null, tab: 'info', sel: new Set() },
  stock: { q: '', status: new Set(['draft', 'balanced']), creator: 'all', time: 'all',
    sort: 'timeKey', dir: -1, page: 1, size: 10, open: null, tab: 'info', sel: new Set() },
  iu: { q: '', status: new Set(['draft', 'done']), type: 'all', creator: 'all', time: 'all',
    sort: 'timeKey', dir: -1, page: 1, size: 10, open: null, tab: 'info', sel: new Set() },
  dmg: { q: '', status: new Set(['draft', 'done']), creator: 'all', time: 'all',
    sort: 'timeKey', dir: -1, page: 1, size: 10, open: null, tab: 'info', sel: new Set() },
};
const DOC_RENDER = {
  'pricebook': () => renderPriceBook(),
  'transfers': () => renderTransfers(),
  'stocktakes': () => renderStockTakes(),
  'internal-use': () => renderInternalUse(),
  'damage-items': () => renderDamages(),
};
function docRefresh() {
  const page = (location.hash.replace(/^#\//, '') || '').split('?')[0];
  const f = DOC_RENDER[page];
  if (f) document.getElementById('content').innerHTML = f();
}
/* Handler dùng chung — k là khóa của DOC */
function docSet(k, field, v, focusId) { DOC[k][field] = v; DOC[k].page = 1; docRefresh(); if (focusId) keepFocus(focusId); }
function docToggle(k, field, v) { const s = DOC[k][field]; s.has(v) ? s.delete(v) : s.add(v); DOC[k].page = 1; docRefresh(); }
function docPage(k, p) { DOC[k].page = p; docRefresh(); }
function docSize(k, v) { DOC[k].size = +v; DOC[k].page = 1; docRefresh(); }
function docSort(k, f) { const d = DOC[k]; if (d.sort === f) d.dir *= -1; else { d.sort = f; d.dir = 1; } docRefresh(); }
function docOpen(k, c) { DOC[k].open = c; DOC[k].tab = 'info'; docRefresh(); }
function docClose(k) { DOC[k].open = null; docRefresh(); }
function docTab(k, t, ev) { ev.stopPropagation(); DOC[k].tab = t; docRefresh(); }
function docSel(k, c, ev) { ev.stopPropagation(); const s = DOC[k].sel; s.has(c) ? s.delete(c) : s.add(c); docRefresh(); }
function docSelAll(k, codes, on) { codes.forEach(c => on ? DOC[k].sel.add(c) : DOC[k].sel.delete(c)); docRefresh(); }
function docClearSel(k) { DOC[k].sel.clear(); docRefresh(); }

/* Lọc theo mốc thời gian của dữ liệu mẫu */
function docTimeOk(mode, time) {
  if (mode === 'all') return true;
  if (mode === 'month') return time.includes('/08/');
  return time.includes('/08/') && +time.slice(0, 2) === 4;   // hôm nay
}
/* Khối bộ lọc: tiêu đề + nút đặt lại */
function filterHead(onReset) {
  return `<div class="filter-card-head">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    Bộ lọc<button class="reset" onclick="${onReset}">Đặt lại</button></div>`;
}
function fSecRadio(title, k, field, opts) {
  return `<div class="f-sec"><div class="f-title">${title}</div>
    ${opts.map(([v, lbl]) => `<label class="f-opt"><input type="radio" name="${k}_${field}" ${DOC[k][field] === v ? 'checked' : ''}
      onchange="docSet('${k}','${field}','${v}')"> ${lbl}</label>`).join('')}</div>`;
}
function fSecCheck(title, k, field, map, counts) {
  return `<div class="f-sec"><div class="f-title">${title}</div>
    ${Object.entries(map).map(([v, [lbl]]) => `<label class="f-opt"><input type="checkbox" ${DOC[k][field].has(v) ? 'checked' : ''}
      onchange="docToggle('${k}','${field}','${v}')"> ${lbl}<span class="cnt">${counts[v] || 0}</span></label>`).join('')}</div>`;
}
function fSecSelect(title, k, field, opts, allLabel = 'Tất cả') {
  return `<div class="f-sec"><div class="f-title">${title}</div>
    <select class="f-input" onchange="docSet('${k}','${field}',this.value)">
      <option value="all">${allLabel}</option>
      ${opts.map(o => `<option value="${o}" ${DOC[k][field] === o ? 'selected' : ''}>${o}</option>`).join('')}
    </select></div>`;
}
/* Modal chi tiết dùng chung cho 4 loại phiếu kho */
function docModal(k, { title, sub, badge, right, tabs, body, actions }) {
  const d = DOC[k];
  return `<div class="modal-ov" onclick="if(event.target===this) docClose('${k}')">
    <div class="modal-box">
      <div class="modal-head">
        <div><h3>${title} ${badge}</h3><div class="m-sub">${sub}</div></div>
        <div class="m-right">${right}</div>
        <button class="modal-x" onclick="docClose('${k}')" title="Đóng (Esc)">×</button>
      </div>
      ${tabs.length > 1 ? `<div class="dtabs">${tabs.map(([t, lbl]) =>
        `<button class="${d.tab === t ? 'active' : ''}" onclick="docTab('${k}','${t}', event)">${lbl}</button>`).join('')}</div>` : ''}
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${actions}
        <button class="btn" style="margin-left:auto" onclick="docClose('${k}')">Đóng</button></div>
    </div>

}
/* Trạng thái rỗng */
function emptyState(msg) {
  return `<div class="empty-state">
    <div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
    <h3>Không tìm thấy kết quả</h3><p>${msg}</p></div>`;
}

/* ============================================================
   1) THIẾT LẬP GIÁ
   ============================================================ */
function pbEdit(code, v) {
  const d = DOC.pb;
  const val = parseMoney(v);
  PB_PRICES[d.book][code] = val;
  d.edited[code] = true;
  docRefresh();
}
function pbSave() {
  const n = Object.keys(DOC.pb.edited).length;
  if (!n) { alert('Chưa có thay đổi nào để lưu'); return; }
  DOC.pb.edited = {};
  docRefresh();
  alert(`Đã cập nhật giá cho ${n} hàng hóa vào "${DOC.pb.book}"`);
}
/* Modal tạo bảng giá mới */
const PBF = { open: false, tab: 'info', name: '', from: '', to: '', active: 'yes',
  baseBook: '', op: '+', amount: 0, unit: 'VND', allowOutside: 'yes', warnOutside: false };
function pbfOpen() {
  Object.assign(PBF, { open: true, tab: 'info', name: '', active: 'yes', baseBook: '', op: '+', amount: 0, unit: 'VND', allowOutside: 'yes', warnOutside: false,
    from: dmy(TODAY) + ' 00:00', to: dmy(new Date(TODAY.getFullYear() + 1, TODAY.getMonth(), TODAY.getDate())) + ' 00:00' });
  docRefresh();
}
function pbfClose() { PBF.open = false; docRefresh(); }
function pbfSet(f, v) { PBF[f] = v; docRefresh(); }
function pbfSave() {
  if (!PBF.name.trim()) { alert('Chưa nhập tên bảng giá'); return; }
  if (PRICEBOOKS.includes(PBF.name.trim())) { alert('Tên bảng giá đã tồn tại'); return; }
  const name = PBF.name.trim();
  PRICEBOOKS.push(name);
  // Sinh giá theo công thức nếu có chọn bảng giá gốc, không thì lấy giá bán niêm yết
  PB_PRICES[name] = {};
  PRODUCTS.forEach(p => {
    let base = PBF.baseBook && PB_PRICES[PBF.baseBook] ? PB_PRICES[PBF.baseBook][p.code] : p.price;
    if (PBF.amount) {
      const delta = PBF.unit === '%' ? Math.round(base * PBF.amount / 100) : PBF.amount;
      base = PBF.op === '+' ? base + delta : base - delta;
    }
    PB_PRICES[name][p.code] = Math.max(0, Math.round(base));
  });
  PBF.open = false;
  DOC.pb.book = name; DOC.pb.page = 1; DOC.pb.edited = {};
  docRefresh();
  alert(`Đã tạo bảng giá "${name}" cho ${PRODUCTS.length} hàng hóa`);
}

/* Đường dẫn → loại phiếu */
const DF_ROUTES = { 'transfer-new': 'transfer', 'stocktake-new': 'stocktake', 'internal-new': 'internal', 'damage-new': 'damage' };
function dfReset(type) {
  Object.assign(DF, { type, lines: [], note: '', tab: 'all', toBranch: '', iuType: IU_TYPES[0], receiver: '', done: null });
}
function dfRefresh() { document.getElementById('content').innerHTML = renderDocForm(); }
function dfCancel() { location.hash = DF_CFG[DF.type].back; }

/* Thêm hàng vào phiếu — kiểm kho mặc định "chưa kiểm" (actual = null) */
function dfAdd(code) {
  const p = PRODUCTS.find(x => x.code === code);
  if (DF.lines.some(l => l.code === code)) { dfRefresh(); return; }
  DF.lines.push({
    code: p.code, name: p.name, unit: p.unit, stock: p.stock, cost: p.cost,
    qty: DF.type === 'stocktake' ? null : 1,
    price: p.cost,
    recvStock: Math.floor(p.stock / 3),   // tồn kho bên nhận (chi nhánh 2)
  });
  dfRefresh();
}
function dfDel(code) { DF.lines = DF.lines.filter(l => l.code !== code); dfRefresh(); }
function dfQty(code, v) {
  const l = DF.lines.find(x => x.code === code);
  if (!l) return;
  l.qty = v === '' ? (DF.type === 'stocktake' ? null : 0) : parseMoney(v);
  dfRefresh();
}
function dfPrice(code, v) {
  const l = DF.lines.find(x => x.code === code);
  if (l) { l.price = parseMoney(v); dfRefresh(); }
}
function dfSet(field, v) { DF[field] = v; dfRefresh(); }
function dfSearch(val) {
  const drop = document.getElementById('dfDrop');
  const q = unaccent(val.trim());
  if (!q) { drop.classList.remove('show'); return; }
  const hits = PRODUCTS.filter(p => unaccent(p.name).includes(q) || unaccent(p.code).includes(q)).slice(0, 8);
  drop.innerHTML = hits.length
    ? hits.map(p => `<div class="pos-drop-item" onmousedown="dfAdd('${p.code}')">
        <div><div class="p-name">${p.name}</div><div class="p-meta">${p.code} · Tồn: ${p.stock} ${p.unit} · Giá vốn ${fmt(p.cost)}</div></div>
        <div class="p-price">${fmt(p.price)}</div></div>`).join('')
    : '<div class="pos-drop-empty">Không tìm thấy hàng hóa</div>';
  drop.classList.add('show');
}
/* Nạp nhanh toàn bộ hàng của một nhóm — tiện cho kiểm kho */
function dfAddGroup(g) {
  PRODUCTS.filter(p => p.type !== 'Dịch vụ' && (g === 'all' || p.group === g))
    .forEach(p => { if (!DF.lines.some(l => l.code === p.code)) dfAdd(p.code); });
  dfRefresh();
}
/* Các con số tổng của phiếu */
function dfTotals() {
  const L = DF.lines;
  if (DF.type === 'stocktake') {
    const checked = L.filter(l => l.qty !== null);
    const diffs = checked.map(l => ({ d: l.qty - l.stock, v: (l.qty - l.stock) * l.cost }));
    return {
      qty: checked.reduce((s, l) => s + l.qty, 0),
      value: checked.reduce((s, l) => s + l.qty * l.cost, 0),
      match: checked.filter((l, i) => diffs[i].d === 0).length,
      diffCount: checked.filter((l, i) => diffs[i].d !== 0).length,
      unchecked: L.length - checked.length,
      incQty: diffs.filter(x => x.d > 0).reduce((s, x) => s + x.d, 0),
      decQty: diffs.filter(x => x.d < 0).reduce((s, x) => s + x.d, 0),
      diffValue: diffs.reduce((s, x) => s + x.v, 0),
    };
  }
  return {
    qty: L.reduce((s, l) => s + (l.qty || 0), 0),
    value: L.reduce((s, l) => s + (l.qty || 0) * (DF.type === 'transfer' ? l.price : l.cost), 0),
  };
}
/* Lưu phiếu — chỉ trong bộ nhớ phiên làm việc */
function dfSubmit(status) {
  const t = dfTotals();
  if (!DF.lines.length) { alert('Chưa có hàng hóa nào trong phiếu'); return; }
  if (DF.type === 'transfer' && !DF.toBranch) { alert('Chưa chọn chi nhánh nhận hàng'); return; }
  if (DF.type === 'stocktake' && t.unchecked === DF.lines.length) { alert('Chưa nhập số lượng thực tế cho hàng hóa nào'); return; }
  if (DF.type !== 'stocktake' && t.qty <= 0) { alert('Chưa nhập số lượng'); return; }

  const now = dmy(TODAY) + ' 17:30';
  const tk = 202608041730;
  /* Sinh mã phiếu kế tiếp, giữ đúng số chữ số như dữ liệu hiện có */
  const nextCode = (list, prefix) => {
    const nums = list.map(x => +String(x.code).replace(prefix, '')).filter(n => !isNaN(n));
    const width = list.length ? String(list[0].code).replace(prefix, '').length : 6;
    return prefix + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(width, '0');
  };
  if (DF.type === 'transfer') {
    const items = DF.lines.filter(l => l.qty > 0).map(l => ({ code: l.code, name: l.name, unit: l.unit, qty: l.qty, recvQty: 0, price: l.price }));
    TRANSFERS.unshift({ code: nextCode(TRANSFERS, 'TRF'), time: now, recvTime: '', from: 'Chi nhánh trung tâm', to: DF.toBranch,
      creator: DF.issuer, receiver: '', items, note: DF.note, noteRecv: '',
      status: status === 'draft' ? 'draft' : 'moving',
      sendQty: t.qty, recvQty: 0, sendValue: t.value, recvValue: 0, skus: items.length, matched: false, timeKey: tk });
  } else if (DF.type === 'stocktake') {
    const items = DF.lines.filter(l => l.qty !== null).map(l => ({
      code: l.code, name: l.name, unit: l.unit, stock: l.stock, actual: l.qty,
      diff: l.qty - l.stock, cost: l.cost, diffValue: (l.qty - l.stock) * l.cost,
    }));
    const inc = items.filter(i => i.diff > 0), dec = items.filter(i => i.diff < 0);
    STOCKTAKES.unshift({ code: nextCode(STOCKTAKES, 'KK'), time: now,
      balanceTime: status === 'draft' ? '' : now, creator: DF.issuer, balancer: status === 'draft' ? '' : DF.issuer,
      items, note: DF.note, status: status === 'draft' ? 'draft' : 'balanced',
      actualQty: t.qty, actualValue: t.value,
      incQty: inc.reduce((s, i) => s + i.diff, 0), incValue: inc.reduce((s, i) => s + i.diffValue, 0),
      decQty: dec.reduce((s, i) => s + i.diff, 0), decValue: dec.reduce((s, i) => s + i.diffValue, 0),
      diffQty: items.reduce((s, i) => s + i.diff, 0), diffValue: items.reduce((s, i) => s + i.diffValue, 0), timeKey: tk });
  } else {
    const items = DF.lines.filter(l => l.qty > 0).map(l => ({ code: l.code, name: l.name, unit: l.unit, qty: l.qty, cost: l.cost, price: l.cost }));
    const rec = { time: now, creator: DF.issuer, issuer: DF.issuer, items, note: DF.note,
      status: status === 'draft' ? 'draft' : 'done', qty: t.qty, total: t.value, skus: items.length,
      branch: 'Chi nhánh trung tâm', store: 'Kho chính', timeKey: tk };
    if (DF.type === 'internal') IU_LIST.unshift({ ...rec, code: nextCode(IU_LIST, 'XN'), type: DF.iuType, receiver: DF.receiver || '—' });
    else DMG_LIST.unshift({ ...rec, code: nextCode(DMG_LIST, 'XH') });
  }
  DF.done = { status, qty: t.qty, value: t.value };
  dfRefresh();
}

  return `<div class="modal-ov" onclick="if(event.target===this) retClose()">

        <button class="btn" onclick="alert('Demo: sao chép phiếu trả')">Sao chép</button>

/* ============================================================
   FORM LẬP PHIẾU TRẢ HÀNG — bố cục POS 2 khu (hàng trả / hàng đổi)
   ============================================================ */
const RF = {
  picking: true,      // đang ở bước chọn hóa đơn
  quick: false,       // trả nhanh (không từ hóa đơn)
  invoice: null,      // mã hóa đơn gốc
  lines: [],          // hàng trả: {code,name,unit,buyPrice,price,qty,max}
  ex: [],             // hàng đổi: {code,name,unit,price,qty}
  discount: 0, fee: 0, otherRefund: 0,
  seller: 'Đông', receiver: 'Đông',
  pickQ: '', pickPage: 1,
  done: null,         // phiếu vừa lập xong
};
function rfReset() {
  Object.assign(RF, { picking: true, quick: false, invoice: null, lines: [], ex: [],
    discount: 0, fee: 0, otherRefund: 0, pickQ: '', pickPage: 1, done: null });
}
function rfRefresh() { document.getElementById('content').innerHTML = renderReturnForm(); }
function rfPickQ(v) { RF.pickQ = v; RF.pickPage = 1; rfRefresh(); keepFocus('rfPickSearch'); }
function rfPickPage(p) { RF.pickPage = p; rfRefresh(); }
/* Chọn hóa đơn -> nạp các dòng hàng, SL trả mặc định 0, chặn vượt SL đã mua */
function rfPick(code) {
  const iv = INVOICES.find(x => x.code === code);
  RF.invoice = code; RF.quick = false; RF.picking = false;
  RF.seller = iv.seller;
  RF.lines = iv.items.map(it => ({
    code: it.code, name: it.name, unit: it.unit,
    buyPrice: it.price - it.disc, price: it.price - it.disc, qty: 0, max: it.qty,
  }));
  rfRefresh();
}
function rfQuick() { RF.quick = true; RF.picking = false; RF.invoice = null; RF.lines = []; rfRefresh(); }
function rfCancel() { rfReset(); location.hash = '#/returns'; }

function rfQty(code, v) {
  const l = RF.lines.find(x => x.code === code);
  if (!l) return;
  const q = parseMoney(v);
  l.qty = RF.quick ? q : Math.min(q, l.max);   // trả theo hóa đơn không vượt SL đã mua
  rfRefresh();
}
function rfPrice(code, v) {
  const l = RF.lines.find(x => x.code === code);
  if (l) { l.price = parseMoney(v); rfRefresh(); }
}
function rfDel(code) { RF.lines = RF.lines.filter(x => x.code !== code); rfRefresh(); }
function rfMoney(el, field) { RF[field] = parseMoney(el.value); rfRefresh(); }

/* Trả nhanh: thêm hàng trả tự do từ danh mục */
function rfAddLine(code) {
  const p = PRODUCTS.find(x => x.code === code);
  const ex = RF.lines.find(x => x.code === code);
  if (ex) ex.qty++;
  else RF.lines.push({ code: p.code, name: p.name, unit: p.unit, buyPrice: p.price, price: p.price, qty: 1, max: 9999 });
  rfRefresh();
}
/* Hàng đổi */
function rfAddEx(code) {
  const p = PRODUCTS.find(x => x.code === code);
  const ex = RF.ex.find(x => x.code === code);
  if (ex) ex.qty++;
  else RF.ex.push({ code: p.code, name: p.name, unit: p.unit, price: p.price, qty: 1 });
  rfRefresh();
}
function rfExQty(code, v) {
  const l = RF.ex.find(x => x.code === code);
  if (!l) return;
  const q = parseMoney(v);
  if (q <= 0) RF.ex = RF.ex.filter(x => x.code !== code); else l.qty = q;
  rfRefresh();
}
function rfExDel(code) { RF.ex = RF.ex.filter(x => x.code !== code); rfRefresh(); }

/* Gợi ý hàng hóa cho 2 ô tìm kiếm của form */
function rfSearch(val, target) {
  const drop = document.getElementById(target === 'ret' ? 'rfDropRet' : 'rfDropEx');
  const q = unaccent(val.trim());
  if (!q) { drop.classList.remove('show'); return; }
  const hits = PRODUCTS.filter(p => unaccent(p.name).includes(q) || unaccent(p.code).includes(q)).slice(0, 8);
  drop.innerHTML = hits.length
    ? hits.map(p => `<div class="pos-drop-item" onmousedown="${target === 'ret' ? 'rfAddLine' : 'rfAddEx'}('${p.code}')">
        <div><div class="p-name">${p.name}</div><div class="p-meta">${p.code} · Tồn: ${p.stock} ${p.unit}</div></div>
        <div class="p-price">${fmt(p.price)}</div></div>`).join('')
    : '<div class="pos-drop-empty">Không tìm thấy hàng hóa</div>';
  drop.classList.add('show');
}

/* Các con số của phiếu đang lập */
function rfTotals() {
  const buyTotal = RF.lines.reduce((s, l) => s + l.buyPrice * l.qty, 0);   // tổng giá gốc hàng mua
  const retTotal = RF.lines.reduce((s, l) => s + l.price * l.qty, 0);      // tổng tiền hàng trả
  const exTotal = RF.ex.reduce((s, l) => s + l.price * l.qty, 0);          // tổng tiền hàng đổi
  const need = retTotal - RF.discount - RF.fee + RF.otherRefund - exTotal;
  return { buyTotal, retTotal, exTotal, need, qty: RF.lines.reduce((s, l) => s + l.qty, 0) };
}

/* Lưu phiếu trả (chỉ trong bộ nhớ phiên làm việc) */
function rfSubmit() {
  const t = rfTotals();
  if (!RF.lines.length || t.qty <= 0) { alert('Chưa nhập số lượng hàng trả'); return; }
  const seq = 'TH000' + (122 + RETURNS.filter(r => r.code.startsWith('TH')).length - 7 + 1);
  const iv = RF.invoice ? INVOICES.find(x => x.code === RF.invoice) : null;
  const items = RF.lines.filter(l => l.qty > 0).map(l => {
    const p = PRODUCTS.find(x => x.code === l.code) || { cost: 0 };
    return { code: l.code, name: l.name, unit: l.unit, qty: l.qty, price: l.price, disc: 0, cost: p.cost };
  });
  const rec = {
    code: seq, time: dmy(TODAY) + ' 17:30', type: RF.quick ? 'quick' : 'invoice',
    invoice: RF.invoice || '', custCode: iv ? iv.custCode : 'KL', customer: iv ? iv.customer : 'Khách lẻ',
    seller: RF.seller, creator: RF.seller, receiver: RF.receiver,
    branch: 'Chi nhánh trung tâm', items, discount: RF.discount, fee: RF.fee, vatPct: 0, note: '',
    status: 'done', value: t.retTotal, vatRefund: 0, totalReturn: t.retTotal - RF.discount - RF.fee,
    exchangeTotal: t.exTotal, needPay: Math.max(0, t.need), paidAmt: Math.max(0, t.need),
    refund: t.retTotal - RF.discount - RF.fee, timeKey: 202608041730,
  };
  RETURNS.unshift(rec);
  RF.done = { code: seq, need: t.need, qty: t.qty };
  rfRefresh();
}
function rfDoneClose() { rfReset(); location.hash = '#/returns'; }

/* ---------- Bước 1: modal chọn hóa đơn để trả ---------- */
function rfPicker() {
  const q = unaccent(RF.pickQ.trim());
  const list = INVOICES.filter(iv => iv.status !== 'cancel' &&
    (!q || unaccent(iv.code).includes(q) || unaccent(iv.customer).includes(q)

  const SIZE = 7;
  const pages = Math.max(1, Math.ceil(list.length / SIZE));

  return `<div class="modal-ov" onclick="if(event.target===this) rfCancel()">

        <button class="modal-x" onclick="rfCancel()" title="Đóng (Esc)">×</button>
      </div>
      <div class="modal-body">

          <div>
            <div class="card">
              <div class="f-sec">
                <div class="f-title">Tìm kiếm</div>
                <input class="f-input" id="rfPickSearch" placeholder="Mã hóa đơn, khách hàng, mã/tên hàng…"
                       value="${RF.pickQ}" oninput="rfPickQ(this.value)">
              </div>
              <div class="f-sec">
                <div class="f-title">Thời gian</div>
                <div class="f-range">
                  <input class="f-input" placeholder="Từ ngày" value="${dmy(new Date(TODAY - 30 * DAY_MS))}">
                  <span>—</span>
                  <input class="f-input" placeholder="Đến ngày" value="${dmy(TODAY)}">
                </div>
              </div>
              <div class="f-sec">
                <div class="f-title">Chi nhánh</div>
                <select class="f-input"><option>Chi nhánh trung tâm</option><option>Chi nhánh 2</option></select>
              </div>
            </div>
          </div>
          <div>
            <div class="mini-tbl pick-wrap">
              <table class="tbl pick-tbl">
                <thead><tr><th>Mã hóa đơn</th><th>Thời gian</th><th>Người bán</th><th>Khách hàng</th><th class="num-r">Tổng cộng</th><th></th></tr></thead>
                <tbody>
                  ${rows.length ? rows.map(iv => `<tr>
                    <td class="td-code">${iv.code}</td>
                    <td class="td-muted td-nowrap">${iv.time}</td>
                    <td class="td-muted">${iv.seller}</td>
                    <td>${iv.customer}</td>
                    <td class="num-r"><b>${fmt(iv.total)}</b></td>
                    <td><button class="btn" style="height:28px;font-size:12.5px" onclick="rfPick('${iv.code}')">Chọn</button></td>
                  </tr>`).join('')
                  : `<tr><td colspan="6" style="text-align:center;padding:26px;color:var(--muted)">Không tìm thấy hóa đơn phù hợp</td></tr>`}
                </tbody>
              </table>
            </div>
            <div class="pagi">
              <span class="pg-info">Hiển thị ${rows.length ? (RF.pickPage - 1) * SIZE + 1 : 0}–${Math.min(RF.pickPage * SIZE, list.length)} trên tổng số ${list.length} hóa đơn</span>
              <button ${RF.pickPage <= 1 ? 'disabled' : ''} onclick="rfPickPage(${RF.pickPage - 1})">‹</button>
              ${Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === RF.pickPage ? 'cur' : ''}" onclick="rfPickPage(${i + 1})">${i + 1}</button>`).join('')}
              <button ${RF.pickPage >= pages ? 'disabled' : ''} onclick="rfPickPage(${RF.pickPage + 1})">›</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="rfCancel()">Hủy</button>
        <button class="btn btn-primary" style="margin-left:auto" onclick="rfQuick()">Trả nhanh (không từ hóa đơn)</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Form lập phiếu trả ---------- */

/* ============================================================
   PHÂN TÍCH & BÁO CÁO — nền tảng tính toán dùng chung
   ============================================================ */
const DAY_MS = 86400000;
const TODAY = new Date(2026, 7, 4);              // 04/08/2026 — mốc "hôm nay" của dữ liệu mẫu
const toDate = s => { const [d, m, y] = s.split(' ')[0].split('/'); return new Date(+y, +m - 1, +d); };
const dmy = dt => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
const dm  = dt => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0');
const pct = (a, b) => b ? (a - b) / b * 100 : 0;
const fmtPct = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

/* Khoảng thời gian đang chọn + khoảng liền trước để so sánh */
const PERIODS = { today: 'Hôm nay', '7d': '7 ngày qua', month: 'Tháng này', all: 'Toàn thời gian' };
function periodRange(key) {
  const to = new Date(TODAY);
  let from;
  if (key === 'today') from = new Date(TODAY);
  else if (key === '7d') from = new Date(TODAY - 6 * DAY_MS);
  else if (key === 'month') from = new Date(2026, 7, 1);
  else from = new Date(2026, 6, 1);
  return { from, to };
}
function prevRange(key) {
  const { from, to } = periodRange(key);
  const len = Math.round((to - from) / DAY_MS) + 1;
  return { from: new Date(from - len * DAY_MS), to: new Date(from - DAY_MS) };
}
const inRange = (s, r) => { const d = toDate(s); return d >= r.from && d <= r.to; };

/* Giá vốn & các chỉ số của một hóa đơn */
const costOfItems = items => items.reduce((s, it) => {
  const p = PRODUCTS.find(x => x.code === it.code);
  return s + (p ? p.cost : 0) * it.qty;
}, 0);
function invStats(iv) {
  const cost = costOfItems(iv.items);
  const net = iv.sub - iv.discount;
  return { bills: 1, revenue: iv.sub, discount: iv.discount, vat: iv.vatAmt, net, cost, profit: net - cost, total: iv.total, paid: iv.paid };
}
/* Tổng hợp chỉ số trên tập hóa đơn (đã loại đơn hủy) + trả hàng trong kỳ */
function aggregate(range) {
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, range));
  const rets = RETURNS.filter(r => inRange(r.time, range));
  const s = invs.reduce((a, iv) => {
    const m = invStats(iv);
    Object.keys(m).forEach(k => a[k] = (a[k] || 0) + m[k]);
    return a;
  }, {});
  const base = { bills: 0, revenue: 0, discount: 0, vat: 0, net: 0, cost: 0, profit: 0, total: 0, paid: 0, ...s };
  base.returnValue = rets.reduce((a, r) => a + r.value, 0);
  base.returnCost = rets.reduce((a, r) => a + r.items.reduce((s, it) => s + it.cost * it.qty, 0), 0);
  base.returnCount = rets.length;
  // Trả hàng giảm doanh thu, đồng thời hoàn lại giá vốn của hàng đã trả
  base.netAfterReturn = base.net - base.returnValue;
  base.costAfterReturn = base.cost - base.returnCost;
  base.profitAfterReturn = base.netAfterReturn - base.costAfterReturn;
  base.days = Math.round((range.to - range.from) / DAY_MS) + 1;
  return base;
}
/* Gom nhóm rồi cộng dồn chỉ số */
function groupAgg(rows, keyFn, statFn) {
  const map = new Map();
  rows.forEach(r => {
    const k = keyFn(r);
    const cur = map.get(k) || {};
    const m = statFn(r);
    Object.keys(m).forEach(f => cur[f] = (cur[f] || 0) + m[f]);
    map.set(k, cur);
  });
  return map;
}
/* Chi phí phân bổ cho kỳ đang xem (định mức tháng × số ngày / 30) */
function expensesFor(range) {
  const days = Math.round((range.to - range.from) / DAY_MS) + 1;
  const rows = EXPENSES_MONTHLY.map(([name, m]) => ({ name, amount: Math.round(m * days / 30) }));
  return { rows, total: rows.reduce((s, e) => s + e.amount, 0), days };
}

/* Danh sách ngày trong khoảng, dùng làm trục X */
function daysOf(range) {
  const out = [];
  for (let t = +range.from; t <= +range.to; t += DAY_MS) out.push(new Date(t));
  return out;
}

/* ---------- Biểu đồ đường nhiều chuỗi ---------- */
function lineChartSVG(labels, series) {
  const W = 960, H = 280, padL = 62, padR = 16, padT = 16, padB = 34;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(1, ...series.flatMap(s => s.data));
  const step = Math.pow(10, Math.floor(Math.log10(max / 4 || 1)));
  const unit = Math.ceil(max / 4 / step) * step;
  const yMax = unit * 4;
  const x = i => padL + (labels.length === 1 ? iw / 2 : iw * i / (labels.length - 1));
  const y = v => padT + ih - ih * v / yMax;

  let s = `<svg class="line-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (let i = 0; i <= 4; i++) {
    const yy = padT + ih - ih * i / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}"/>`;
    s += `<text class="axis-text" x="${padL - 8}" y="${yy + 4}" text-anchor="end">${fmtTr(unit * i)}</text>`;
  }
  labels.forEach((l, i) => {
    const every = labels.length > 16 ? Math.ceil(labels.length / 12) : 1;
    if (i % every === 0) s += `<text class="axis-text" x="${x(i)}" y="${H - 12}" text-anchor="middle">${l}</text>`;
  });
  series.forEach(se => {
    const pts = se.data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`;
    se.data.forEach((v, i) => {
      s += `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#fff" stroke="${se.color}" stroke-width="2"><title>${se.name} ${labels[i]}: ${fmt(v)}</title></circle>`;
    });
  });
  return s + '</svg>';
}
/* ---------- Biểu đồ tròn ---------- */
function pieSVG(items, size = 190, donut = 0) {
  const total = items.reduce((s, x) => s + x.v, 0) || 1;
  const R = size / 2, cx = R, cy = R;
  let ang = -Math.PI / 2, out = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  items.forEach(it => {
    const frac = it.v / total, a2 = ang + frac * Math.PI * 2;
    if (frac <= 0) { ang = a2; return; }
    if (frac > 0.9999) {
      out += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${it.c}"><title>${it.n}: ${fmt(it.v)}</title></circle>`;
    } else {
      const x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
      const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      out += `<path d="M${cx} ${cy} L${x1} ${y1} A${R} ${R} 0 ${frac > .5 ? 1 : 0} 1 ${x2} ${y2} Z" fill="${it.c}"><title>${it.n}: ${fmt(it.v)} (${(frac * 100).toFixed(2)}%)</title></path>`;
    }
    // Nhãn % đặt giữa cung nếu đủ rộng
    if (frac > 0.05) {
      const am = ang + frac * Math.PI, lr = R * 0.62;
      out += `<text x="${cx + lr * Math.cos(am)}" y="${cy + lr * Math.sin(am) + 4}" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="600">${(frac * 100).toFixed(2)}%</text>`;
    }
    ang = a2;
  });
  if (donut) out += `<circle cx="${cx}" cy="${cy}" r="${R * donut}" fill="#fff"/>`;
  return out + '</svg>';
}

/* ---------- Sparkline (đường mini trong thẻ KPI) ---------- */
function sparkSVG(data, color = '#16A34A', w = 150, h = 34) {
  if (!data.length) return '';
  const max = Math.max(...data), min = Math.min(...data), rg = max - min || 1;
  const x = i => data.length === 1 ? w / 2 : w * i / (data.length - 1);
  const y = v => h - 3 - (h - 8) * (v - min) / rg;
  const pts = data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%">
    <polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" points="${pts}"/>
    <polygon fill="${color}" opacity=".12" points="0,${h} ${pts} ${w},${h}"/>
  </svg>`;
}

/* ---------- Biểu đồ cột ngang (nhãn nằm trên thanh như KiotViet) ---------- */
function hbarSVG(items, fmtV = fmtTr) {
  const max = Math.max(1, ...items.map(x => x.v));
  const rowH = 42, W = 560, padL = 4, padR = 66;
  const H = items.length * rowH + 24;
  // Không đặt width/height cố định để SVG co giãn theo khung, tránh khoảng trắng thừa
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  items.forEach((it, i) => {
    const y = i * rowH + 4;
    const bw = Math.max(2, (W - padL - padR) * it.v / max);
    s += `<text x="${padL}" y="${y + 11}" class="axis-text" font-size="11">${it.n}</text>`;
    s += `<rect x="${padL}" y="${y + 16}" width="${bw}" height="14" rx="2" fill="${it.c || 'var(--green-600)'}"><title>${it.n}: ${fmt(it.v)}</title></rect>`;
    s += `<text x="${padL + bw + 6}" y="${y + 27}" class="axis-text" font-size="10.5">${fmtV(it.v)}</text>`;
  });
  s += `<line class="grid-line" x1="${padL}" y1="${H - 16}" x2="${W - padR}" y2="${H - 16}"/>`;
  [0, .5, 1].forEach(f => {
    const x = padL + (W - padL - padR) * f;
    s += `<text x="${x}" y="${H - 4}" class="axis-text" text-anchor="middle" font-size="10">${fmtV(max * f)}</text>`;
  });
  return s + '</svg>';
}

/* ---------- Biểu đồ cột chồng theo ngày ---------- */
function stackedBarSVG(labels, series) {
  const W = 560, H = 250, padL = 46, padR = 10, padT = 14, padB = 40;
  const iw = W - padL - padR, ih = H - padT - padB;
  const totals = labels.map((_, i) => series.reduce((s, se) => s + se.data[i], 0));
  const max = Math.max(1, ...totals);
  const step = Math.pow(10, Math.floor(Math.log10(max / 4 || 1)));
  const unit = Math.ceil(max / 4 / step) * step, yMax = unit * 4;
  const n = labels.length, gap = iw / n * 0.45, bw = (iw - gap * n) / n;

  let s = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (let i = 0; i <= 4; i++) {
    const y = padT + ih - ih * i / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    s += `<text class="axis-text" x="${padL - 6}" y="${y + 4}" text-anchor="end">${unit * i >= 1e6 ? fmtTr(unit * i) : fmt(unit * i)}</text>`;
  }
  labels.forEach((l, i) => {
    const x = padL + i * (bw + gap) + gap / 2;
    let acc = 0;
    series.forEach(se => {
      const hh = ih * se.data[i] / yMax;
      if (hh > 0) {
        s += `<rect x="${x}" y="${padT + ih - acc - hh}" width="${bw}" height="${hh}" fill="${se.color}"><title>${se.name} ${l}: ${fmt(se.data[i])}</title></rect>`;
      }
      acc += hh;
    });
    if (totals[i]) s += `<text class="axis-text" x="${x + bw / 2}" y="${padT + ih - acc - 5}" text-anchor="middle" font-size="10">${totals[i] >= 1e6 ? fmtTr(totals[i]) : fmt(totals[i])}</text>`;
    s += `<text class="axis-text" x="${x + bw / 2}" y="${H - 20}" text-anchor="middle">${l}</text>`;
  });
  return s + '</svg>';
}

/* ---------- Biểu đồ phân tán 4 góc phần tư ---------- */
function scatterSVG(points, xLabel, yLabel) {
  const W = 480, H = 300, padL = 52, padR = 14, padT = 12, padB = 44;
  const iw = W - padL - padR, ih = H - padT - padB;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const xMin = Math.min(0, ...xs), xMax = Math.max(1, ...xs);
  const yMin = Math.min(0, ...ys), yMax = Math.max(1, ...ys);
  const X = v => padL + iw * (v - xMin) / (xMax - xMin || 1);
  const Y = v => padT + ih - ih * (v - yMin) / (yMax - yMin || 1);
  const xMid = (xMin + xMax) / 2, yMid = (yMin + yMax) / 2;

  let s = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= 4; i++) {
    const y = padT + ih - ih * i / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    s += `<text class="axis-text" x="${padL - 6}" y="${y + 4}" text-anchor="end">${Math.round(yMin + (yMax - yMin) * i / 4)}</text>`;
  }
  // Đường chia 4 góc phần tư
  s += `<line x1="${X(xMid)}" y1="${padT}" x2="${X(xMid)}" y2="${padT + ih}" stroke="#9FB3A6" stroke-width="1" stroke-dasharray="4 3"/>`;
  s += `<line x1="${padL}" y1="${Y(yMid)}" x2="${W - padR}" y2="${Y(yMid)}" stroke="#9FB3A6" stroke-width="1" stroke-dasharray="4 3"/>`;
  points.forEach(p => {
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.c}" opacity=".85"><title>${p.n}\nLợi nhuận gộp: ${fmt(p.x)}\nSố lượng bán: ${p.y}</title></circle>`;
  });
  [0, .25, .5, .75, 1].forEach(f => {
    const v = xMin + (xMax - xMin) * f;
    s += `<text class="axis-text" x="${X(v)}" y="${H - 26}" text-anchor="middle">${fmtTr(v)}</text>`;
  });
  s += `<text class="axis-text" x="${padL + iw / 2}" y="${H - 8}" text-anchor="middle">${xLabel}</text>`;
  s += `<text class="axis-text" x="12" y="${padT + ih / 2}" text-anchor="middle" transform="rotate(-90 12 ${padT + ih / 2})">${yLabel}</text>`;
  return s + '</svg>';
}

/* ---------- Treemap (nhóm khách hàng) ---------- */
function treemapSVG(items, W = 300, H = 210) {
  const total = items.reduce((s, x) => s + x.v, 0) || 1;
  // Xếp lát cắt luân phiên ngang/dọc theo tỷ trọng
  let x = 0, y = 0, w = W, h = H, rest = total, out = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">`;
  items.forEach((it, i) => {
    const frac = it.v / rest;
    const last = i === items.length - 1;
    let rw, rh;
    if (last) { rw = w; rh = h; }
    else if (w >= h) { rw = Math.max(6, w * frac); rh = h; }
    else { rw = w; rh = Math.max(6, h * frac); }
    out += `<g><rect x="${x + 1}" y="${y + 1}" width="${Math.max(1, rw - 2)}" height="${Math.max(1, rh - 2)}" fill="${it.c}" rx="3"><title>${it.n}: ${fmt(it.v)} (${(it.v / total * 100).toFixed(2)}%)</title></rect>`;
    if (rw > 52 && rh > 30) {
      out += `<text x="${x + 8}" y="${y + 18}" font-size="10.5" fill="#fff" font-weight="600">${it.n}</text>`;
      out += `<text x="${x + 8}" y="${y + 32}" font-size="10.5" fill="#fff" opacity=".9">${(it.v / total * 100).toFixed(2)}%</text>`;
    }
    out += '</g>';
    if (!last) {
      if (w >= h) { x += rw; w -= rw; } else { y += rh; h -= rh; }
      rest -= it.v;
    }
  });
  return out + '</svg>';
}

/* ---------- Biểu đồ cột 1 chuỗi (dùng trong trang báo cáo) ---------- */
function barSimpleSVG(labels, values, fmtV = fmtTr) {
  const W = 960, H = 300, padL = 62, padR = 16, padT = 16, padB = 56;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(1, ...values);
  const step = Math.pow(10, Math.floor(Math.log10(max / 4 || 1)));
  const unit = Math.max(fmtV === fmtTr ? 1 : 1, Math.ceil(max / 4 / step) * step);
  const yMax = unit * 4;
  const n = labels.length, gap = Math.max(6, iw / n * 0.4), bw = Math.max(4, (iw - gap * n) / n);

  let s = `<svg class="line-svg" style="height:300px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (let i = 0; i <= 4; i++) {
    const yy = padT + ih - ih * i / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}"/>`;
    s += `<text class="axis-text" x="${padL - 8}" y="${yy + 4}" text-anchor="end">${fmtV(unit * i)}</text>`;
  }
  // Nhãn ngang, cắt theo bề rộng cột và xuống tối đa 2 dòng — tránh bị viewBox cắt như khi xoay nghiêng
  const maxCh = Math.max(6, Math.floor(bw / 5.6));
  values.forEach((v, i) => {
    const bx = padL + i * (bw + gap) + gap / 2, bh = ih * v / yMax;
    s += `<rect class="bar" x="${bx}" y="${padT + ih - bh}" width="${bw}" height="${bh}" rx="2"><title>${labels[i]}: ${fmt(v)}</title></rect>`;
    const words = String(labels[i]).split(' ');
    const lines = [];
    words.forEach(w => {
      const last = lines[lines.length - 1];
      if (last && (last + ' ' + w).length <= maxCh) lines[lines.length - 1] = last + ' ' + w;
      else lines.push(w);
    });
    lines.slice(0, 2).forEach((ln, k) => {
      const txt = ln.length > maxCh ? ln.slice(0, maxCh - 1) + '…' : ln;
      const more = k === 1 && lines.length > 2 ? '…' : '';
      s += `<text class="axis-text" x="${bx + bw / 2}" y="${H - 30 + k * 13}" text-anchor="middle">${txt}${more}</text>`;
    });
  });
  return s + '</svg>';
}

function custKind(custCode, range) {

}
/* Nhóm vòng đời khách hàng — tính trên toàn bộ lịch sử */
function custSegment(custCode) {
  const all = INVOICES.filter(iv => iv.status !== 'cancel' && iv.custCode === custCode);
  if (!all.length) return 'Sắp rời bỏ';
  const bills = all.length;
  const lastTs = Math.max(...all.map(iv => iv.ts));
  const daysAgo = Math.round((TODAY - toDate(all.find(iv => iv.ts === lastTs).time)) / DAY_MS);
  if (bills >= 3) return 'Trung thành';
  if (bills === 2) return 'Thân thiết';
  if (daysAgo <= 2) return 'Tiềm năng';
  if (daysAgo <= 4) return 'Cần quan tâm';
  return 'Sắp rời bỏ';
}

function classifyProducts(range) {
  const invs = INVOICES.filter(iv => iv.status !== 'cancel' && inRange(iv.time, range));
  const g = groupAgg(invs.flatMap(iv => iv.items), it => it.code, it => {
    const p = PRODUCTS.find(x => x.code === it.code) || { cost: 0 };
    const rev = (it.price - (it.disc || 0)) * it.qty;
    return { qty: it.qty, revenue: rev, profit: rev - p.cost * it.qty };
  });
  const rows = [...g].map(([code, v]) => ({ code, name: (PRODUCTS.find(p => p.code === code) || {}).name, ...v }));
  if (!rows.length) return [];
  const midQ = rows.reduce((s, r) => s + r.qty, 0) / rows.length;
  const midP = rows.reduce((s, r) => s + r.profit, 0) / rows.length;
  return rows.map(r => ({
    ...r,
    seg: r.qty >= midQ ? (r.profit >= midP ? 'Ngôi sao' : 'Phổ biến')
                       : (r.profit >= midP ? 'Tiềm năng' : 'Cần cải thiện'),
  }));
}
/* Lịch sử 12 tháng cho biểu đồ công nợ — sinh tất định từ số liệu thực của kỳ hiện tại */
function debtHistory() {
  const base = aggregate(periodRange('all'));
  let seed = 20260804;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const out = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(2026, 7 - i, 1);
    const f = 0.75 + rnd() * 0.6;
    out.push({
      label: String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(),
      debt: Math.round(base.total * 0.35 * f),
      net: Math.round(base.netAfterReturn * f),
    });
  }
  return out;
}

        : `<tr><td colspan="${cols.length}" style="text-align:center;padding:30px;color:var(--muted)">Không có dữ liệu trong kỳ</td></tr>`}
    </tbody>
  </table></div>`;
}
