<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>%VITE_APP_NAME%</title>
    <script>
      (function () {
        const theme = localStorage.getItem("themeMode") || "light";
        const primary = localStorage.getItem("primaryColor") || "#16a34a";

        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.setProperty("--primary-color", primary);
      })();
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap");
      :root {
        --color-primary: #16a34a;
        --text-primary: rgba(0, 0, 0, 0.88);
        --text-secondary: rgba(0, 0, 0, 0.45);
        --color-border: #e2e8f0;

        --color-scrollbar-bg: #f1f1f1;
        --color-scrollbar-thumb: #c1c1c1;
        --color-scrollbar-thumb-hover: #a8a8a8;

        --bg-panel: #fff;
        --bg-summary-row: #f0f0f0;
      }

      html.dark {
        --color-primary: #3f70dc;
        --text-primary: rgba(255, 255, 255, 0.88);
        --text-secondary: rgba(255, 255, 255, 0.55);
        --color-border: #334155;

        --color-scrollbar-bg: #2c2c2c;
        --color-scrollbar-thumb: #555;
        --color-scrollbar-thumb-hover: #777;

        --bg-panel: #1f1f1f;
        --bg-summary-row: #292929;
      }

      .full-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        z-index: 9999;
        overflow: hidden;
        transition: all 0.9s ease-in-out;
      }

      .top__full-screen,
      .bot__full-screen {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        background-color: #f5f5f5;
        transition: transform 0.9s ease-in-out;
      }

      .logo-text {
        font-size: 64px;
        font-weight: bold;
        font-family: "JetBrains Mono", monospace !important;
        color: var(--text-primary);
      }

      html[data-theme="dark"] .top__full-screen,
      html[data-theme="dark"] .bot__full-screen {
        background-color: #141414;
      }

      html[data-theme="dark"] .loading-container {
        background-color: rgba(0, 0, 0, 0.4);
      }

      img.default-logo:not(.current-organization-logo) {
        height: 80px;
      }

      .current-organization-logo {
        height: 200px;
        width: 200px;
        object-fit: cover;
        border-radius: 50%;
        overflow: hidden;
      }

      /* Khi loading hoàn tất, top đi lên, bot đi xuống */
      /* .full-screen.hide .top__full-screen {
        transform: translateY(-100%);
      }

      .full-screen.hide .bot__full-screen {
        transform: translateY(100%);
      } */
      .full-screen.hide {
        opacity: 0;
      }

      .waiting__container {
        min-height: 200px;
      }

      .waiting-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .waiting {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background-color: var(--primary-color);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        animation: animationLoading 1s ease-in-out infinite;
      }

      .loading-container {
        display: flex;
        position: fixed;
        align-items: center;
        justify-content: center;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.1);
        z-index: 99999;
      }

      .loading-wrapper {
        display: flex;
        align-items: center;
        gap: 20px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .loading {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: var(--primary-color);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.24);
        animation: animationLoading 1s ease-in-out infinite;
      }

      .set_1 {
        animation-delay: 0s;
      }

      .set_2 {
        animation-delay: 0.2s;
      }

      .set_3 {
        animation-delay: 0.4s;
      }

      .set_4 {
        animation-delay: 0.6s;
      }

      .set_5 {
        animation-delay: 0.8s;
      }

      @keyframes animationLoading {
        0% {
          transform: scale(0.7);
        }
        50% {
          transform: scale(1);
        }
        100% {
          transform: scale(0.7);
        }
      }

      .slide-left {
        -webkit-animation: slide-left 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        animation: slide-left 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        animation-delay: var(--delay, 0s); /* Độ trễ mặc định */
      }

      @-webkit-keyframes slide-left {
        0% {
          -webkit-transform: translateX(var(--slide-distance, 30px));
          transform: translateX(var(--slide-distance, 30px));
          opacity: 0;
        }
        100% {
          -webkit-transform: translateX(0px);
          transform: translateX(0px);
          opacity: 1;
        }
      }

      @keyframes slide-left {
        0% {
          -webkit-transform: translateX(var(--slide-distance, 30px));
          transform: translateX(var(--slide-distance, 30px));
          opacity: 0;
        }
        100% {
          -webkit-transform: translateX(0px);
          transform: translateX(0px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="initial-loader" class="full-screen">
      <div class="top__full-screen flex items-center">
        <img src="/logo.png" class="default-logo" onerror="this.src = '/logo.png'" />
        <span class="logo-text">%VITE_APP_NAME%</span>
      </div>
      <div class="bot__full-screen">
        <div class="waiting__container full-width center" style="height: 100%">
          <div class="waiting-wrapper">
            <div class="waiting set_1"></div>
            <div class="waiting set_2"></div>
            <div class="waiting set_3"></div>
            <div class="waiting set_4"></div>
            <div class="waiting set_5"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
